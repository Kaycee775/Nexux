    `<div class="grid g21" style="align-items:start"><div class="stack">${card('Follow-up from last period', editable ? `<div class="fld"><textarea id="rf-followup" style="min-height:90px">${esc(s.followup)}</textarea></div>` : `<p style="white-space:pre-wrap">${esc(s.followup || '—')}</p>`, { ic: 'check' })}${card('Highlights, challenges and plans', ['wins|Wins and highlights', 'challenges|Challenges', 'plans|Plans for next period'].map(x => { const [k, l] = x.split('|'); return `<div class="fld" style="margin-bottom:12px"><label>${l}</label>${editable ? `<textarea id="rf-${k}">${esc(s[k] || '')}</textarea>` : `<p style="white-space:pre-wrap">${esc(s[k] || '—')}</p>`}</div>`; }).join(''), { ic: 'edit' })}${card('Figures', `<table class="tbl"><tbody>${figs || '<tr><td>No figures template for this department.</td></tr>'}</tbody></table>${editable ? `<div style="margin-top:10px"><button class="btn sm" data-act="rpt.addfig" data-id="${id}">Add a row</button><button class="btn sm" data-act="rpt.refresh" data-id="${id}">Refresh from system data</button></div>` : ''}`, { ic: 'calc' })}</div>
    <div class="stack">${card('Declaration and submission', `${editable ? `<label class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" id="rf-decl" ${s.declaration ? 'checked' : ''}><span>I declare that the information in this report is accurate to the best of my knowledge.</span></label><div class="row" style="margin-top:14px"><button class="btn" data-act="rpt.save" data-id="${id}">Save draft</button><button class="btn primary" data-act="rpt.submit" data-id="${id}">Submit report</button></div>` : `<p>${s.declaration ? icon('check', 'sm') + ' Declaration signed.' : ''}</p>${r.submittedAt ? `<p class="small muted">Submitted ${fmtDT(r.submittedAt)} by ${esc(userName(r.by))}</p>` : ''}`}`, { ic: 'shield' })}${rev ? card('Review', `<div class="fld"><label>Note to the author</label><textarea id="rf-note"></textarea></div><div class="row" style="margin-top:12px"><button class="btn danger" data-act="rpt.return" data-id="${id}">Return</button><button class="btn primary" data-act="rpt.accept" data-id="${id}">Accept</button></div>`, { ic: 'eye' }) : (r.reviewNote && r.status === 'Accepted' ? card('Review', `<p>${esc(r.reviewNote)}</p><p class="small muted">Accepted by ${esc(userName(r.reviewedBy))}</p>`, { ic: 'eye' }) : '')}${card('Task', `<button class="btn sm" data-act="task.new" data-link-type="report" data-link-id="${id}">Create a task from this report</button>`, { ic: 'clipboard' })}</div></div>`;
}
function readRptForm(id) { const r = DB.get('reports', id); const s = { ...r.sections }; ['followup', 'wins', 'challenges', 'plans'].forEach(k => { const el = $('#rf-' + k); if (el) s[k] = el.value; }); s.figures = (s.figures || []).map((f, i) => { const el = $(`[data-rfig="${i}"]`); return el ? { ...f, v: el.value === '' ? 0 : +el.value } : f; }); const d = $('#rf-decl'); if (d) s.declaration = d.checked; return s; }
ACT['rpt.save'] = el => { DB.set('reports', el.dataset.id, { sections: readRptForm(el.dataset.id) }, { quiet: true }); toast('Draft saved'); };
ACT['rpt.submit'] = el => { const s = readRptForm(el.dataset.id); if (!s.declaration) return toast('Tick the declaration before submitting.', 'warn'); if (!s.followup.trim()) return toast('Add the follow-up section.', 'warn'); const r = DB.get('reports', el.dataset.id); DB.set('reports', r.id, { sections: s, status: 'Submitted', submittedAt: Date.now(), by: r.by || SESS.uid }, { action: 'submit' }); const rv = uniq([deptHead(r.dept), ...usersWithRole('companyexec').map(u => u.id)]).filter(x => x && x !== SESS.uid); rv.forEach(x => notify(x, 'Report to review: ' + r.dept + ' ' + r.type, userName(SESS.uid), '#/reports/form/' + r.id)); toast('Submitted for review'); go('reports/submissions'); };
ACT['rpt.accept'] = el => { DB.set('reports', el.dataset.id, { status: 'Accepted', reviewedBy: SESS.uid, reviewNote: $('#rf-note')?.value || '' }, { action: 'accept' }); const r = DB.get('reports', el.dataset.id); notify(r.by, 'Report accepted: ' + r.dept + ' ' + r.type, '', '#/reports/form/' + r.id); go('reports/review'); };
ACT['rpt.return'] = el => { const n = $('#rf-note')?.value.trim(); if (!n) return toast('Say what needs to change.', 'warn'); DB.set('reports', el.dataset.id, { status: 'Returned', reviewedBy: SESS.uid, reviewNote: n }, { action: 'return' }); const r = DB.get('reports', el.dataset.id); notify(r.by, 'Report returned: ' + r.dept + ' ' + r.type, n, '#/reports/form/' + r.id); go('reports/review'); };
ACT['rpt.addfig'] = el => { const s = readRptForm(el.dataset.id); askText('Add a figure', 'Label', n => { s.figures = (s.figures || []).concat([{ l: n, v: 0 }]); DB.set('reports', el.dataset.id, { sections: s }, { quiet: true }); render(); }, { t: 'text', submit: 'Add' }); };
ACT['rpt.refresh'] = el => { const r = DB.get('reports', el.dataset.id); const s = readRptForm(r.id); const [a, b] = rptRange(r); s.figures = (RPT_FIGS[r.dept] ? RPT_FIGS[r.dept](a, b) : []).map(([l, v]) => ({ l, v, auto: true })).concat((s.figures || []).filter(f => !f.auto)); DB.set('reports', r.id, { sections: s }, { quiet: true }); render(); };
function rptDigest() {
  const ws = UI.digestWeek || weekStart(addDays(today(), -7)); const reps = DB.q('reports').filter(r => r.type === 'Weekly' && r.period === ws && ['Submitted', 'Accepted'].includes(r.status)); const missing = DB.q('depts').filter(d => !['IT', 'Management'].includes(d.name) && !reps.some(r => r.dept === d.name));
  return `<div class="row" style="margin-bottom:12px"><label class="chip"><select data-on="rpt.week" aria-label="Week">${opts([0, 1, 2, 3].map(i => { const w = weekStart(addDays(today(), -7 * (i + 1))); return [w, 'Week of ' + fmtDate(w)]; }), ws)}</select></label><span class="sp"></span><button class="btn" data-act="digest.print">${icon('download', 'sm')} Print or PDF</button></div><div id="digest">${card('Executive weekly digest · week of ' + fmtDate(ws), `${reps.map(r => `<div style="margin-bottom:16px"><b style="font-weight:500;font-size:15px">${esc(r.dept)}</b> ${spill(r.status)}<p style="white-space:pre-wrap;margin:6px 0">${esc(r.sections.followup)}</p>${r.sections.wins ? `<p><b style="font-weight:500">Wins:</b> ${esc(r.sections.wins)}</p>` : ''}${r.sections.challenges ? `<p><b style="font-weight:500">Challenges:</b> ${esc(r.sections.challenges)}</p>` : ''}<div class="row wrap" style="margin-top:6px">${(r.sections.figures || []).map(f => `<span class="tag">${esc(f.l)}: <b style="font-weight:500">${typeof f.v === 'number' ? num(f.v) : esc(f.v)}</b></span>`).join('')}</div></div>`).join('') || '<p class="muted">No reports submitted for this week.</p>'}${missing.length ? `<div class="alert" style="margin-top:8px">${icon('warn', 'sm')}<span>Not yet received: ${esc(missing.map(d => d.name).join(', '))}</span></div>` : ''}`, { ic: 'file' })}</div>`;
}
ACT['rpt.week'] = el => { UI.digestWeek = el.value; render(); };
ACT['digest.print'] = () => printHtml(`<div class="doc"><div class="lh"><b>Executive weekly digest</b><span>${esc(company().name)}</span></div>${$('#digest .card').innerHTML}</div>`);

</script>
<script>
'use strict';
/* Team chat (M-CHAT) - replaces Slack */

const EMOJI = ['👍', '✅', '🎉', '❤️', '👀'];
const presence = uid => { const u = userById(uid); if (u?.dnd) return 'dnd'; const a = DB.q('attendance').find(x => x.userId === uid && x.date === today()); return a && !a.out ? 'online' : 'away'; };
const chMembers = c => c.members || [];
const canSeeCh = c => c.type === 'public' || c.type === 'announce' || chMembers(c).includes(SESS.uid) || can('read.all') && c.type !== 'dm';
const chName = c => c.type === 'dm' ? chMembers(c).filter(i => i !== SESS.uid).map(i => userName(i).split(' ')[0]).join(', ') || 'Just me' : c.name;
const canPost = c => c.type === 'announce' ? (can('chat.announce') || me().role === 'hod') : (chMembers(c).includes(SESS.uid) || c.type === 'public') && !readOnlyUser();
function syncDeptChannels() {
  let changed = false; DB.q('depts').forEach(d => { if (d.name === 'Management') return; const name = d.name.toLowerCase().replace(/ /g, '-'); const mem = coUsers().filter(u => u.dept === d.name || u.role.includes('exec')).map(u => u.id); const c = DB.q('channels').find(x => x.auto && x.dept === d.name); if (!c) { DB.add('channels', { name, type: 'public', members: mem, dept: d.name, auto: true, desc: d.name + ' team channel (from org chart)' }, { quiet: true }); changed = true; } else if (mem.some(i => !c.members.includes(i))) { DB.set('channels', c.id, { members: uniq(c.members.concat(mem)) }, { quiet: true }); changed = true; } });
  const all = coUsers().map(u => u.id); DB.q('channels').filter(c => ['announce'].includes(c.type) || c.name === 'general').forEach(c => { if (all.some(i => !c.members.includes(i))) DB.set('channels', c.id, { members: uniq(c.members.concat(all)) }, { quiet: true }); });
}
PAGES.chat = (parts, q) => {
  syncDeptChannels(); const u = me(); const chs = DB.q('channels').filter(canSeeCh); if (q.c) UI.chCur = q.c; let cur = chs.find(c => c.id === UI.chCur) || chs.find(c => c.name === 'general') || chs[0]; if (!cur) return card('', emptyState('No channels yet.', 'chat'));
  UI.chCur = cur.id; const msgs = DB.q('messages').filter(m => m.ch === cur.id && !m.thread).sort(by(m => m.ts)); const last = msgs.length ? msgs[msgs.length - 1].ts : 0;
  const rd = { ...(u.chatRead || {}) }; rd[cur.id] = Date.now(); if ((u.chatRead || {})[cur.id] !== undefined || last) DB.set('users', u.id, { chatRead: rd }, { quiet: true });
  const unread = c => DB.q('messages').filter(m => m.ch === c.id && m.by !== u.id && m.ts > ((u.chatRead || {})[c.id] || 0) && c.id !== cur.id).length;
  const li = c => `<div class="ci2 ${c.id === cur.id ? 'on' : ''}" data-act="chat.open" data-id="${c.id}">${c.type === 'dm' ? `<span class="av sm ${presence(chMembers(c).find(i => i !== u.id)) === 'online' ? 'on' : ''}" style="background:${hashColor(chName(c))}">${esc(initials(chName(c)))}</span>` : icon(c.type === 'announce' ? 'bell' : c.type === 'private' ? 'lock' : 'tag', 'sm')}<span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(chName(c))}</span>${(u.mute || []).includes(c.id) ? icon('bell', 'sm') : ''}${unread(c) ? `<span class="u">${unread(c)}</span>` : ''}</div>`;
  const thr = UI.thread && DB.get('messages', UI.thread);
  const body = `<div class="chat ${thr ? '' : 'nothr'}"><div class="cl"><div class="row" style="padding:2px 8px"><b style="font-weight:500">${esc(company().short)} chat</b><span class="sp"></span><button class="iconbtn" style="width:32px;height:32px" data-act="chat.newch" aria-label="New channel">${icon('plus', 'sm')}</button></div><h5>Channels</h5>${chs.filter(c => c.type !== 'dm').sort(by(c => (c.type === 'announce' ? '0' : '1') + c.name)).map(li).join('')}<h5>Direct messages <button class="iconbtn" style="width:24px;height:24px;margin-left:auto" data-act="chat.newdm" aria-label="New message">${icon('plus', 'sm')}</button></h5>${chs.filter(c => c.type === 'dm').map(li).join('') || '<div class="small muted" style="padding:6px 10px">No conversations yet.</div>'}<h5>Status</h5><div class="row" style="padding:4px 10px"><label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" data-act="chat.dnd" ${u.dnd ? 'checked' : ''}> Do not disturb</label></div><div class="small muted" style="padding:4px 10px">Online status follows clock-in.</div></div>
  <div class="cm"><div class="cmh">${cur.type === 'dm' ? '' : icon(cur.type === 'announce' ? 'bell' : cur.type === 'private' ? 'lock' : 'tag')}<div class="grow"><b style="font-weight:500">${esc(chName(cur))}</b><div class="small muted">${esc(cur.desc || '')}${cur.type !== 'dm' ? ' · ' + chMembers(cur).length + ' members' : ''}</div></div><label class="chip" style="height:34px">${icon('search', 'sm')}<input id="chsearch" placeholder="Search messages" style="width:140px" aria-label="Search messages"></label><button class="iconbtn" style="width:34px;height:34px" data-act="chat.meet" title="Start a Google Meet" aria-label="Start a call">${icon('phone', 'sm')}</button><button class="iconbtn" style="width:34px;height:34px" data-act="chat.mute" data-id="${cur.id}" title="${(u.mute || []).includes(cur.id) ? 'Unmute' : 'Mute'}" aria-label="Mute">${icon('bell', 'sm')}</button>${cur.type !== 'dm' && cur.type !== 'announce' && (cur.auto ? false : true) ? `<button class="iconbtn" style="width:34px;height:34px" data-act="chat.members" data-id="${cur.id}" aria-label="Members">${icon('users', 'sm')}</button>` : ''}</div><div class="msgs" id="msgs">${msgsHtml(msgs)}</div>${canPost(cur) ? `<div class="composer"><input type="file" id="chfile" class="hide" data-chfile><button class="iconbtn" data-act="chat.attach" aria-label="Attach file">${icon('clip')}</button><button class="iconbtn" data-act="chat.share" aria-label="Share a record">${icon('link')}</button><textarea id="composer" rows="1" placeholder="Message ${esc(chName(cur))}. @name to mention" aria-label="Message"></textarea><button class="btn primary" data-act="chat.send">${icon('send', 'sm')} Send</button></div><div id="pending" class="small muted" style="padding:0 18px 8px"></div>` : `<div class="composer small muted">${cur.type === 'announce' ? 'Only management can post in announcements.' : 'You are not a member of this channel.'}</div>`}</div>
  ${thr ? `<div class="thr"><div class="cmh"><b style="font-weight:500" class="grow">Thread</b><button class="iconbtn" style="width:32px;height:32px" data-act="chat.closethr" aria-label="Close thread">${icon('x', 'sm')}</button></div><div class="msgs">${msgsHtml([thr], true)}${msgsHtml(DB.q('messages').filter(m => m.thread === thr.id).sort(by(m => m.ts)), true)}</div><div class="composer"><textarea id="thrcomposer" rows="1" placeholder="Reply in thread" aria-label="Reply"></textarea><button class="btn primary" data-act="chat.reply" data-id="${thr.id}">Reply</button></div></div>` : ''}</div>`;
  AFTER.push(() => { const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; });
  return pageHead({ title: `Team${pi('chat', true)}chat`, sub: 'All internal communication stays inside the company system. Messages belong to the company.' }) + body;
};
function renderMsg(m, inThread) {
  const reps = inThread ? 0 : DB.q('messages').filter(x => x.thread === m.id).length; const mine = m.by === SESS.uid; const rx = Object.entries(m.rx || {}).filter(([, l]) => l.length);
  return `<div class="msg" data-m="${m.id}">${avatar(userName(m.by), 'sm')}<div class="bd"><div class="nm"><b style="font-weight:500">${esc(userName(m.by))}</b><span>${fmtTime(m.ts)}${new Date(m.ts).toDateString() !== new Date().toDateString() ? ' · ' + fmtDate(isoDate(m.ts)) : ''}${m.edited ? ' · edited' : ''}</span><span class="ma">${EMOJI.slice(0, 3).map(e => `<button data-act="chat.react" data-id="${m.id}" data-e="${e}" aria-label="React ${e}">${e}</button>`).join('')}${inThread ? '' : `<button data-act="chat.thread" data-id="${m.id}">Reply</button>`}<button data-act="msg.task" data-id="${m.id}">To task</button>${mine ? `<button data-act="msg.edit" data-id="${m.id}">Edit</button><button data-act="msg.del" data-id="${m.id}">Delete</button>` : ''}</span></div><div class="tx">${mentionHtml(m.text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')}</div>${(m.files || []).map(f => f.url.startsWith('data:image') ? `<img class="pic" src="${f.url}" alt="${esc(f.name)}">` : `<a class="attach" href="${f.url}" download="${esc(f.name)}">${icon('file', 'sm')} ${esc(f.name)}</a>`).join('')}${m.rec ? recCard(m.rec) : ''}${rx.length ? `<div class="rx">${rx.map(([e, l]) => `<button class="${l.includes(SESS.uid) ? 'me' : ''}" data-act="chat.react" data-id="${m.id}" data-e="${e}">${e} ${l.length}</button>`).join('')}</div>` : ''}${reps ? `<a href="#" data-act="chat.thread" data-id="${m.id}" class="small">${reps} repl${reps > 1 ? 'ies' : 'y'}</a>` : ''}</div></div>`;
}
const msgsHtml = (list, inThread) => list.map(m => renderMsg(m, inThread)).join('') || `<div class="empty">${icon('chat')}<div>No messages yet. Say hello.</div></div>`;
function recCard(r) { const m = { task: ['tasks', t => t.title, id => '#/work/tasks?t=' + id], client: ['clients', c => c.name, id => '#/crm/client/' + id], ticket: ['tickets', t => t.no + ' · ' + t.subject, id => '#/cx/tickets?t=' + id], sale: ['sales', s => s.no, id => '#/crm/sales?s=' + id] }[r.type]; if (!m) return ''; const rec = DB.get(m[0], r.id); return rec ? `<a class="rec" href="${m[2](r.id)}"><b style="font-weight:500">${esc(cap(r.type))}</b> · ${esc(m[1](rec))}</a>` : ''; }
function chatRefresh() { const el = $('#msgs'); if (!el) return false; DB.sync(); const cur = DB.get('channels', UI.chCur); if (!cur) return false; const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80; el.innerHTML = msgsHtml(DB.q('messages').filter(m => m.ch === cur.id && !m.thread).sort(by(m => m.ts))); if (atBottom) el.scrollTop = el.scrollHeight; return true; }
ACT['chat.open'] = el => { UI.chCur = el.dataset.id; UI.thread = null; render(); };
ACT['chat.dnd'] = el => { DB.set('users', SESS.uid, { dnd: el.checked }, { quiet: true }); toast(el.checked ? 'Do not disturb is on' : 'Do not disturb is off'); render(); };
ACT['chat.mute'] = el => { const u = me(); const m = new Set(u.mute || []); m.has(el.dataset.id) ? m.delete(el.dataset.id) : m.add(el.dataset.id); DB.set('users', u.id, { mute: [...m] }, { quiet: true }); render(); };
ACT['chat.closethr'] = () => { UI.thread = null; render(); };
ACT['chat.thread'] = el => { UI.thread = el.dataset.id; render(); };
ACT['chat.meet'] = () => { window.open('https://meet.google.com/new', '_blank', 'noopener'); toast('Google Meet opened. Paste the link into the channel to invite people.'); };
ACT['chat.attach'] = () => $('#chfile').click();
let PENDING = [];
document.addEventListener('change', e => { if (e.target.matches?.('[data-chfile]')) { const f = e.target.files[0]; if (!f) return; if (f.size > 900000) { toast('Files must be under 900 KB.', 'bad'); e.target.value = ''; return; } const rd = new FileReader(); rd.onload = () => { PENDING.push({ name: f.name, url: rd.result }); $('#pending').innerHTML = PENDING.map(p => '📎 ' + esc(p.name)).join(' · ') + ' (attached)'; }; rd.readAsDataURL(f); e.target.value = ''; } });
function postMsg(ch, text, extra = {}) {
  const c = DB.get('channels', ch); const m = DB.add('messages', { ch, by: SESS.uid, text, ts: Date.now(), ...extra }, { quiet: true }); const ment = mentionIds(text);
  const targets = c.type === 'dm' ? chMembers(c).filter(i => i !== SESS.uid) : ment; targets.filter(i => i !== SESS.uid).forEach(i => { const u = userById(i); if (u?.dnd) return; if ((u?.mute || []).includes(ch) && !ment.includes(i)) return; notify(i, c.type === 'dm' ? userName(SESS.uid) + ' sent you a message' : userName(SESS.uid) + ' mentioned you in #' + c.name, text.slice(0, 80), '#/chat?c=' + ch); if (u?.prefs?.app !== false) sendExternal('push', userName(i), text.slice(0, 60)); });
  return m;
}
ACT['chat.send'] = () => { const t = $('#composer'); const v = t.value.trim(); if (!v && !PENDING.length) return; const cur = DB.get('channels', UI.chCur); if (!canPost(cur)) return toast('You cannot post here.', 'bad'); if (cur.type === 'public' && !chMembers(cur).includes(SESS.uid)) DB.set('channels', cur.id, { members: chMembers(cur).concat([SESS.uid]) }, { quiet: true }); postMsg(cur.id, v || '(file)', PENDING.length ? { files: PENDING } : {}); PENDING = []; t.value = ''; render(); };
ACT['chat.reply'] = el => { const t = $('#thrcomposer'); const v = t.value.trim(); if (!v) return; const p = DB.get('messages', el.dataset.id); postMsg(p.ch, v, { thread: p.id }); if (p.by !== SESS.uid) notify(p.by, userName(SESS.uid) + ' replied in a thread', v.slice(0, 80), '#/chat?c=' + p.ch); render(); };
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'composer') { e.preventDefault(); ACT['chat.send'](); } if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'thrcomposer') { e.preventDefault(); ACT['chat.reply']({ dataset: { id: UI.thread } }); } });
ACT['chat.react'] = el => { const m = DB.get('messages', el.dataset.id); const rx = { ...(m.rx || {}) }; const l = new Set(rx[el.dataset.e] || []); l.has(SESS.uid) ? l.delete(SESS.uid) : l.add(SESS.uid); rx[el.dataset.e] = [...l]; DB.set('messages', m.id, { rx }, { quiet: true }); render(); };
ACT['msg.edit'] = el => { const m = DB.get('messages', el.dataset.id); askText('Edit message', 'Message', n => { DB.set('messages', m.id, { text: n, edited: true }, { quiet: true }); render(); }, { vals: { v: m.text }, submit: 'Save' }); };
ACT['msg.del'] = el => confirmDlg('Delete this message?', () => { DB.del('messages', el.dataset.id); render(); }, { danger: true });
ACT['msg.task'] = el => { const m = DB.get('messages', el.dataset.id); openForm({ title: 'Turn message into a task', fields: taskFields(), vals: { title: m.text.slice(0, 80), desc: 'From chat: ' + m.text, assignee: SESS.uid, priority: 'Medium', due: addDays(today(), 3) }, onSubmit: v => { const t = DB.add('tasks', { ...v, followers: [m.by].filter(x => x !== v.assignee), status: 'todo', subtasks: [], checklist: [], comments: [], history: [{ ts: Date.now(), by: SESS.uid, what: 'Created from a chat message' }], deps: [] }); postMsg(m.ch, 'Created a task from this message', { rec: { type: 'task', id: t.id }, thread: m.id }); notify(v.assignee, 'Task assigned to you', v.title, '#/work/tasks?t=' + t.id); toast('Task created'); render(); } }); };
ACT['chat.share'] = () => openForm({ title: 'Share a record', fields: [{ n: 'type', l: 'Record type', t: 'select', req: true, reform: true, blank: false, o: [['task', 'Task'], ['client', 'Client'], ['ticket', 'Ticket'], ['sale', 'Sale']], v: 'task' }, { n: 'id', l: 'Record', t: 'select', req: true, o: v => v.type === 'client' ? DB.q('clients').map(c => [c.id, c.name]) : v.type === 'ticket' ? DB.q('tickets').map(t => [t.id, t.no + ' · ' + t.subject]) : v.type === 'sale' ? DB.q('sales').map(s => [s.id, s.no]) : visibleTasks().map(t => [t.id, t.title]) }, { n: 'note', l: 'Message (optional)' }], vals: { type: 'task' }, submit: 'Share', onSubmit: v => { postMsg(UI.chCur, v.note || 'Shared a ' + v.type, { rec: { type: v.type, id: v.id } }); render(); } });
ACT['chat.newch'] = () => openForm({ title: 'New channel', fields: [{ n: 'name', l: 'Name', req: true, ph: 'e.g. velcrest-project' }, { n: 'type', l: 'Visibility', t: 'select', blank: false, o: [['public', 'Public: everyone in the company'], ['private', 'Private: invited members only']] }, { n: 'desc', l: 'Purpose' }, { n: 'members', l: 'Members', t: 'multi', o: coUsers().map(u => [u.id, u.name.split(' ')[0] + ' ' + (u.name.split(' ')[1] || '')[0] + '.']), show: v => v.type === 'private' }], vals: { type: 'public' }, onSubmit: v => { const mem = v.type === 'public' ? coUsers().map(u => u.id) : uniq([SESS.uid, ...(v.members || [])]); const c = DB.add('channels', { name: v.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), type: v.type, desc: v.desc || '', members: mem }); UI.chCur = c.id; render(); } });
ACT['chat.newdm'] = () => openForm({ title: 'New message', fields: [{ n: 'to', l: 'To (one or more colleagues)', t: 'multi', req: true, o: coUsers().filter(u => u.id !== SESS.uid).map(u => [u.id, u.name]) }], submit: 'Open conversation', onSubmit: v => { const set = uniq([SESS.uid, ...v.to]).sort().join(','); let c = DB.q('channels').find(x => x.type === 'dm' && chMembers(x).slice().sort().join(',') === set); if (!c) c = DB.add('channels', { name: 'dm', type: 'dm', members: uniq([SESS.uid, ...v.to]) }); UI.chCur = c.id; render(); } });
ACT['chat.members'] = el => { const c = DB.get('channels', el.dataset.id); openForm({ title: 'Members of #' + esc(c.name), vals: { m: chMembers(c) }, fields: [{ n: 'm', l: 'Members (company staff only; external guests are not allowed)', t: 'multi', o: coUsers().map(u => [u.id, u.name.split(' ')[0] + ' ' + (u.name.split(' ')[1] || '')[0] + '.']) }], onSubmit: v => { DB.set('channels', c.id, { members: v.m }, { action: 'members' }); render(); } }); };
/* search (CHAT-05) */
document.addEventListener('input', e => {
  if (e.target.id !== 'chsearch') return; const q = e.target.value.trim().toLowerCase(); const box = $('#msgs'); if (!box) return; if (q.length < 2) { chatRefresh(); return; }
  const vis = DB.q('channels').filter(canSeeCh).map(c => c.id); const hits = DB.q('messages').filter(m => vis.includes(m.ch) && (m.text.toLowerCase().includes(q) || (m.files || []).some(f => f.name.toLowerCase().includes(q)))).sort(by(m => m.ts, -1)).slice(0, 30);
  box.innerHTML = `<div class="small muted">${hits.length} result${hits.length === 1 ? '' : 's'} across channels and files you can see</div>` + hits.map(m => { const c = DB.get('channels', m.ch); return `<div class="msg"><div class="bd"><div class="nm"><a href="#/chat?c=${m.ch}" data-act="chat.jump" data-id="${m.ch}"><b style="font-weight:500">${esc(chName(c))}</b></a><span>${esc(userName(m.by))} · ${fmtDT(m.ts)}</span></div><div class="tx">${esc(m.text)}</div>${(m.files || []).map(f => `<span class="attach">${icon('file', 'sm')} ${esc(f.name)}</span>`).join('')}</div></div>`; }).join('');
});
ACT['chat.jump'] = el => { UI.chCur = el.dataset.id; render(); };

</script>
<script>
'use strict';
/* Learning and development (M-LND) - replaces CIDA training records and CAVE exams */

const LND_TABS = () => { const t = [{ k: 'mine', l: 'My learning' }, { k: 'programmes', l: 'Programmes' }, { k: 'calendar', l: 'Training calendar' }, { k: 'assignments', l: 'Assignments' }, { k: 'assessments', l: 'Assessments' }, { k: 'reading', l: 'Reading list' }]; if (can('learn.manage') || can('read.all')) t.push({ k: 'reports', l: 'Reports' }, { k: 'certs', l: 'Certificates' }); return t; };
const lndW = () => can('learn.manage');
const inTarget = (p, uid) => { const u = userById(uid); return p.targets?.all || (p.targets?.depts || []).includes(u?.dept) || (p.targets?.people || []).includes(uid); };

PAGES.learning = (parts, q) => {
  const tl = LND_TABS(); const tab = parts[0] && tl.find(t => t.k === parts[0]) ? parts[0] : 'mine'; let body = '';
  if (tab === 'mine') body = lndMine(); else if (tab === 'programmes') body = lndProgrammes(); else if (tab === 'calendar') body = lndCalendar(); else if (tab === 'assignments') body = lndAssignments(); else if (tab === 'assessments') body = lndAssessments(); else if (tab === 'reading') body = lndReading(); else if (tab === 'reports') body = lndReports(); else if (tab === 'certs') body = lndCerts();
  const p = DB.q('programmes').sort(by(x => x.start, -1))[0];
  return pageHead({ title: `Learning${pi('cap', true)}and development`, sub: p ? `${esc(p.quarter)} theme: ${esc(p.name)} · ${esc(p.theme)}` : 'Training programmes, calendar, assignments and assessments', acts: lndW() ? `<button class="btn primary" data-act="prg.new">${icon('plus', 'sm')} New programme</button>` : '' }) + tabs('learning', tl, tab) + body;
};

/* ----- my learning (LND-06) ----- */
function progScore(p, uid) {
  const sess = DB.q('sessions').filter(s => s.programmeId === p.id && s.date <= today() && (s.invitees || []).includes(uid)); const att = sess.length ? pct(sess.filter(s => s.attendance?.[uid]).length, sess.length) : null;
  const asg = DB.q('assignments').filter(a => a.programmeId === p.id && (a.assignees || []).includes(uid)); const subs = asg.map(a => DB.q('submissions').find(s => s.asgId === a.id && s.userId === uid)); const graded = subs.filter(s => s && s.grade != null); const as = asg.length ? (graded.length ? Math.round(sum(graded, s => s.grade / (DB.get('assignments', s.asgId).max || 1) * 100) / graded.length) : null) : null;
  const tests = DB.q('assessments').filter(a => a.programmeId === p.id).map(a => DB.q('attempts').filter(x => x.assessmentId === a.id && x.userId === uid).sort(by(x => x.score, -1))[0]).filter(Boolean); const ts = tests.length ? Math.round(sum(tests, t => t.score) / tests.length) : null;
  const w = p.weights || { attendance: 20, assignments: 30, tests: 50 }; const parts = [[att, w.attendance], [as, w.assignments], [ts, w.tests]].filter(x => x[0] != null); const total = parts.length ? Math.round(sum(parts, x => x[0] * x[1]) / sum(parts, x => x[1])) : null;
  return { att, as, ts, total, nSess: sess.length, nAsg: asg.length, submitted: subs.filter(Boolean).length };
}
function lndMine() {
  const u = me(); const t = today(); const progs = DB.q('programmes').filter(p => inTarget(p, u.id)); const sess = DB.q('sessions').filter(s => (s.invitees || []).includes(u.id) && s.date >= t).sort(by(s => s.date)).slice(0, 5); const asg = DB.q('assignments').filter(a => (a.assignees || []).includes(u.id)); const open = asg.filter(a => !DB.q('submissions').some(s => s.asgId === a.id && s.userId === u.id)); const att = DB.q('attempts').filter(a => a.userId === u.id).sort(by(a => a.submitted, -1)); const certs = DB.q('certs').filter(c => c.userId === u.id);
  return `<div class="grid g4" style="margin-bottom:16px">${tile({ ic: 'calendar', title: 'Upcoming sessions', value: sess.length, sub: sess[0] ? 'Next: ' + fmtDate(sess[0].date) : 'None scheduled' })}${tile({ cls: 'tea', ic: 'clipboard', title: 'Open assignments', value: open.length, sub: asg.length - open.length + ' submitted' })}${tile({ ic: 'trophy', title: 'Average test score', value: att.length ? Math.round(sum(att, a => a.score) / att.length) + '%' : '—', sub: att.length + ' assessments' })}${tile({ cls: 'dark', ic: 'star', title: 'Certificates', value: certs.length })}</div>
  <div class="grid g2" style="align-items:start">${card('Progress against objectives', progs.length ? progs.map(p => { const s = progScore(p, u.id); return `<div style="margin-bottom:18px"><div class="row"><b style="font-weight:500">${esc(p.name)}</b><span class="tag">${esc(p.quarter)}</span><span class="sp"></span><b style="font-weight:500">${s.total != null ? s.total + '%' : '—'}</b></div>${progress(s.total || 0, 100)}<div class="small muted" style="margin:6px 0">Attendance ${s.att ?? '—'}% · Assignments ${s.as ?? '—'}% (${s.submitted}/${s.nAsg} submitted) · Tests ${s.ts ?? '—'}%</div><ul class="small" style="margin:0;padding-left:18px">${(p.objectives || []).map(o => `<li>${esc(o)}</li>`).join('')}</ul>${(p.materials || []).length ? `<div class="row wrap" style="margin-top:8px">${p.materials.map(m => `<a class="tag" href="${esc(m.u)}" target="_blank" rel="noopener">${icon(m.k === 'link' ? 'link' : 'file', 'sm')} ${esc(m.t)}</a>`).join('')}</div>` : ''}</div>`; }).join('') : emptyState('No programmes are assigned to you yet.', 'cap'), { ic: 'target' })}
  <div class="stack">${card('My upcoming sessions', sess.length ? sess.map(s => `<div class="tilebtn" style="margin-bottom:8px;cursor:default">${icon('calendar')}<span class="grow"><b style="font-weight:500">${esc(s.title)}</b><br><span class="small muted">${fmtDate(s.date)} · ${esc(s.time || '')} · ${esc(s.venue || '')}</span></span></div>`).join('') : '<p class="muted">Nothing scheduled.</p>', { ic: 'calendar' })}${card('Open assignments', open.length ? open.map(a => `<div class="tilebtn" style="margin-bottom:8px" data-act="asg.open" data-id="${a.id}">${icon('clipboard')}<span class="grow"><b style="font-weight:500">${esc(a.title)}</b><br><span class="small muted">Due ${fmtDate(a.due)}</span></span>${spill(a.due < t ? 'Overdue' : 'Open', a.due < t ? 'bad' : 'warn')}</div>`).join('') : '<p class="muted">All submitted.</p>', { ic: 'clipboard' })}${card('Completed training and scores', att.length || certs.length ? att.map(a => `<div class="row" style="padding:4px 0"><span class="grow">${esc(DB.get('assessments', a.assessmentId)?.title || '')}<br><span class="small muted">${fmtDate(isoDate(a.submitted))}</span></span>${spill(a.score + '%', a.score >= 60 ? 'ok' : 'bad')}</div>`).join('') + certs.map(c => `<div class="row" style="padding:4px 0">${icon('trophy', 'sm')}<span class="grow">${esc(c.title)}</span><button class="btn sm" data-act="doc.open" data-code="${c.code}">View</button></div>`).join('') : '<p class="muted">Nothing completed yet.</p>', { ic: 'check' })}</div></div>`;
}

/* ----- programmes (LND-01) ----- */
function lndProgrammes() {
  return `<div class="grid g2">${DB.q('programmes').sort(by(p => p.start, -1)).map(p => { const people = coUsers().filter(u => inTarget(p, u.id) && u.role !== 'auditor'); const sess = DB.q('sessions').filter(s => s.programmeId === p.id); return card(esc(p.name), `<div class="row wrap" style="margin-bottom:8px"><span class="tag">${esc(p.quarter)}</span>${spill(p.end < today() ? 'Completed' : p.start > today() ? 'Upcoming' : 'Running', p.end < today() ? 'ok' : 'warn')}</div><p class="muted" style="margin-bottom:10px">${esc(p.theme)}</p>${kv([['Dates', fmtDate(p.start) + ' – ' + fmtDate(p.end)], ['Audience', p.targets?.all ? 'Everyone' : (p.targets?.depts || []).join(', ') || '—'], ['People', people.length], ['Sessions', sess.length], ['Lead', esc(userName(p.lead))], ['Weights', `Attendance ${p.weights?.attendance}% · Assignments ${p.weights?.assignments}% · Tests ${p.weights?.tests}%`]])}<div class="sec"><h4>Learning objectives</h4><ul style="margin:0;padding-left:18px">${(p.objectives || []).map(o => `<li>${esc(o)}</li>`).join('')}</ul></div><div class="sec"><h4>Materials</h4><div class="row wrap">${(p.materials || []).map(m => `<a class="tag" href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.t)}</a>`).join('') || '<span class="muted">None.</span>'}</div></div>${lndW() ? `<div class="row" style="margin-top:14px"><button class="btn sm" data-act="prg.edit" data-id="${p.id}">Edit</button><button class="btn sm" data-act="ses.new" data-p="${p.id}">Add session</button><button class="btn sm" data-act="asg.new" data-p="${p.id}">Add assignment</button><button class="btn sm" data-act="asm.new" data-p="${p.id}">Add test</button></div>` : ''}`, { ic: 'cap' }); }).join('')}</div>`;
}
const prgFields = [{ n: 'name', l: 'Programme', req: true, ph: 'e.g. Maximizing Chronos' }, { n: 'quarter', l: 'Quarter', req: true, half: true, ph: 'Q4 2026' }, { n: 'theme', l: 'Theme', half: true }, { n: 'start', l: 'Start', t: 'date', req: true, half: true }, { n: 'end', l: 'End', t: 'date', req: true, half: true }, { n: 'objectives', l: 'Learning objectives (one per line)', t: 'textarea' }, { n: 'materials', l: 'Materials (one per line: title | link)', t: 'textarea' }, { n: 'all', l: 'For everyone', t: 'check', reform: true }, { n: 'depts', l: 'Target departments', t: 'multi', o: () => DB.q('depts').map(d => d.name), show: v => !v.all }, { n: 'wa', l: 'Weight: attendance %', t: 'number', half: true }, { n: 'wt', l: 'Weight: assignments %', t: 'number', half: true }, { n: 'we', l: 'Weight: tests %', t: 'number', half: true }];
const prgFieldsR = () => prgFields.map(f => ({ ...f, o: typeof f.o === 'function' ? f.o() : f.o }));
function prgFromForm(v) { return { name: v.name, quarter: v.quarter, theme: v.theme || '', start: v.start, end: v.end, objectives: (v.objectives || '').split('\n').map(x => x.trim()).filter(Boolean), materials: (v.materials || '').split('\n').map(x => x.trim()).filter(Boolean).map(l => { const [t, u] = l.split('|').map(x => x.trim()); return { t, u: u || '#', k: /^https?:/.test(u || '') ? 'link' : 'doc' }; }), targets: { all: !!v.all, depts: v.depts || [] }, weights: { attendance: v.wa ?? 20, assignments: v.wt ?? 30, tests: v.we ?? 50 }, lead: SESS.uid }; }
ACT['prg.new'] = () => openForm({ title: 'New training programme', fields: prgFieldsR(), vals: { start: today(), end: addDays(today(), 90), all: true, wa: 20, wt: 30, we: 50 }, wide: true, onSubmit: v => { DB.add('programmes', prgFromForm(v)); toast('Programme created'); render(); } });
ACT['prg.edit'] = el => { const p = DB.get('programmes', el.dataset.id); openForm({ title: 'Edit programme', fields: prgFieldsR(), wide: true, vals: { ...p, objectives: (p.objectives || []).join('\n'), materials: (p.materials || []).map(m => m.t + ' | ' + m.u).join('\n'), all: p.targets?.all, depts: p.targets?.depts, wa: p.weights?.attendance, wt: p.weights?.assignments, we: p.weights?.tests }, onSubmit: v => { DB.set('programmes', p.id, prgFromForm(v)); render(); } }); };

/* ----- calendar (LND-02) ----- */
function lndCalendar() {
  const mineOnly = UI.lndMine; const ss = DB.q('sessions').filter(s => !mineOnly || (s.invitees || []).includes(SESS.uid)); const ev = ss.map(s => ({ d: s.date, t: (s.time || '') + ' ' + s.title, act: 'ses.open', id: s.id, cls: s.date < today() ? '' : 'i' })).concat(DB.q('events').map(e => ({ d: e.date, t: (e.time || '') + ' ' + e.title + ' (realtors)', cls: 'w', act: modAccess('realtors') ? 'evt.open' : '', id: e.id })));
  return `<div class="row" style="margin-bottom:12px"><div class="row" style="gap:4px"><button class="btn sm ${!mineOnly ? 'dark' : ''}" data-act="lnd.mine" data-v="">Company-wide</button><button class="btn sm ${mineOnly ? 'dark' : ''}" data-act="lnd.mine" data-v="1">My sessions</button></div><span class="sp"></span>${lndW() ? `<button class="btn primary" data-act="ses.new">${icon('plus', 'sm')} New session</button>` : ''}</div><div class="grid g21" style="align-items:start">${card('Calendar', calendarHtml('lndcal', ev), { ic: 'calendar' })}${table({ id: 'sessions', title: 'Sessions', rows: () => ss.map(s => ({ ...s, prog: DB.get('programmes', s.programmeId)?.name || '', n: (s.invitees || []).length, att: Object.values(s.attendance || {}).filter(Boolean).length })), sort: { k: 'date', dir: -1 }, ps: 8, onRow: s => openSession(s.id), cols: [{ k: 'title', l: 'Session', r: s => `<div class="cellmain"><b>${esc(s.title)}</b><span>${esc(s.prog)}</span></div>`, x: s => s.title }, { k: 'date', l: 'When', r: s => fmtDate(s.date) + ' ' + esc(s.time || ''), sv: s => s.date }, { k: 'att', l: 'Attended', num: true, r: s => s.date <= today() ? s.att + '/' + s.n : '—' }] })}</div>`;
}
ACT['lnd.mine'] = el => { UI.lndMine = el.dataset.v; render(); };
ACT['ses.new'] = el => openForm({ title: 'New training session', fields: [{ n: 'programmeId', l: 'Programme', t: 'select', req: true, o: DB.q('programmes').map(p => [p.id, p.name]) }, { n: 'title', l: 'Title', req: true }, { n: 'date', l: 'Date', t: 'date', req: true, half: true }, { n: 'time', l: 'Time', t: 'time', req: true, half: true, v: '10:00' }, { n: 'venue', l: 'Venue or link' }], vals: { programmeId: el?.dataset?.p, time: '10:00' }, onSubmit: v => { const p = DB.get('programmes', v.programmeId); const inv = coUsers().filter(u => inTarget(p, u.id) && u.role !== 'auditor').map(u => u.id); DB.add('sessions', { ...v, invitees: inv, attendance: {}, type: 'Training', reminded: false }); inv.forEach(i => notify(i, 'Training invitation: ' + v.title, fmtDate(v.date) + ' ' + v.time, '#/learning/calendar')); toast('Session created. ' + inv.length + ' invitations sent.'); render(); } });
ACT['ses.open'] = el => openSession(el.dataset.id);
function openSession(id) { openDrawer(() => { const s = DB.get('sessions', id); if (!s) return null; const inv = (s.invitees || []).map(i => userById(i)).filter(Boolean); const w = lndW() && s.date <= today(); return { title: esc(s.title), body: `${kv([['Programme', esc(DB.get('programmes', s.programmeId)?.name)], ['When', fmtDate(s.date) + ' ' + esc(s.time || '')], ['Where', esc(s.venue || '—')], ['Invited', inv.length], ['Attended', Object.values(s.attendance || {}).filter(Boolean).length]])}<div class="sec"><h4>Attendance${s.date > today() ? ' (opens on the day)' : ''}</h4>${inv.map(u => `<label class="row" style="padding:4px 0;gap:10px"><input type="checkbox" data-act="ses.att" data-id="${id}" data-u="${u.id}" ${s.attendance?.[u.id] ? 'checked' : ''} ${w ? '' : 'disabled'}><span class="grow">${esc(u.name)}</span><span class="small muted">${esc(u.dept)}</span></label>`).join('')}</div>`, foot: lndW() ? `<button class="btn" data-act="ses.remind" data-id="${id}">Send reminders</button><button class="btn danger" data-act="ses.del" data-id="${id}">Delete</button>` : '<button class="btn" data-act="ov.close">Close</button>' }; }); }
ACT['ses.att'] = el => { const s = DB.get('sessions', el.dataset.id); DB.set('sessions', s.id, { attendance: { ...s.attendance, [el.dataset.u]: el.checked } }, { quiet: true }); refreshOverlays(); };
ACT['ses.remind'] = el => { const s = DB.get('sessions', el.dataset.id); (s.invitees || []).forEach(i => notify(i, 'Reminder: ' + s.title, fmtDate(s.date) + ' ' + s.time, '#/learning/calendar')); toast('Reminders sent'); };
ACT['ses.del'] = el => confirmDlg('Delete this session?', () => { DB.del('sessions', el.dataset.id); closeAllOverlays(); render(); }, { danger: true });

/* ----- assignments (LND-03) ----- */
function lndAssignments() {
  const mine = !lndW(); const rows = () => DB.q('assignments').filter(a => lndW() || (a.assignees || []).includes(SESS.uid)).map(a => { const subs = DB.q('submissions').filter(s => s.asgId === a.id); const my = subs.find(s => s.userId === SESS.uid); return { ...a, prog: DB.get('programmes', a.programmeId)?.name || '', n: (a.assignees || []).length, done: subs.length, ungraded: subs.filter(s => s.grade == null).length, my }; });
  return table({ id: 'asg', title: 'Assignments', rows, ph: 'Search assignments', sort: { k: 'due', dir: -1 }, onRow: a => openAssignment(a.id), filters: [{ k: 'kind', l: 'Kind', o: ['Book reading', 'Project', 'Task'], get: a => a.kind }], tools: lndW() ? `<button class="btn sm primary" data-act="asg.new">${icon('plus', 'sm')} New assignment</button>` : '', cols: [{ k: 'title', l: 'Assignment', r: a => `<div class="cellmain"><b>${esc(a.title)}</b><span>${esc(a.prog)} · ${esc(a.kind)}</span></div>`, x: a => a.title }, { k: 'due', l: 'Due', r: a => fmtDate(a.due), sv: a => a.due }, { k: 'done', l: 'Submitted', num: true, r: a => lndW() ? a.done + '/' + a.n : (a.my ? spill(a.my.grade != null ? a.my.grade + '/' + a.max : 'Submitted', 'ok') : spill(a.due < today() ? 'Overdue' : 'Open', a.due < today() ? 'bad' : 'warn')), x: a => a.done + '/' + a.n }, { k: 'ungraded', l: 'To grade', num: true, r: a => lndW() ? (a.ungraded ? `<b>${a.ungraded}</b>` : 0) : '' }] });
}

ACT['asm.new'] = el => openForm({ title: 'New online test', wide: true, fields: [{ n: 'programmeId', l: 'Programme', t: 'select', req: true, o: DB.q('programmes').map(p => [p.id, p.name]) }, { n: 'title', l: 'Title', req: true }, { n: 'minutes', l: 'Time limit (minutes)', t: 'number', req: true, min: 1, half: true }, { n: 'pass', l: 'Pass mark %', t: 'number', req: true, min: 1, max: 100, half: true }, { n: 'count', l: 'Questions drawn at random per attempt', t: 'number', min: 1 }, { n: 'bank', l: 'Question bank', t: 'textarea', req: true, hint: 'One question per line. Multiple choice: Question | option A; option B; option C | index of the correct option (0 = first). Short answer: Question | = accepted answer; another accepted answer' }], vals: { programmeId: el?.dataset?.p, minutes: 10, pass: 60, bank: 'What time is resumption? | 7:30; 8:30; 9:30 | 1\nWhere do clients pay? | = Tri-Pay' }, onSubmit: v => { const bank = v.bank.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [q, o, a] = l.split('|').map(x => x.trim()); if (o && o.startsWith('=')) return { q, short: o.slice(1).split(';').map(x => x.trim().toLowerCase()).filter(Boolean) }; return { q, o: (o || '').split(';').map(x => x.trim()), a: +a || 0 }; }).filter(x => x.q && (x.short || x.o.length > 1)); if (!bank.length) { toast('Add at least one valid question.', 'bad'); return false; } DB.add('assessments', { programmeId: v.programmeId, title: v.title, minutes: v.minutes, pass: v.pass, count: Math.min(v.count || bank.length, bank.length), bank, kind: 'Online', created: Date.now() }); toast('Test created with ' + bank.length + ' questions'); render(); } });
let EXAM = null;
ACT['asm.take'] = el => {
  const a = DB.get('assessments', el.dataset.id); if (DB.q('attempts').some(x => x.assessmentId === a.id && x.userId === SESS.uid)) return toast('You have already taken this test.', 'warn');
  const qs = a.bank.map((q, i) => ({ ...q, i })).sort(() => Math.random() - .5).slice(0, a.count || a.bank.length); EXAM = { a, qs, end: Date.now() + a.minutes * 60000, ans: {} };
  const id = openModal({ title: esc(a.title), xl: true, noscrim: true, live: false, body: examBody(), foot: `<span class="grow small muted">Time left: <b id="examclock" style="font-weight:500">${a.minutes}:00</b></span><button class="btn primary" data-act="exam.submit">Submit test</button>` });
  EXAM.timer = setInterval(() => { const left = EXAM ? EXAM.end - Date.now() : 0; const c = $('#examclock'); if (!c || !EXAM) { clearInterval(EXAM?.timer); return; } c.textContent = Math.max(0, Math.floor(left / 60000)) + ':' + String(Math.max(0, Math.floor(left / 1000) % 60)).padStart(2, '0'); if (left <= 0) ACT['exam.submit'](null, true); }, 500);

<script>

function integrityChecks() {
  const out = []; const live = DB.q('sales').filter(s => !['revoked', 'expired'].includes(s.status));
  const dbl = DB.q('plots').filter(p => live.filter(s => s.plotIds.includes(p.id)).length > 1); out.push({ k: 'Double allocation: a plot in more than one active sale', items: dbl.map(plotLabel) });
  out.push({ k: 'Sold plots without a client or sale', items: DB.q('plots').filter(p => ['allocated', 'paid', 'documented'].includes(p.status) && (!p.clientId || !activeSaleOfPlot(p.id))).map(plotLabel) });
  out.push({ k: 'Sales paid above their total', items: live.filter(s => s.paid > s.total + 1).map(s => s.no) });
  out.push({ k: 'Sales whose paid amount differs from confirmed payments', items: live.filter(s => !s.migrated && Math.abs(s.paid - sum(DB.q('payments').filter(p => p.saleId === s.id && p.status === 'confirmed'), p => p.amount)) > 1).map(s => s.no) });
  out.push({ k: 'Unbalanced journals', items: DB.q('journals').filter(j => j.status === 'posted' && Math.abs(sum(j.lines, l => l.dr) - sum(j.lines, l => l.cr)) > .01).map(j => j.no) });
  const tb = trialBalance(); out.push({ k: 'Trial balance debits and credits differ', items: Math.abs(sum(tb, a => a.dr) - sum(tb, a => a.cr)) > 1 ? ['Dr ' + money(sum(tb, a => a.dr)) + ' vs Cr ' + money(sum(tb, a => a.cr))] : [] });
  const ph = {}; DB.q('clients').forEach(c => { const k = phoneNorm(c.phone); (ph[k] = ph[k] || []).push(c); }); out.push({ k: 'Duplicate clients (same phone number)', items: Object.values(ph).filter(l => l.length > 1).map(l => l.map(c => c.name).join(' / ')) });
  out.push({ k: 'Confirmed payments without a ledger entry', items: DB.q('payments').filter(p => p.status === 'confirmed' && p.channel !== 'migration' && !DB.q('journals').some(j => j.source === 'payment' && j.ref === p.id)).map(p => p.receiptNo || p.id) });
  out.push({ k: 'Plots with an expired reservation still held', items: DB.q('plots').filter(p => p.status === 'reserved' && p.reservedUntil && p.reservedUntil < today()).map(plotLabel) });
  return out;
}

  const sold = DB.q('plots').filter(p => ['allocated', 'paid', 'documented'].includes(p.status)); const noSale = sold.filter(p => !activeSaleOfPlot(p.id)); const orphan = DB.q('sales').filter(s => !['revoked', 'expired'].includes(s.status) && s.plotIds.some(i => !['allocated', 'paid', 'documented', 'reserved'].includes(DB.get('plots', i)?.status)));
  const byE = DB.q('estates').map(e => { const ps = DB.q('plots').filter(p => p.estate === e.id); const ss = DB.q('sales').filter(s => s.estateId === e.id && !['revoked', 'expired'].includes(s.status)); return { e: e.name, n: ps.length, av: ps.filter(p => p.status === 'available').length, so: ps.filter(p => ['allocated', 'paid', 'documented'].includes(p.status)).length, v: sum(ss, s => s.total), p: sum(ss, s => s.paid), b: sum(ss, s => saleBalance(s)) }; });
  openModal({ title: 'Reconciliation report', xl: true, live: false, body: `<div class="grid g3" style="margin-bottom:14px">${tile({ ic: 'estate', title: 'Sold plots', value: sold.length, sub: noSale.length + ' without a matching sale' })}${tile({ cls: 'tea', ic: 'receipt', title: 'Active sales', value: DB.q('sales').filter(s => !['revoked', 'expired'].includes(s.status)).length, sub: orphan.length + ' with plot mismatch' })}${tile({ cls: 'dark', ic: 'scale', title: 'Total balance', value: moneyShort(sum(byE, x => x.b)) })}</div><table class="tbl"><thead><tr><th>Estate</th><th class="num">Plots</th><th class="num">Available</th><th class="num">Sold</th><th class="num">Contract value</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>${byE.map(x => `<tr><td>${esc(x.e)}</td><td class="num">${x.n}</td><td class="num">${x.av}</td><td class="num">${x.so}</td><td class="num">${money(x.v)}</td><td class="num">${money(x.p)}</td><td class="num">${money(x.b)}</td></tr>`).join('')}</tbody></table>${noSale.length ? `<div class="alert" style="margin-top:12px">${icon('warn', 'sm')}<span>Sold plots without a client and price in the payment tracker: ${esc(noSale.slice(0, 8).map(plotLabel).join(', '))}</span></div>` : ''}`, foot: `<button class="btn" data-act="ov.close">Close</button><button class="btn primary" data-act="recon.print">Print or save PDF</button>` });
};
ACT['recon.print'] = () => printHtml('<div class="doc"><div class="lh"><b>Migration reconciliation</b><span>' + esc(company().name) + ' · ' + fmtDate(today()) + '</span></div>' + $('.modal .mb').innerHTML + '</div>');

/* ----- audit log (PLT-07) ----- */
function admAudit() {
  const rows = () => DB.q('audit').slice().sort(by(a => a.ts, -1));
  return `<div class="alert info" style="margin-bottom:14px">${icon('lock', 'sm')}<span>Every change, approval, export and login is written here. The log is append-only: entries cannot be edited or deleted by anyone, including administrators. Financial records are kept for 7 years.</span></div>` + table({ id: 'audit', title: 'Audit log', rows, ph: 'Search the audit log', ps: 15, sort: { k: 'ts', dir: -1 }, filters: [{ k: 'action', l: 'Action', o: uniq(DB.q('audit').map(a => a.action)).sort(), get: a => a.action }, { k: 'entity', l: 'Record type', o: uniq(DB.q('audit').map(a => a.entity)).sort(), get: a => a.entity }, { k: 'user', l: 'User', o: uniq(DB.q('audit').map(a => a.user)).map(u => [u, userName(u)]), get: a => a.user }], cols: [{ k: 'ts', l: 'When', r: a => fmtDT(a.ts), sv: a => a.ts }, { k: 'name', l: 'Who' }, { k: 'action', l: 'Action', r: a => `<span class="tag">${esc(a.action)}</span>` }, { k: 'entity', l: 'Record' }, { k: 'detail', l: 'Detail', r: a => `<span class="small">${esc(a.detail)}</span>`, x: a => a.detail }] });
}

/* ----- chat administration (CHAT-08) ----- */
function admChat() {
  const rows = () => DB.q('channels').map(c => ({ ...c, n: DB.q('messages').filter(m => m.ch === c.id).length, cn: chName(c) }));
  const gone = DB.d.users.filter(u => u.off && u.co.includes(CO));
  return `<div class="alert info" style="margin-bottom:14px">${icon('chat', 'sm')}<span>Messages belong to the company. Admins can export a channel, set retention and remove access when staff leave. External guests are not allowed: only people with a Tri-OP account can be added.</span></div>` + table({ id: 'chadm', title: 'Channels', rows, ph: 'Search channels', cols: [{ k: 'cn', l: 'Channel', r: c => `${icon(c.type === 'dm' ? 'user' : c.type === 'private' ? 'lock' : 'tag', 'sm')} ${esc(c.cn)}`, x: c => c.cn }, { k: 'type', l: 'Type', r: c => spill(c.type, 'mute') }, { k: 'members', l: 'Members', num: true, r: c => (c.members || []).length, x: c => (c.members || []).length }, { k: 'n', l: 'Messages', num: true }, { k: 'a', l: '', r: c => `<button class="btn sm" data-act="ch.export" data-id="${c.id}">Export</button>`, x: () => '' }] }) + `<div class="grid g2" style="margin-top:16px">${card('Retention', `<p class="muted" style="margin-bottom:10px">Messages older than <b>${DB.setting('retentionDays')} days</b> can be purged. Set the period under Settings.</p><button class="btn" data-act="ch.purge">Purge messages older than ${DB.setting('retentionDays')} days</button>`, { ic: 'clock' })}${card('Leavers', gone.length ? gone.map(u => `<div class="row" style="padding:3px 0">${userChip(u.id)}<span class="sp"></span>${spill('Access removed', 'ok')}</div>`).join('') : '<p class="muted">When a user is disabled or exits, they are removed from private channels and direct messages stay with the company.</p>', { ic: 'logout' })}</div>`;
}
ACT['ch.export'] = el => { const c = DB.get('channels', el.dataset.id); const ms = DB.q('messages').filter(m => m.ch === c.id).sort(by(m => m.ts)); audit('export', 'channels', c.id, ms.length + ' messages'); download('chat-' + chName(c) + '-' + today() + '.csv', toCSV([{ l: 'Time', x: m => new Date(m.ts).toISOString() }, { l: 'Author', x: m => userName(m.by) }, { l: 'Message', x: m => m.text }], ms), 'text/csv'); };
ACT['ch.purge'] = () => confirmDlg('Permanently remove messages older than ' + DB.setting('retentionDays') + ' days across all channels?', () => { const cut = Date.now() - DB.setting('retentionDays') * 864e5; const old = DB.q('messages').filter(m => m.ts < cut); old.forEach(m => DB.purge('messages', m.id)); toast(old.length + ' messages purged'); render(); }, { danger: true, yes: 'Purge' });

/* Zoho Projects migration (OPS-12) */
ACT['adm.zoho'] = () => importDialog({ title: 'Import open projects and tasks from Zoho Projects', cols: ['project', 'task', 'assignee_email', 'due', 'status', 'priority', 'comment'], example: 'Velcrest site works,Order drainage materials,dayo.salami@triconna.example,2026-11-05,Open,High,Supplier quoted last week', validate: r => { if (!r.project || !r.task) return { err: 'Project and task are required' }; const u = DB.d.users.find(x => x.email === (r.assignee_email || '').toLowerCase() && x.co.includes(CO)); if (r.assignee_email && !u) return { err: 'No Tri-OP user with email ' + r.assignee_email }; if (r.due && !/^\d{4}-\d{2}-\d{2}$/.test(r.due)) return { err: 'Due date must be YYYY-MM-DD' }; const st = /closed|complete|done/i.test(r.status || '') ? 'done' : /progress|doing/i.test(r.status || '') ? 'doing' : 'todo'; const pr = PRIORITIES.find(x => x.toLowerCase() === String(r.priority || '').toLowerCase()) || 'Medium'; return { rec: { project: r.project.trim(), task: r.task.trim(), assignee: u ? u.id : SESS.uid, due: r.due || '', status: st, priority: pr, comment: r.comment || '' } }; }, commit: recs => { recs.forEach(r => { const prj = DB.q('projects').find(p => p.name.toLowerCase() === r.project.toLowerCase() && !p.template) || DB.add('projects', { name: r.project, desc: 'Imported from Zoho Projects', owner: SESS.uid, dept: me().dept, status: 'Active', start: today(), due: addDays(today(), 60), team: [], milestones: [], budget: 0, costs: [], photos: [], comments: [], imported: true }, { quiet: true }); DB.add('tasks', { title: r.task, project: prj.id, assignee: r.assignee, due: r.due, priority: r.priority, status: r.status, followers: [], subtasks: [], checklist: [], deps: [], comments: r.comment ? [{ by: SESS.uid, ts: Date.now(), text: r.comment }] : [], history: [{ ts: Date.now(), by: SESS.uid, what: 'Imported from Zoho Projects' }], imported: true, doneAt: r.status === 'done' ? Date.now() : null }, { quiet: true }); }); } });

/* Scheduled reports (DSH-05) */
function scheduleText(s) { const t = today(); if (s.type === 'collections') { const pay = DB.q('payments').filter(p => p.status === 'confirmed' && p.date === t); return `Collections ${fmtDate(t)}: ${money(sum(pay, p => p.amount))} from ${pay.length} confirmed payments. Overdue receivables: ${money(sum(overdueItems(), o => o.out))}. Payments awaiting confirmation: ${Stat.pendingPay().length}.`; } if (s.type === 'sales') { const m = monthKey(t); const ss = Stat.sales(m); return `Sales ${monthLabel(m)} to date: ${ss.length} sales worth ${money(sum(ss, x => x.total))}.`; } return 'Open approvals: ' + DB.q('approvals').filter(a => a.status === 'pending').length + '. Open tickets: ' + DB.q('tickets').filter(x => !['Resolved', 'Closed'].includes(x.status)).length + '.'; }
function runSchedule(s) { const txt = scheduleText(s); (s.recipients || []).forEach(u => { notify(u, s.name, txt, '#/dashboard'); sendExternal('email', userById(u)?.email || u, s.name + ': ' + txt); }); return txt; }
Jobs.extra.push(() => { let n = 0; const d = new Date(); DB.q('schedules').filter(s => s.active && s.lastRun !== today()).forEach(s => { const [h, m] = (s.time || '18:00').split(':').map(Number); if (d.getHours() * 60 + d.getMinutes() >= h * 60 + m) { runSchedule(s); DB.set('schedules', s.id, { lastRun: today() }, { quiet: true }); n++; } }); return n; });
function schedulesCard() {
  return card('Scheduled reports by email', table({ id: 'sched', title: 'Scheduled reports', rows: () => DB.q('schedules'), export: false, empty: 'No schedules yet.', tools: can('admin.config') ? `<button class="btn sm primary" data-act="sched.new">${icon('plus', 'sm')} New schedule</button>` : '', cols: [{ k: 'name', l: 'Report' }, { k: 'time', l: 'Sent daily at', r: s => esc(s.time) + ' WAT' }, { k: 'recipients', l: 'To', r: s => esc((s.recipients || []).map(userName).join(', ')), x: s => (s.recipients || []).map(userName).join(', ') }, { k: 'active', l: 'Status', r: s => spill(s.active ? 'Active' : 'Paused', s.active ? 'ok' : 'mute'), x: s => s.active ? 'Active' : 'Paused' }, { k: 'a', l: '', r: s => can('admin.config') ? `<button class="btn sm" data-act="sched.now" data-id="${s.id}">Send now</button><button class="btn sm ghost" data-act="sched.toggle" data-id="${s.id}">${s.active ? 'Pause' : 'Resume'}</button>` : '', x: () => '' }] }), { ic: 'mail' });
}
ACT['sched.toggle'] = el => { const s = DB.get('schedules', el.dataset.id); DB.set('schedules', s.id, { active: !s.active }); render(); };
ACT['sched.now'] = el => { const s = DB.get('schedules', el.dataset.id); const t = runSchedule(s); openModal({ title: 'Sent: ' + esc(s.name), live: false, body: `<p>${esc(t)}</p><p class="small muted">Delivered to ${esc((s.recipients || []).map(userName).join(', '))}.</p>`, foot: '<button class="btn" data-act="ov.close">Close</button>' }); };
ACT['sched.new'] = () => openForm({ title: 'New scheduled report', fields: [{ n: 'name', l: 'Name', req: true }, { n: 'type', l: 'Report', t: 'select', blank: false, o: [['collections', 'Daily collections summary'], ['sales', 'Sales to date'], ['ops', 'Operations snapshot']] }, { n: 'time', l: 'Send at', t: 'time', req: true, v: '18:00' }, { n: 'recipients', l: 'Recipients', t: 'multi', req: true, o: coUsers().map(u => [u.id, u.name]) }], vals: { time: '18:00', type: 'collections' }, onSubmit: v => { DB.add('schedules', { ...v, active: true }); render(); } });

</script>
<script>window.addEventListener('DOMContentLoaded', boot);</script>
