ACT['per.tick'] = el => { const p = DB.get('periods', el.dataset.id); DB.set('periods', p.id, { checklist: { ...(p.checklist || {}), [el.dataset.k]: el.checked } }, { quiet: true }); refreshOverlays(); };
ACT['per.lock'] = el => { DB.set('periods', el.dataset.id, { status: 'closed', closedAt: Date.now(), closedBy: SESS.uid }, { action: 'period-close' }); closeAllOverlays(); toast(monthLabel(el.dataset.id) + ' is closed'); render(); };
ACT['per.reopen'] = el => askText('Reopen ' + monthLabel(el.dataset.id), 'Reason (logged permanently)', n => { const p = DB.get('periods', el.dataset.id); DB.set('periods', p.id, { status: 'open', reopened: (p.reopened || []).concat([{ ts: Date.now(), by: SESS.uid, reason: n }]) }, { action: 'period-reopen' }); toast('Period reopened and logged'); render(); }, { submit: 'Reopen period' });
ACT['per.request'] = el => askText('Request reopen of ' + monthLabel(el.dataset.id), 'Why does it need reopening?', n => { startApproval({ type: 'reopen', ref: el.dataset.id, title: 'Reopen ' + monthLabel(el.dataset.id), meta: { reason: n, link: '#/accounting/periods' } }); toast('Request sent to an executive'); render(); });

/* ---------- tax (ACC-06) ---------- */
function accTax() {
  const months = Stat.months(4).reverse(); const rowsV = months.map(m => { const out = sum(DB.q('invoices').filter(i => ['sent', 'paid'].includes(i.status) && monthKey(i.issued) === m), i => i.vat); const inn = sum(DB.q('bills').filter(b => monthKey(b.date) === m), b => b.vat); const wht = sum(DB.q('bills').filter(b => monthKey(b.date) === m), b => b.whtAmt || 0); return { id: m, m, out, inn, net: out - inn, wht }; });
  const taxes = () => DB.q('taxes').map(t => ({ ...t }));
  return `<div class="alert info" style="margin-bottom:14px">${icon('receipt', 'sm')}<span>VAT ${DB.setting('vatRate')}% and withholding tax ${DB.setting('whtRate')}% are computed from invoices and vendor bills. Remit by the 21st of the following month.</span></div>` + table({ id: 'vat', title: 'VAT and WHT by month', rows: () => rowsV, export: true, cols: [{ k: 'm', l: 'Month', r: r => monthLabel(r.m), x: r => r.m }, { k: 'out', l: 'Output VAT', num: true, r: r => money(r.out) }, { k: 'inn', l: 'Input VAT', num: true, r: r => money(r.inn) }, { k: 'net', l: 'Net VAT payable', num: true, r: r => money(r.net) }, { k: 'wht', l: 'WHT deducted', num: true, r: r => money(r.wht) }, { k: 'a', l: '', r: r => accW() ? `<button class="btn sm" data-act="tax.compute" data-m="${r.m}">Add to remittances</button>` : '', x: () => '' }] }) +
    `<div style="margin-top:16px">${table({ id: 'taxes', title: 'Statutory remittances', rows: taxes, empty: 'No remittances tracked yet.', sort: { k: 'period', dir: -1 }, cols: [{ k: 'type', l: 'Tax', r: t => `<b style="font-weight:500">${esc(t.type)}</b>` }, { k: 'period', l: 'Period', r: t => monthLabel(t.period), x: t => t.period }, { k: 'amount', l: 'Amount', num: true, r: t => money(t.amount) }, { k: 'due', l: 'Due', r: t => fmtDate(t.due) }, { k: 'status', l: 'Status', r: t => spill(t.status === 'Pending' && t.due < today() ? 'Overdue' : t.status), x: t => t.status }, { k: 'a', l: '', r: t => t.status === 'Pending' && accW() ? `<button class="btn sm primary" data-act="tax.remit" data-id="${t.id}">Mark remitted</button>` : '', x: () => '' }] })}</div>`;
}
ACT['tax.compute'] = el => { const m = el.dataset.m; const out = sum(DB.q('invoices').filter(i => ['sent', 'paid'].includes(i.status) && monthKey(i.issued) === m), i => i.vat), inn = sum(DB.q('bills').filter(b => monthKey(b.date) === m), b => b.vat), wht = sum(DB.q('bills').filter(b => monthKey(b.date) === m), b => b.whtAmt || 0); const due = addMonths(m + '-01', 1).slice(0, 8) + '21'; if (!DB.q('taxes').some(t => t.type === 'VAT' && t.period === m) && out - inn > 0) DB.add('taxes', { type: 'VAT', period: m, amount: out - inn, out, inn, status: 'Pending', due }); if (!DB.q('taxes').some(t => t.type === 'WHT' && t.period === m) && wht > 0) DB.add('taxes', { type: 'WHT', period: m, amount: wht, status: 'Pending', due }); toast('Remittances updated'); render(); };
ACT['tax.remit'] = el => { const t = DB.get('taxes', el.dataset.id); try { const lines = t.type === 'VAT' ? [{ acct: '2300', dr: Math.max(t.out || t.amount, t.amount) }, { acct: '1200', cr: (t.inn || 0) }, { acct: '1010', cr: t.amount }].filter(l => l.dr || l.cr) : [{ acct: '2310', dr: t.amount }, { acct: '1010', cr: t.amount }]; if (t.type === 'VAT') { const out = t.out || t.amount; lines.length = 0; lines.push({ acct: '2300', dr: out }, ...(t.inn ? [{ acct: '1200', cr: t.inn }] : []), { acct: '1010', cr: out - (t.inn || 0) }); } postJournal({ date: today(), memo: t.type + ' remittance ' + monthLabel(t.period), lines, source: 'tax', ref: t.id, quiet: true }); DB.set('taxes', t.id, { status: 'Remitted', remittedAt: Date.now() }, { action: 'remit' }); toast('Remittance posted'); render(); } catch (e) { toast(e.message, 'bad'); } };

/* ---------- fixed assets (ACC-08, OPS-14) ---------- */
const assetDep = a => Math.round(a.cost / (a.life * 12)); const assetAcc = a => Math.min(a.cost, assetDep(a) * Math.max(0, Math.floor(daysBetween(a.acquired, a.depTo || today()) / 30.4)));
function accAssets() {
  const rows = () => DB.q('assets').map(a => ({ ...a, dep: assetDep(a), acc: assetAcc(a), nbv: a.cost - assetAcc(a), holder: a.assignedTo ? userName(a.assignedTo) : '' }));
  const mk = monthKey(today());
  return `<div class="grid g3" style="margin-bottom:16px">${tile({ ic: 'layers', title: 'Cost', value: moneyShort(sum(DB.q('assets'), a => a.cost)), sub: DB.q('assets').length + ' assets' })}${tile({ cls: 'tea', ic: 'trend', title: 'Net book value', value: moneyShort(sum(rows(), a => a.nbv)) })}${tile({ cls: 'dark', ic: 'calendar', title: 'Monthly depreciation', value: moneyShort(sum(DB.q('assets'), assetDep)), sub: DB.q('journals').some(j => j.source === 'depr' && j.ref === mk) ? 'Posted for ' + monthLabel(mk) : 'Not yet posted for ' + monthLabel(mk) })}</div>` + table({ id: 'assets', title: 'Fixed asset register', rows, ph: 'Search assets', filters: [{ k: 'category', l: 'Category', o: ['Vehicle', 'Equipment', 'Furniture', 'Property', 'Other'], get: a => a.category }], tools: accW() ? `<button class="btn sm" data-act="depr.post">Post ${monthLabel(mk)} depreciation</button><button class="btn sm primary" data-act="asset.new">${icon('plus', 'sm')} Add asset</button>` : '', onRow: a => accW() || can('hr.write') || can('inv.write') ? assignAsset(a.id) : null, cols: [{ k: 'tag', l: 'Tag' }, { k: 'name', l: 'Asset' }, { k: 'category', l: 'Category' }, { k: 'acquired', l: 'Acquired', r: a => fmtDate(a.acquired), sv: a => a.acquired }, { k: 'cost', l: 'Cost', num: true, r: a => money(a.cost) }, { k: 'acc', l: 'Accum. depn', num: true, r: a => money(a.acc) }, { k: 'nbv', l: 'Book value', num: true, r: a => money(a.nbv) }, { k: 'holder', l: 'Assigned to', r: a => esc(a.holder || '—') }] });
}
ACT['asset.new'] = () => openForm({ title: 'Add fixed asset', fields: [{ n: 'name', l: 'Asset', req: true }, { n: 'category', l: 'Category', t: 'select', req: true, o: ['Vehicle', 'Equipment', 'Furniture', 'Property', 'Other'], half: true }, { n: 'cost', l: 'Cost (₦)', t: 'money', req: true, min: 1, half: true }, { n: 'acquired', l: 'Acquired', t: 'date', req: true, v: today(), half: true }, { n: 'life', l: 'Useful life (years)', t: 'number', req: true, min: 1, v: 5, half: true }, { n: 'assignedTo', l: 'Assign to', t: 'select', o: coUsers().map(u => [u.id, u.name]), blank: 'Unassigned' }, { n: 'pay', l: 'Paid from bank (posts Dr fixed assets / Cr bank)', t: 'check', v: true }], onSubmit: v => { try { const a = DB.add('assets', { tag: 'AST-' + String(DB.seq('asset')).padStart(3, '0'), name: v.name, category: v.category, cost: v.cost, life: v.life, acquired: v.acquired, assignedTo: v.assignedTo || '', status: 'In use' }); if (v.pay) postJournal({ date: v.acquired > today() ? today() : v.acquired, memo: 'Purchase of ' + v.name, lines: [{ acct: '1500', dr: v.cost }, { acct: '1010', cr: v.cost }], source: 'asset', ref: a.id, quiet: true }); render(); } catch (e) { toast(e.message, 'bad'); return false; } } });
function assignAsset(id) { const a = DB.get('assets', id); openForm({ title: 'Assign ' + a.name, vals: { assignedTo: a.assignedTo || '', status: a.status }, fields: [{ n: 'assignedTo', l: 'Assigned to', t: 'select', o: coUsers().map(u => [u.id, u.name]), blank: 'Unassigned' }, { n: 'status', l: 'Status', t: 'select', blank: false, o: ['In use', 'In storage', 'Under repair', 'Disposed'] }], onSubmit: v => { DB.set('assets', id, v, { action: 'assign' }); render(); } }); }
ACT['depr.post'] = () => { const m = monthKey(today()); if (DB.q('journals').some(j => j.source === 'depr' && j.ref === m)) return toast('Depreciation for ' + monthLabel(m) + ' is already posted.', 'warn'); const total = sum(DB.q('assets').filter(a => a.status !== 'Disposed'), assetDep); try { postJournal({ date: today(), memo: 'Depreciation ' + monthLabel(m), lines: [{ acct: '5900', dr: total, dept: 'Finance' }, { acct: '1590', cr: total }], source: 'depr', ref: m, quiet: true }); toast('Depreciation posted: ' + money(total)); render(); } catch (e) { toast(e.message, 'bad'); } };

/* ---------- payroll journal (ACC-07) ---------- */
function accPayroll() {
  const rows = () => DB.q('journals').filter(j => j.source === 'payroll').map(j => ({ ...j }));
  return `<div class="alert info" style="margin-bottom:14px">${icon('briefcase', 'sm')}<span>Tri-OP does not run payroll. HR exports payroll inputs (attendance, deductions, allowances) to your payroll provider; when it returns totals, post the payroll journal here.</span></div>` + table({ id: 'payroll', title: 'Payroll journals', rows, empty: 'No payroll journals posted yet.', tools: accW() ? `<button class="btn sm primary" data-act="pay.journal">${icon('plus', 'sm')} Post payroll journal</button>` : '', onRow: j => openJournal(j.id), cols: [{ k: 'date', l: 'Date', r: j => fmtDate(j.date) }, { k: 'memo', l: 'Memo' }, { k: 'total', l: 'Gross', num: true, r: j => money(j.total) }, { k: 'no', l: 'Journal' }] });
}
ACT['pay.journal'] = () => openForm({ title: 'Post payroll journal', fields: [{ n: 'month', l: 'Payroll month', t: 'select', req: true, o: Stat.months(4).map(m => [m, monthLabel(m)]), blank: false, v: monthKey(today()) }, { n: 'gross', l: 'Gross pay (₦)', t: 'money', req: true, min: 1 }, { n: 'paye', l: 'PAYE (₦)', t: 'money', half: true, v: 0 }, { n: 'pension', l: 'Pension (₦)', t: 'money', half: true, v: 0 }, { n: 'nhf', l: 'NHF and other (₦)', t: 'money', half: true, v: 0 }, { n: 'net', t: 'html', html: '<p class="small muted">Net pay is gross less deductions. Statutory remittance itself happens outside Tri-OP.</p>' }], onSubmit: v => { const ded = (v.paye || 0) + (v.pension || 0) + (v.nhf || 0); if (ded > v.gross) { toast('Deductions are more than gross pay.', 'bad'); return false; } try { postJournal({ date: today(), memo: 'Payroll ' + monthLabel(v.month), lines: [{ acct: '5200', dr: v.gross, dept: 'HR' }, ...(ded ? [{ acct: '2400', cr: ded }] : []), { acct: '1010', cr: v.gross - ded }], source: 'payroll', ref: v.month }); toast('Payroll journal posted'); render(); } catch (e) { toast(e.message, 'bad'); return false; } } });

</script>
<script>
'use strict';
/* Realtor recruitment and network (M-RLT) */

const RLT_STAGES = ['Entry registered', 'Onboarding in progress', 'Ready for induction', 'Inducted (Associate)', 'Maverick', 'Inactive', 'Exited'];
const RLT_SOURCES = ['Referral', 'Ads: Consultant campaign', 'Ads: Triconna brand', 'Walk-in', 'Organic'];
const RLT_CHECK = [['formB', 'Form B'], ['physical', 'Physical onboarding'], ['cbt', 'Online CBT'], ['tour', 'Site tour or inspection'], ['formC', 'Form C (approved at induction)'], ['docs', 'Documents (photo, ID, proof of address)']];
const stagePill = s => spill(s, { 'Entry registered': 'info', 'Onboarding in progress': 'warn', 'Ready for induction': 'warn', 'Inducted (Associate)': 'ok', 'Maverick': 'dark', 'Inactive': 'mute', 'Exited': 'bad' }[s]);
const RLT_TABS = () => { const all = [{ k: 'pipeline', l: 'Pipeline' }, { k: 'events', l: 'Events' }, { k: 'sources', l: 'Sources and campaigns' }, { k: 'network', l: 'Network' }, { k: 'leads', l: 'Realtor leads' }, { k: 'reports', l: 'Reports' }, { k: 'formA', l: 'Form A links' }]; return modAccess('realtors') === 'self' ? all.filter(t => t.k === 'sources') : all; };
const rltW = () => can('rlt.write') && modAccess('realtors') === 'write';
const isTarpAdmin = () => can('approve.any') || (me().flags || []).includes('tarpadmin');
const rltBase = () => location.href.split('#')[0] + '#/f/form-a';
const sourceLabel = r => { if (r.source === 'Referral') return 'Referral · ' + (DB.get('realtors', r.sourceRef)?.name || '—'); if (r.source.startsWith('Ads')) return r.source + ' · ' + (DB.get('campaigns', r.sourceRef)?.name || '—'); if (r.source === 'Walk-in') return 'Walk-in · ' + userName(r.sourceRef); return r.source; };
const earner = r => r.source === 'Referral' ? (DB.get('realtors', r.sourceRef)?.name || '—') : r.source === 'Ads: Consultant campaign' ? (DB.get('campaigns', r.sourceRef)?.consultant || 'The Consultant') : 'Nobody';
const chkDone = r => RLT_CHECK.filter(([k]) => r.checklist?.[k]?.done).length;
APPROVAL_LABEL.sourcefix = 'Realtor source correction';
APPR.sourcefix = { ok(a) { const r = DB.get('realtors', a.ref); if (!r) return; DB.set('realtors', r.id, { source: a.meta.source, sourceRef: a.meta.ref, sourceLog: (r.sourceLog || []).concat([{ ts: Date.now(), from: sourceLabel(r), reason: a.meta.reason, by: a.steps.map(s => s.by).filter(Boolean).join(',') }]) }, { action: 'source-correction' }); const cm = a.meta.fromConsultant; if (cm) sendExternal('email', cm, 'Source corrected for realtor ' + r.name + '. Reason: ' + a.meta.reason); }, no() { } };

PAGES.realtors = (parts, q) => {
  const tl = RLT_TABS(); const tab = parts[0] && tl.find(t => t.k === parts[0]) ? parts[0] : tl[0].k;
  let body = ''; if (tab === 'pipeline') body = rltPipeline(); else if (tab === 'events') body = rltEvents(); else if (tab === 'sources') body = rltSources(); else if (tab === 'network') body = rltNetwork(); else if (tab === 'leads') body = rltLeads(); else if (tab === 'reports') body = rltReports(); else if (tab === 'formA') body = rltFormA();
  openFromQuery('r', id => openRealtor(id));
  const rs = DB.q('realtors');
  return pageHead({ title: `Realtors${pi('share', true)}and TARP network`, sub: `${rs.filter(r => !['Inactive', 'Exited'].includes(r.stage)).length} active in the pipeline · ${rs.filter(r => r.level).length} Associates and Mavericks`, acts: rltW() ? `<button class="btn" data-act="rlt.bulk">${icon('mail', 'sm')} Message realtors</button><button class="btn primary" data-act="rlt.new">${icon('plus', 'sm')} Register realtor</button>` : '' }) + tabs('realtors', tl, tab) + body;
};

/* ----- pipeline ----- */
function rltRows() { return DB.q('realtors').map(r => ({ ...r, srcLabel: sourceLabel(r), uplineName: DB.get('realtors', r.upline)?.name || '', done: chkDone(r) })); }
function rltPipeline() {
  const view = UI.rltView || 'board'; const src = UI.rltSrc || ''; const batch = UI.rltBatch || ''; const rs = rltRows().filter(r => (!src || r.source === src) && (!batch || r.batch === batch));
  const batches = uniq(DB.q('realtors').map(r => r.batch).filter(Boolean)).sort();
  const filt = `<div class="row wrap" style="margin-bottom:12px"><label class="chip"><select data-on="rlt.src" aria-label="Source">${opts(RLT_SOURCES, src, 'All sources')}</select></label><label class="chip"><select data-on="rlt.batch" aria-label="Batch">${opts(batches, batch, 'All batches')}</select></label><span class="sp"></span><div class="row" style="gap:4px"><button class="btn sm ${view === 'board' ? 'dark' : ''}" data-act="rlt.view" data-v="board">${icon('kanban', 'sm')} Board</button><button class="btn sm ${view === 'list' ? 'dark' : ''}" data-act="rlt.view" data-v="list">${icon('list', 'sm')} List</button></div></div>`;
  if (view === 'list') return filt + table({ id: 'rlt', title: 'Realtors', rows: () => rs, ph: 'Search realtors', sort: { k: 'created', dir: -1 }, onRow: r => openRealtor(r.id), filters: [{ k: 'stage', l: 'Stage', o: RLT_STAGES, get: r => r.stage }, { k: 'up', l: 'Upline', o: DB.q('realtors').filter(r => r.level).map(r => [r.id, r.name]), get: r => r.upline }], cols: [{ k: 'name', l: 'Realtor', r: r => `<div class="row">${avatar(r.name, 'sm')}<div class="cellmain"><b>${esc(r.name)}</b><span>${esc(r.phone)}</span></div></div>`, x: r => r.name }, { k: 'stage', l: 'Stage', r: r => stagePill(r.stage), x: r => r.stage }, { k: 'srcLabel', l: 'Source' }, { k: 'batch', l: 'Batch' }, { k: 'done', l: 'Onboarding', r: r => `${r.done}/6<div style="width:70px">${progress(r.done, 6)}</div>`, sv: r => r.done, x: r => r.done + '/6' }, { k: 'created', l: 'Registered', sv: r => r.created, r: r => fmtDate(isoDate(r.created)) }] });
  return filt + `<div class="board">${RLT_STAGES.map(st => { const items = rs.filter(r => r.stage === st); return `<div class="col" data-rstage="${esc(st)}"><div class="chd"><b style="font-weight:500">${esc(st)}</b><span class="n">${items.length}</span></div>${items.sort(by(r => r.lastActivity || 0, -1)).slice(0, 25).map(r => `<div class="kc" draggable="${rltW()}" data-realtor="${r.id}" data-act="rlt.open" data-id="${r.id}"><b>${esc(r.name)}</b><span class="small muted">${esc(r.srcLabel)}</span><div class="meta">${progress(r.done, 6).replace('class="prog', 'style="width:70px" class="prog')}<span>${r.done}/6</span>${now() - (r.lastActivity || 0) > DB.setting('realtorStallDays') * 864e5 && !['Inducted (Associate)', 'Maverick', 'Inactive', 'Exited'].includes(st) ? '<span class="pill warn nodot">Stalled</span>' : ''}</div></div>`).join('') || '<div class="small muted" style="padding:8px">None</div>'}</div>`; }).join('')}</div>`;
}
const now = () => Date.now();
ACT['rlt.src'] = el => { UI.rltSrc = el.value; render(); }; ACT['rlt.batch'] = el => { UI.rltBatch = el.value; render(); }; ACT['rlt.view'] = el => { UI.rltView = el.dataset.v; render(); };
ACT['rlt.open'] = el => openRealtor(el.dataset.id);
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.kc[data-realtor]'); if (c) { e.dataTransfer.setData('text/realtor', c.dataset.realtor); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const c = e.target.closest?.('.col[data-rstage]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('.col[data-rstage]')?.classList.remove('over'); });
document.addEventListener('drop', e => { const c = e.target.closest?.('.col[data-rstage]'); if (!c) return; e.preventDefault(); c.classList.remove('over'); const id = e.dataTransfer.getData('text/realtor'); if (id) moveRealtor(id, c.dataset.rstage); });
function moveRealtor(id, stage) {
  const r = DB.get('realtors', id); if (!r || r.stage === stage || !rltW()) return;
  if (stage === 'Inducted (Associate)') return inductRealtor(id);
  if (stage === 'Maverick') { if (!r.level) return toast('Induct this realtor as an Associate first.', 'warn'); return promoteRealtor(id); }
  if (stage === 'Ready for induction' && chkDone(r) < 5) return toast('Complete onboarding items first (everything except Form C).', 'warn');
  DB.set('realtors', id, { stage, lastActivity: Date.now() }, { action: 'stage' }); render();
}
function inductRealtor(id) {
  const r = DB.get('realtors', id); if (!isTarpAdmin()) return toast('Only the TARP Admin can approve Form C and induct a realtor.', 'bad');
  const missing = RLT_CHECK.filter(([k]) => k !== 'formC' && !r.checklist?.[k]?.done); if (missing.length) return toast('Still to complete: ' + missing.map(m => m[1]).join(', '), 'warn');
  confirmDlg(`Approve Form C for <b>${esc(r.name)}</b> and send them to Tri-Pay? Tri-Pay creates their Associate account and referral code.`, () => { const code = 'TARP' + Math.floor(1000 + Math.random() * 9000); DB.set('realtors', id, { stage: 'Inducted (Associate)', level: 'Associate', code, lastActivity: Date.now(), inductedAt: Date.now(), checklist: { ...r.checklist, formC: { done: true, date: today() } } }, { action: 'induct' }); tripaySend('realtor.inducted', { realtor: r.name, code, source: r.source, sourceRef: r.sourceRef, upline: r.upline }); sendExternal('sms', r.phone, `Welcome to TARP, ${r.name}. Your referral code is ${code}.`); toast('Inducted. Referral code ' + code); render(); }, { title: 'Approve Form C and induct', yes: 'Induct realtor' });
}
function promoteRealtor(id) { DB.set('realtors', id, { stage: 'Maverick', level: 'Maverick', lastActivity: Date.now() }, { action: 'promote' }); tripaySend('realtor.level', { realtor: id, level: 'Maverick' }); toast('Promoted to Maverick'); render(); }
function openRealtor(id) {
  openDrawer(() => {
    const r = DB.get('realtors', id); if (!r) return null; const w = rltW(); const sales = DB.q('sales').filter(s => s.realtorId === id); const comms = DB.q('commissions').filter(c => c.realtorId === id); const down = DB.q('realtors').filter(x => x.upline === id);

  const act = rs.filter(r => r.level && Date.now() - (r.lastActivity || 0) < 30 * 864e5).length; const inact = rs.filter(r => r.level).length - act;
  const evs = DB.q('events').filter(e => e.date < today()); const att = evs.length ? pct(sum(evs, e => Object.values(e.attendance || {}).filter(Boolean).length), sum(evs, e => (e.invitees || []).length)) : 0;
  const cons = uniq(DB.q('campaigns').filter(c => c.kind === 'consultant').map(c => c.consultant));
  return `<div class="grid g4" style="margin-bottom:16px">${tile({ ic: 'share', title: 'Registered', value: rs.length })}${tile({ cls: 'tea', ic: 'check', title: 'Entry to Associate', value: pct(rs.filter(r => r.level).length, rs.length) + '%', sub: rs.filter(r => r.level).length + ' inducted' })}${tile({ ic: 'calendar', title: 'Event attendance', value: att + '%', sub: evs.length + ' past events' })}${tile({ cls: 'dark', ic: 'users', title: 'Active / inactive', value: act, unit: '/ ' + inact, sub: 'Active = activity in 30 days' })}</div><div class="grid g2" style="align-items:start">${card('Recruitment by source', `<table class="tbl"><thead><tr><th>Source</th><th class="num">Recruits</th><th class="num">Associates</th><th class="num">Conversion</th></tr></thead><tbody>${bySrc.map(r => `<tr><td>${esc(r.s)}</td><td class="num">${r.n}</td><td class="num">${r.ind}</td><td class="num">${r.conv}%</td></tr>`).join('')}</tbody></table>`, { ic: 'pie', acts: exportBtn('Recruitment by source', [{ l: 'Source', x: r => r.s }, { l: 'Recruits', x: r => r.n }, { l: 'Associates', x: r => r.ind }, { l: 'Conversion %', x: r => r.conv }], () => bySrc) })}${card('Realtors by stage', hbars(RLT_STAGES.map(s => ({ l: s, v: rs.filter(r => r.stage === s).length }))), { ic: 'share' })}${card('Cost per recruit by campaign', `<table class="tbl"><thead><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Recruits</th><th class="num">Cost per recruit</th></tr></thead><tbody>${DB.q('campaigns').map(c => { const n = rs.filter(r => r.sourceRef === c.id && r.source.startsWith('Ads')).length; return `<tr><td>${esc(c.name)}</td><td class="num">${money(c.spend)}</td><td class="num">${n}</td><td class="num">${n ? money(Math.round(c.spend / n)) : '—'}</td></tr>`; }).join('')}</tbody></table>`, { ic: 'coins' })}${card('Consultant statements', `<p class="muted small" style="margin-bottom:10px">Monthly statement of each Consultant’s recruits and their sales, as the TARP Consultancy Agreement requires. The quarterly report is the same statement over three months.</p><div class="stack" style="gap:8px">${cons.map(c => `<button class="tilebtn" data-act="cons.stmt" data-c="${esc(c)}">${icon('file')}<span class="grow">${esc(c)}</span>${icon('chevr', 'sm')}</button>`).join('')}</div>`, { ic: 'file' })}</div>`;
}
ACT['cons.stmt'] = el => { const c = el.dataset.c; const camps = DB.q('campaigns').filter(x => x.consultant === c); const rec = DB.q('realtors').filter(r => camps.some(x => x.id === r.sourceRef) && r.source === 'Ads: Consultant campaign'); const sales = DB.q('sales').filter(s => rec.some(r => r.id === s.realtorId)); const comm = DB.q('commissions').filter(x => String(x.realtorId) === 'consultant:' + (camps[0] && camps[0].id) || camps.some(k => x.realtorId === 'consultant:' + k.id)); const d = { code: 'STMT-' + Date.now().toString(36).toUpperCase(), title: 'Consultant statement · ' + c, ts: Date.now(), html: `<p><b>${esc(c)}</b> · ${esc(monthLabel(monthKey(today())))}</p><table><tr><th>Campaigns</th><td>${esc(camps.map(x => x.name).join('; '))}</td></tr><tr><th>Recruits</th><td>${rec.length}</td></tr><tr><th>Inducted Associates</th><td>${rec.filter(r => r.level).length}</td></tr><tr><th>Sales by recruits</th><td>${sales.length} · ${money(sum(sales, s => s.total))}</td></tr><tr><th>3% commission earned</th><td>${money(sum(comm, x => x.amount))}</td></tr></table><table><tr><th>Recruit</th><th>Stage</th><th>Level</th></tr>${rec.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.stage)}</td><td>${esc(r.level || '—')}</td></tr>`).join('')}</table>` }; openModal({ title: esc(d.title), xl: true, live: false, body: docSheet(d), foot: `<button class="btn" data-act="ov.close">Close</button><button class="btn primary" data-act="cons.print" data-c="${esc(c)}">Print or save PDF</button>` }); window.__stmt = d; };
ACT['cons.print'] = () => printHtml(docSheet(window.__stmt));

/* ----- Form A links ----- */
function rltFormA() {
  const links = [['General (Organic)', rltBase()]].concat(DB.q('campaigns').map(c => [c.name + (c.kind === 'consultant' ? ' · Consultant' : ' · Triconna brand'), rltBase() + '?camp=' + c.code])).concat(DB.q('realtors').filter(r => r.code).slice(0, 4).map(r => ['Referral · ' + r.name, rltBase() + '?ref=' + r.code]));
  return `<div class="alert info" style="margin-bottom:14px">${icon('link', 'sm')}<span>Online Form A replaces the Google Form. The link decides the source. Duplicates are matched by phone number.</span></div><div class="grid g3">${links.map(([l, u]) => `<div class="card"><b style="font-weight:500">${esc(l)}</b><div style="width:110px;margin:10px 0">${qrSvg(u, 4)}</div><div class="small muted" style="word-break:break-all;margin-bottom:10px">${esc(u)}</div><div class="row"><a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">Open form</a><button class="btn sm" data-act="copy" data-t="${esc(u)}">Copy</button></div></div>`).join('')}</div>`;
}

</script>
<script>
'use strict';
/* HR and administration (M-HR) */

const hrW = () => can('hr.write') && modAccess('hr') === 'write';
const hrSens = () => can('hr.sensitive');
const LEAVE_TYPES = ['Annual', 'Sick', 'Casual', 'Compassionate', 'Maternity or paternity', 'Unpaid'];
function scopeUserIds() { const u = me(); if (can('hr.write') || can('read.all')) return coUsers().map(x => x.id); if (u.role === 'hod') return coUsers().filter(x => x.dept === u.dept || x.manager === u.id).map(x => x.id).concat([u.id]); return [u.id]; }
const HR_TABS = () => { const full = modAccess('hr') === 'write' || modAccess('hr') === 'read'; const t = [{ k: 'directory', l: 'Directory' }, { k: 'org', l: 'Org chart' }, { k: 'leave', l: 'Leave' }, { k: 'attendance', l: 'Attendance' }]; if (full) t.push({ k: 'vault', l: 'Documents' }, { k: 'onboarding', l: 'Onboarding and exit' }); t.push({ k: 'announcements', l: 'Announcements' }); if (full && (hrSens() || can('audit.view'))) t.push({ k: 'payroll', l: 'Payroll export' }); if (full) t.push({ k: 'exit', l: 'Exit access control' }); return t; };

PAGES.hr = (parts, q) => {
  const tl = HR_TABS(); const tab = parts[0] && tl.find(t => t.k === parts[0]) ? parts[0] : 'directory';
  let body = ''; if (tab === 'directory') body = hrDirectory(); else if (tab === 'org') body = hrOrg(); else if (tab === 'leave') body = hrLeave(); else if (tab === 'attendance') body = hrAttendance(); else if (tab === 'vault') body = hrVault(); else if (tab === 'onboarding') body = hrOnboarding(); else if (tab === 'announcements') body = hrAnnouncements(); else if (tab === 'payroll') body = hrPayroll(); else if (tab === 'exit') body = hrExit();
  openFromQuery('e', id => openEmployee(id));
  const emps = DB.q('employees').filter(e => e.status === 'Active');
  return pageHead({ title: `HR${pi('briefcase', true)}and administration`, sub: `${emps.length} active staff · ${DB.q('leaves').filter(l => l.status === 'pending').length} leave requests pending`, acts: hrW() ? `<button class="btn primary" data-act="emp.new">${icon('plus', 'sm')} Add employee</button>` : '' }) + tabs('hr', tl, tab) + body;
};

/* ----- directory & records (HR-01) ----- */
function hrDirectory() {
  const rows = () => DB.q('employees').map(e => ({ ...e, mgr: userName(e.manager) }));
  return table({ id: 'emps', title: 'Staff directory', rows, ph: 'Search staff', sort: { k: 'name', dir: 1 }, onRow: e => openEmployee(e.id), filters: [{ k: 'dept', l: 'Department', o: DB.q('depts').map(d => d.name), get: e => e.dept }, { k: 'status', l: 'Status', o: ['Active', 'On leave', 'Exited'], get: e => e.status }], cols: [{ k: 'name', l: 'Employee', r: e => `<div class="row">${avatar(e.name, 'sm')}<div class="cellmain"><b>${esc(e.name)}</b><span>${esc(e.title)}</span></div></div>`, x: e => e.name }, { k: 'dept', l: 'Department' }, { k: 'mgr', l: 'Line manager' }, { k: 'grade', l: 'Grade' }, { k: 'start', l: 'Started', r: e => fmtDate(e.start), sv: e => e.start }, { k: 'status', l: 'Status', r: e => spill(e.status), x: e => e.status }] });
}
function openEmployee(id) {
  openDrawer(() => {
    const e = DB.get('employees', id); if (!e) return null; const w = hrW(); const sens = hrSens(); const u = userById(e.userId); const att = DB.q('attempts').filter(a => a.userId === e.userId); const certs = DB.q('certs').filter(c => c.userId === e.userId); const apps = DB.q('appraisals').filter(a => a.userId === e.userId); const vault = DB.q('vault').filter(v => v.empId === id);
    const fields = [{ n: 'name', l: 'Full name' }, { n: 'title', l: 'Role' }, { n: 'dept', l: 'Department', t: 'select', o: DB.q('depts').map(d => d.name), blank: false, half: true }, { n: 'grade', l: 'Grade', half: true }, { n: 'manager', l: 'Line manager', t: 'select', o: coUsers().map(x => [x.id, x.name]), blank: 'None' }, { n: 'start', l: 'Employment start', t: 'date', half: true }, { n: 'status', l: 'Status', t: 'select', blank: false, o: ['Active', 'On leave', 'Exited'], half: true }, { n: 'phone', l: 'Phone', t: 'tel', half: true }, { n: 'email', l: 'Email', t: 'email', half: true }];
    return { title: esc(e.name), body: `<div class="row" style="margin-bottom:14px">${avatar(e.name, 'lg')}<div><b style="font-size:17px;font-weight:500">${esc(e.title)}</b><div class="muted">${esc(e.dept)} · ${spill(e.status)}</div></div></div>${w ? autoForm('employees', id, fields, e) : kv([['Department', esc(e.dept)], ['Line manager', esc(userName(e.manager))], ['Grade', esc(e.grade)], ['Started', fmtDate(e.start)], ['Phone', esc(e.phone)], ['Email', esc(e.email)]])}
    <div class="sec"><h4>Emergency contact</h4>${sens || e.userId === SESS.uid ? kv([['Name', esc(e.emergency?.name)], ['Relationship', esc(e.emergency?.rel)], ['Phone', esc(e.emergency?.phone)]]) : '<span class="muted">Visible to HR and the employee.</span>'}</div>
    <div class="sec"><h4>Restricted records</h4>${sens ? (w ? autoForm('employees', id, [{ n: 'salary', l: 'Monthly salary (₦)', t: 'money', half: true }, { n: 'nin', l: 'National ID number', half: true }, { n: 'leaveAllow', l: 'Annual leave days', t: 'number', half: true }], e) : kv([['Salary', money(e.salary)], ['National ID', esc(e.nin)]])) + `<div style="margin-top:10px"><b style="font-weight:500;font-size:13px">Disciplinary record</b>${(e.disciplinary || []).map(d => `<div class="small" style="padding:4px 0">${fmtDate(d.date)} · ${esc(d.note)}</div>`).join('') || '<div class="small muted">None on file.</div>'}${w ? `<button class="btn sm" style="margin-top:6px" data-act="emp.disc" data-id="${id}">Add note</button>` : ''}</div>` : '<span class="muted">Salary, ID and disciplinary records are visible only to HR and executives.</span>'}</div>
    <div class="sec"><h4>Documents</h4>${vault.length ? vault.filter(v => !v.restricted || sens || e.userId === SESS.uid).map(v => `<div class="row" style="padding:3px 0">${icon('file', 'sm')}<span class="grow">${esc(v.name)}</span>${v.expiry ? spill('Expires ' + fmtDate(v.expiry), v.expiry <= addDays(today(), 30) ? 'warn' : 'mute') : ''}</div>`).join('') || '<span class="muted">None visible.</span>' : '<span class="muted">No documents.</span>'}</div>
    <div class="sec"><h4>Training history</h4>${att.length || certs.length ? `${att.slice(-4).map(a => `<div class="row" style="padding:3px 0"><span class="grow">${esc(DB.get('assessments', a.assessmentId)?.title || 'Assessment')}</span><b style="font-weight:500">${a.score}%</b></div>`).join('')}${certs.map(c => `<div class="row" style="padding:3px 0">${icon('trophy', 'sm')}<span class="grow">${esc(c.title)}</span><span class="small muted">${fmtDate(isoDate(c.ts))}</span></div>`).join('')}` : '<span class="muted">No training recorded yet.</span>'}</div>
    <div class="sec"><h4>Appraisals</h4>${apps.map(a => `<div class="row" style="padding:3px 0"><span class="grow">${esc(a.cycle)}</span>${spill(a.status)}</div>`).join('') || '<span class="muted">None.</span>'}</div>`, foot: w ? `<button class="btn" data-act="hr.offboard" data-id="${id}">Start offboarding</button>` : '<button class="btn" data-act="ov.close">Close</button>' };
  }, { wide: true });
}
ACT['emp.disc'] = el => askText('Disciplinary note', 'Note', n => { const e = DB.get('employees', el.dataset.id); DB.set('employees', e.id, { disciplinary: (e.disciplinary || []).concat([{ date: today(), note: n, by: SESS.uid }]) }, { action: 'disciplinary' }); render(); });
ACT['emp.new'] = () => openForm({ title: 'Add employee', fields: [{ n: 'name', l: 'Full name', req: true }, { n: 'email', l: 'Work email', t: 'email', req: true, half: true }, { n: 'phone', l: 'Phone', t: 'tel', half: true }, { n: 'dept', l: 'Department', t: 'select', req: true, o: DB.q('depts').map(d => d.name), half: true }, { n: 'title', l: 'Role', req: true, half: true }, { n: 'manager', l: 'Line manager', t: 'select', o: coUsers().map(x => [x.id, x.name]), half: true }, { n: 'grade', l: 'Grade', half: true }, { n: 'start', l: 'Start date', t: 'date', req: true, v: today() }, { n: 'salary', l: 'Monthly salary (₦)', t: 'money' }, { n: 'role', l: 'System role', t: 'select', blank: false, o: [['staff', 'Staff'], ['hod', 'Head of Department'], ['finance', 'Finance Officer'], ['hr', 'HR Officer']], v: 'staff' }], vals: { role: 'staff', start: today() }, onSubmit: v => {
  const uid = 'u_' + rid(); DB.d.users.push({ id: uid, name: v.name, email: v.email, phone: v.phone || '', role: v.role, dept: v.dept, title: v.title, co: [CO], flags: [], prefs: { email: true, sms: false, app: true }, manager: v.manager || deptHead(v.dept) }); audit('create', 'users', uid, v.name);
  const e = DB.add('employees', { userId: uid, name: v.name, dept: v.dept, title: v.title, grade: v.grade || 'G3', manager: v.manager || deptHead(v.dept), start: v.start, phone: v.phone || '', email: v.email, nin: '', salary: v.salary || 0, status: 'Active', emergency: { name: '', phone: '', rel: '' }, leaveAllow: 20, leaveTaken: 0, disciplinary: [] }); startChecklist(e, 'onboarding'); toast(v.name + ' added with an onboarding checklist'); render(); } });

/* ----- onboarding / offboarding (HR-05) ----- */
const CHECKLIST = { onboarding: [['HR', 'Collect contract, ID and guarantor forms'], ['IT', 'Create Tri-OP account, email and equipment'], ['Finance', 'Add to payroll and set up bank details'], ['manager', 'Prepare desk, introductions and 30-day plan']], offboarding: [['manager', 'Handover of work and open tasks'], ['IT', 'Revoke Tri-OP and email access; collect equipment'], ['Finance', 'Final pay and settle advances'], ['HR', 'Exit interview, return of ID and cards, update records']] };
function startChecklist(e, kind) {
  const prj = DB.q('projects').find(p => p.name === 'Staff ' + kind) || DB.add('projects', { name: 'Staff ' + kind, owner: coUsers().find(u => u.role === 'hr')?.id, dept: 'HR', desc: 'HR checklist tasks', status: 'Active', start: today(), due: addDays(today(), 365), team: [], milestones: [] }, { quiet: true });
  CHECKLIST[kind].forEach(([who, t]) => { const assignee = who === 'manager' ? (e.manager || deptHead(e.dept)) : who === 'HR' ? (usersWithRole('hr')[0]?.id) : who === 'IT' ? (deptHead('IT')) : (deptHead('Finance')); DB.add('tasks', { title: (kind === 'onboarding' ? 'Onboard ' : 'Offboard ') + e.name + ': ' + t, desc: t, project: prj.id, assignee, followers: [], due: addDays(today(), kind === 'onboarding' ? 5 : 7), priority: 'Medium', status: 'todo', link: { type: 'employee', id: e.id }, checklistKind: kind, comments: [], history: [], checklist: [] }, { quiet: true }); notify(assignee, (kind === 'onboarding' ? 'Onboarding' : 'Offboarding') + ' task: ' + e.name, t, '#/work/tasks'); });
}
ACT['hr.offboard'] = el => confirmDlg('Start offboarding for this employee? Tasks go to HR, IT, Finance and the line manager.', () => { const e = DB.get('employees', el.dataset.id); startChecklist(e, 'offboarding'); toast('Offboarding checklist created'); closeAllOverlays(); render(); }, { yes: 'Start offboarding' });
function hrOnboarding() {
  const emps = DB.q('employees'); const rows = () => emps.map(e => { const ts = DB.q('tasks').filter(t => t.link?.type === 'employee' && t.link.id === e.id); if (!ts.length) return null; const kind = ts[0].checklistKind; return { id: e.id, name: e.name, kind, total: ts.length, done: ts.filter(t => t.status === 'done').length, due: ts.map(t => t.due).sort()[0] }; }).filter(Boolean);
  return `<div class="alert info" style="margin-bottom:14px">${icon('check', 'sm')}<span>Checklists create tasks for HR, IT, Finance and the line manager. Progress updates as they close their tasks.</span></div>` + table({ id: 'onb', title: 'Onboarding and offboarding', rows, empty: 'No checklists in progress.', tools: hrW() ? `<button class="btn sm" data-act="hr.start">Start a checklist</button>` : '', cols: [{ k: 'name', l: 'Employee' }, { k: 'kind', l: 'Type', r: r => spill(cap(r.kind), r.kind === 'offboarding' ? 'warn' : 'ok') }, { k: 'p', l: 'Progress', sv: r => r.done / r.total, r: r => `<div style="width:140px">${progress(r.done, r.total)}<div class="small muted">${r.done} of ${r.total} tasks</div></div>`, x: r => r.done + '/' + r.total }, { k: 'due', l: 'First due', r: r => fmtDate(r.due) }] });
}
ACT['hr.start'] = () => openForm({ title: 'Start a checklist', fields: [{ n: 'emp', l: 'Employee', t: 'select', req: true, o: DB.q('employees').map(e => [e.id, e.name]) }, { n: 'kind', l: 'Type', t: 'select', blank: false, o: [['onboarding', 'Onboarding'], ['offboarding', 'Offboarding']] }], onSubmit: v => { startChecklist(DB.get('employees', v.emp), v.kind); toast('Checklist created'); render(); } });

/* ----- org chart (HR-04) ----- */
function hrOrg() {
  const emps = DB.q('employees').filter(e => e.status !== 'Exited'); const byUser = Object.fromEntries(emps.map(e => [e.userId, e])); const kids = uid => emps.filter(e => e.manager === uid); const roots = emps.filter(e => !e.manager || !byUser[e.manager]);
  const node = e => `<li><div class="onode" data-act="emp.open" data-id="${e.id}"><b>${esc(e.name)}</b><span>${esc(e.title)}</span></div>${kids(e.userId).length ? `<ul>${kids(e.userId).map(node).join('')}</ul>` : ''}</li>`;
  return card('Organisation', `<div class="org"><ul>${roots.map(node).join('')}</ul></div>`, { ic: 'users' }) + `<p class="small muted" style="margin-top:8px">Generated from reporting lines. Change a line manager on the employee record and the chart updates.</p>`;
}
ACT['emp.open'] = el => openEmployee(el.dataset.id);

/* ----- leave (HR-03) ----- */
function hrLeave() {
  const ids = scopeUserIds(); const rows = () => DB.q('leaves').filter(l => ids.includes(l.userId)).map(l => ({ ...l, name: userName(l.userId), appr: DB.q('approvals').find(a => a.type === 'leave' && a.ref === l.id) }));
  const cal = DB.q('leaves').filter(l => l.status !== 'rejected' && ids.includes(l.userId)).flatMap(l => { const out = []; for (let d = l.from; d <= l.to; d = addDays(d, 1)) out.push({ d, t: userName(l.userId).split(' ')[0] + ' · ' + l.type, cls: l.status === 'approved' ? '' : 'w' }); return out; });
  const e = empOf(SESS.uid);
  return `<div class="grid g3" style="margin-bottom:16px">${tile({ ic: 'calendar', title: 'My annual leave', value: e ? e.leaveAllow - (e.leaveTaken || 0) : '—', unit: 'days left', caps: { v: e ? e.leaveAllow - (e.leaveTaken || 0) : 0, max: e?.leaveAllow || 20 } })}${tile({ cls: 'tea', ic: 'clock', title: 'Pending requests', value: DB.q('leaves').filter(l => l.status === 'pending' && ids.includes(l.userId)).length })}${tile({ cls: 'dark', ic: 'users', title: 'Away today', value: DB.q('leaves').filter(l => l.status === 'approved' && l.from <= today() && l.to >= today() && ids.includes(l.userId)).length })}</div><div class="grid g21" style="align-items:start">${table({ id: 'leaves', title: 'Leave', rows, sort: { k: 'from', dir: -1 }, empty: 'No leave requests.', filters: [{ k: 'status', l: 'Status', o: ['pending', 'approved', 'rejected'], get: l => l.status }, { k: 'type', l: 'Type', o: LEAVE_TYPES, get: l => l.type }], tools: `<button class="btn sm primary" data-act="leave.new">${icon('plus', 'sm')} Request leave</button>`, onRow: l => l.appr ? openApproval(l.appr.id) : null, cols: [{ k: 'name', l: 'Employee' }, { k: 'type', l: 'Type' }, { k: 'from', l: 'Dates', r: l => fmtDate(l.from) + ' – ' + fmtDate(l.to), sv: l => l.from }, { k: 'days', l: 'Days', num: true }, { k: 'status', l: 'Status', r: l => spill(l.status) }] })}${card('Team calendar', calendarHtml('leavecal', cal), { ic: 'calendar' })}</div>${hrW() || isExec() ? `<div style="margin-top:16px">${table({ id: 'balances', title: 'Leave balances', rows: () => DB.q('employees').map(e => ({ ...e, left: e.leaveAllow - (e.leaveTaken || 0) })), ps: 8, cols: [{ k: 'name', l: 'Employee' }, { k: 'dept', l: 'Dept' }, { k: 'leaveAllow', l: 'Allowance', num: true }, { k: 'leaveTaken', l: 'Taken', num: true, r: e => e.leaveTaken || 0 }, { k: 'left', l: 'Remaining', num: true }] })}</div>` : ''}`;
}

<script>

.status === 'done' ? 'ok' : t.status === 'doing' ? 'warn' : t.status === 'review' ? 'info' : ''), x: t => stLabel(t.status) }] });

  if (t.link?.type === 'rltstall') { }
}
const taskFields = (t = {}) => [{ n: 'title', l: 'Task', req: true }, { n: 'desc', l: 'Description', t: 'textarea' }, { n: 'project', l: 'Project', t: 'select', o: DB.q('projects').filter(p => !p.template).map(p => [p.id, p.name]), blank: 'No project', half: true }, { n: 'assignee', l: 'Assignee', t: 'select', req: true, o: coUsers().filter(u => u.role !== 'auditor').map(u => [u.id, u.name]), blank: false, half: true }, { n: 'start', l: 'Start', t: 'date', half: true }, { n: 'due', l: 'Due', t: 'date', half: true }, { n: 'priority', l: 'Priority', t: 'select', blank: false, o: PRIORITIES, half: true }, { n: 'est', l: 'Estimate (hours)', t: 'number', min: 0, half: true }];
ACT['task.new'] = el => { const lt = el?.dataset?.linkType, li = el?.dataset?.linkId; openForm({ title: 'New task', fields: taskFields(), draft: 'task-new', vals: { assignee: SESS.uid, priority: 'Medium', due: addDays(today(), 3) }, onSubmit: v => { const t = DB.add('tasks', { ...v, followers: [], status: 'todo', subtasks: [], checklist: [], comments: [], history: [{ ts: Date.now(), by: SESS.uid, what: 'Created task' }], deps: [], link: lt ? { type: lt, id: li } : null }); if (v.assignee !== SESS.uid) notify(v.assignee, 'Task assigned to you: ' + v.title, userName(SESS.uid), '#/work/tasks?t=' + t.id); toast('Task created'); render(); } }); };
function linkLabel(l) { if (!l) return ''; const m = { lead: ['leads', 'crm/leads?l='], client: ['clients', 'crm/client/'], sale: ['sales', 'crm/sales?s='], realtor: ['realtors', 'realtors/pipeline?r='], ticket: ['tickets', 'cx/tickets?t='], employee: ['employees', 'hr/directory?e='], report: ['reports', 'reports/'] }[l.type]; if (!m) return ''; const rec = DB.get(m[0], l.id); const name = rec ? (rec.name || rec.no || rec.subject || rec.dept) : l.type; return `<a href="#/${m[1]}${l.id}" data-act="ov.close">${esc(l.type)} · ${esc(name)}</a>`; }
function openTask(id) {
  openDrawer(() => {
    const t = DB.get('tasks', id); if (!t) return null; const prj = DB.get('projects', t.project); const manage = can('task.manage') || t.assignee === SESS.uid || t.cby === SESS.uid; const mine = DB.q('timelogs').filter(l => l.taskId === id); const timer = me().timer; const running = timer && timer.taskId === id;
    const fields = [{ n: 'title', l: 'Task' }, { n: 'desc', l: 'Description', t: 'textarea' }, { n: 'status', l: 'Status', t: 'select', blank: false, o: TASK_ST, half: true }, { n: 'priority', l: 'Priority', t: 'select', blank: false, o: PRIORITIES, half: true }, { n: 'assignee', l: 'Assignee', t: 'select', blank: false, o: coUsers().filter(u => u.role !== 'auditor').map(u => [u.id, u.name]), half: true }, { n: 'project', l: 'Project', t: 'select', o: DB.q('projects').filter(p => !p.template).map(p => [p.id, p.name]), blank: 'No project', half: true }, { n: 'start', l: 'Start', t: 'date', half: true }, { n: 'due', l: 'Due', t: 'date', half: true }, { n: 'est', l: 'Estimate (hours)', t: 'number', min: 0, half: true }, { n: 'followers', l: 'Followers', t: 'multi', o: coUsers().filter(u => u.role !== 'auditor').map(u => [u.id, u.name.split(' ')[0]]) }];
    return { title: esc(t.title), body: `<div class="row wrap" style="margin-bottom:12px">${spill(stLabel(t.status), t.status === 'done' ? 'ok' : t.status === 'doing' ? 'warn' : '')}${spill(t.priority)}${t.link ? `<span class="tag">${linkLabel(t.link)}</span>` : ''}${t.auto ? `<span class="tag">Auto-created</span>` : ''}${t.recur ? `<span class="tag">${icon('refresh', 'sm')} Repeats ${esc(t.recur.freq)}</span>` : ''}</div>

    <div class="sec"><h4>Activity</h4><div class="tl">${(t.history || []).slice().reverse().slice(0, 12).map(h => `<div class="it">${esc(h.what)}<br><span class="small muted">${esc(userName(h.by))} · ${fmtDT(h.ts)}</span></div>`).join('')}</div></div>`, foot: `${t.status !== 'done' && manage ? `<button class="btn primary" data-act="task.done" data-id="${id}">${icon('check', 'sm')} Mark done</button>` : ''}${manage ? `<button class="btn danger" data-act="task.del" data-id="${id}">Delete</button>` : ''}` };
  }, { wide: true });

/* ----- calendar, gantt ----- */
function workCalendar() { const ts = visibleTasks().filter(t => t.due); const ev = ts.map(t => ({ d: t.due, t: t.title, act: 'task.open', id: t.id, cls: t.status === 'done' ? '' : t.due < today() ? 'w' : 'i' })); return card('Due dates', calendarHtml('taskcal', ev), { ic: 'calendar' }); }
function workGantt() {
  const prj = UI.ganttProject || ''; const ts = visibleTasks().filter(t => t.due && (!prj || t.project === prj)).map(t => ({ ...t, s: t.start || addDays(t.due, -2) })).sort(by(t => t.s)).slice(0, 40);
  if (!ts.length) return emptyState('No dated tasks to show.', 'gantt');
  const min = ts.reduce((m, t) => t.s < m ? t.s : m, ts[0].s), max = ts.reduce((m, t) => t.due > m ? t.due : m, ts[0].due); const from = addDays(min, -2), total = Math.max(daysBetween(from, addDays(max, 3)), 14); const pos = d => Math.max(0, daysBetween(from, d) / total * 100); const ticks = []; for (let i = 0; i <= total; i += Math.ceil(total / 10)) ticks.push(i);
  return `<div class="row" style="margin-bottom:12px"><label class="chip"><select data-on="work.gproj" aria-label="Project">${opts(DB.q('projects').filter(p => !p.template).map(p => [p.id, p.name]), prj, 'All projects')}</select></label><span class="sp"></span><span class="small muted">Bars run from start to due date. Orange means overdue.</span></div><div class="gantt"><div style="min-width:760px"><div class="gr gh" style="grid-template-columns:230px 1fr"><div class="gl">Task</div><div class="gb">${ticks.map(i => `<span style="left:${i / total * 100}%">${fmtDate(addDays(from, i)).slice(0, 6)}</span>`).join('')}</div></div>${ts.map(t => `<div class="gr" style="grid-template-columns:230px 1fr"><div class="gl" title="${esc(t.title)}">${esc(t.title)}${(t.deps || []).length ? ` <span class="muted">· after ${t.deps.length}</span>` : ''}</div><div class="gb">${today() >= from ? `<span class="today" style="left:${pos(today())}%"></span>` : ''}<i class="${t.status === 'done' ? 'done' : t.due < today() ? 'late' : ''}" style="left:${pos(t.s)}%;width:${Math.max(2.5, pos(addDays(t.due, 1)) - pos(t.s))}%;cursor:pointer" data-act="task.open" data-id="${t.id}">${esc(userName(t.assignee).split(' ')[0])}</i></div></div>`).join('')}</div></div>`;
}

const weekStart = d => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return isoDate(x); };
function workTimesheets() {
  const ws = UI.tsWeek || weekStart(today()); const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i)); const my = DB.q('timelogs').filter(l => l.userId === SESS.uid && days.includes(l.date)); const tsRec = DB.q('timesheets').find(x => x.userId === SESS.uid && x.week === ws); const tasks = uniq(my.map(l => l.taskId));
  const mgr = DB.q('timesheets').filter(x => ['submitted'].includes(x.status) && canDecideTs(x));
  return `<div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="ts.nav" data-d="-7">${icon('chevl', 'sm')}</button><b style="font-weight:500">Week of ${fmtDate(ws)}</b><button class="btn sm" data-act="ts.nav" data-d="7">${icon('chevr', 'sm')}</button><span class="sp"></span>${tsRec ? spill(tsRec.status, tsRec.status === 'approved' ? 'ok' : 'warn') : ''}<button class="btn" data-act="time.add2">${icon('plus', 'sm')} Add time</button><button class="btn primary" data-act="ts.submit" data-w="${ws}" ${tsRec && tsRec.status !== 'rejected' ? 'disabled' : ''}>Submit week for approval</button></div>${card('My timesheet', `<table class="tbl"><thead><tr><th>Task</th>${days.map(d => `<th class="num">${fmtDate(d).slice(0, 6)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>${tasks.map(id => `<tr><td>${esc(DB.get('tasks', id)?.title || 'Task')}</td>${days.map(d => { const h = sum(my.filter(l => l.taskId === id && l.date === d), l => l.hours); return `<td class="num">${h ? Math.round(h * 10) / 10 : ''}</td>`; }).join('')}<td class="num">${Math.round(sum(my.filter(l => l.taskId === id), l => l.hours) * 10) / 10}</td></tr>`).join('') || `<tr><td colspan="9">${emptyState('No time logged this week. Start a timer from any task.', 'clock')}</td></tr>`}<tr><th>Total</th>${days.map(d => `<th class="num">${Math.round(sum(my.filter(l => l.date === d), l => l.hours) * 10) / 10 || ''}</th>`).join('')}<th class="num">${Math.round(sum(my, l => l.hours) * 10) / 10}</th></tr></tbody></table>`, { ic: 'clock' })}` +
    (mgr.length ? `<div style="margin-top:16px">${card('Timesheets awaiting your approval', mgr.map(x => `<div class="row" style="padding:6px 0">${userChip(x.userId)}<span class="grow">Week of ${fmtDate(x.week)}</span><b style="font-weight:500">${x.hours} h</b><button class="btn sm danger" data-act="ts.decide" data-id="${x.id}" data-v="rejected">Return</button><button class="btn sm primary" data-act="ts.decide" data-id="${x.id}" data-v="approved">Approve</button></div>`).join(''), { ic: 'check' })}</div>` : '');
}
const canDecideTs = x => x.userId !== SESS.uid && (managerOf(x.userId) === SESS.uid || can('approve.any'));
ACT['ts.nav'] = el => { UI.tsWeek = addDays(UI.tsWeek || weekStart(today()), +el.dataset.d); render(); };

}
function workReports() {
  const ts = visibleTasks(); const done = ts.filter(t => t.status === 'done'); const ontime = done.filter(t => t.doneAt && (!t.due || isoDate(t.doneAt) <= t.due)); const over = ts.filter(t => t.status !== 'done' && t.due && t.due < today());
  const byPerson = coUsers().map(u => ({ l: u.name, v: over.filter(t => t.assignee === u.id).length })).filter(x => x.v).sort(by(x => x.v, -1)); const byDept = DB.q('depts').map(d => ({ l: d.name, v: over.filter(t => userById(t.assignee)?.dept === d.name).length })).filter(x => x.v);

}

AUTOPRE.tasks = (id, patch, rec) => { if (patch.status && patch.status !== rec.status) { setTaskStatus(id, patch.status); delete patch.status; } if (patch.assignee && patch.assignee !== rec.assignee) notify(patch.assignee, 'Task assigned to you: ' + rec.title, userName(SESS.uid), '#/work/tasks?t=' + id); };

<script>

}
ACT['tk.new'] = el => {

  openForm({ title: 'Log ticket', draft: 'ticket-new', wide: false, vals: { clientId: cid, channel: 'Phone', priority: 'Medium' }, fields: [{ n: 'clientId', l: 'Client', t: 'select', req: true, reform: true, o: DB.q('clients').map(c => [c.id, c.name + ' · ' + c.phone]) }, { n: 'saleId', l: 'Plot or sale (optional)', t: 'select', o: v => DB.q('sales').filter(s => s.clientId === v.clientId && !['revoked', 'expired'].includes(s.status)).map(s => [s.id, s.no + ' · ' + s.plotIds.map(i => plotLabel(DB.get('plots', i))).join('; ')]), blank: 'Not about a specific plot' }, { n: 'subject', l: 'Subject', req: true }, { n: 'description', l: 'Details', t: 'textarea' }, { n: 'category', l: 'Category', t: 'select', req: true, o: TK_CATS, half: true }, { n: 'priority', l: 'Priority', t: 'select', req: true, blank: false, o: ['Urgent', 'High', 'Medium', 'Low'], half: true }, { n: 'channel', l: 'Channel', t: 'select', blank: false, o: ['Email', 'Phone', 'Walk-in', 'Tri-Pay'], half: true }, { n: 'owner', l: 'Owner', t: 'select', blank: 'Auto-assign', o: coUsers().filter(u => u.dept === 'Customer Experience').map(u => [u.id, u.name]), half: true }],
    onSubmit: v => { const cx = coUsers().filter(u => u.dept === 'Customer Experience'); const owner = v.owner || (cx.length ? cx[(DB.seq('tkrr') - 1) % cx.length].id : SESS.uid); const sla = DB.setting('slaHours')[v.priority]; const t = DB.add('tickets', { no: 'TK-' + String(DB.seq('ticket')).padStart(4, '0'), clientId: v.clientId, saleId: v.saleId || '', plotId: v.saleId ? DB.get('sales', v.saleId).plotIds[0] : '', subject: v.subject, description: v.description || '', category: v.category, priority: v.priority, channel: v.channel, owner, status: 'Open', created: Date.now(), slaDue: Date.now() + sla * 36e5, notes: [], csat: null, resolvedAt: null, breached: false }); notify(owner, 'Ticket assigned: ' + t.no, v.subject, '#/cx/tickets?t=' + t.id); toast(t.no + ' logged. SLA: ' + sla + ' hours.'); render(); } });

function openTicket(id) {

ACT['tk.note'] = f => { const v = f.t.value.trim(); if (!v) return; const t = DB.get('tickets', f.dataset.id); DB.set('tickets', t.id, { notes: (t.notes || []).concat([{ by: SESS.uid, ts: Date.now(), text: v }]) }, { quiet: true }); refreshOverlays(); };
ACT['tk.status'] = el => { DB.set('tickets', el.dataset.id, { status: el.value }, { action: 'status' }); refreshOverlays(); render(); };
ACT['tk.reassign'] = el => openForm({ title: 'Reassign ticket', fields: [{ n: 'o', l: 'New owner', t: 'select', req: true, o: coUsers().filter(u => u.dept === 'Customer Experience' || u.role === 'hod').map(u => [u.id, u.name]) }], onSubmit: v => { DB.set('tickets', el.dataset.id, { owner: v.o }, { action: 'reassign' }); notify(v.o, 'Ticket reassigned to you', DB.get('tickets', el.dataset.id).no, '#/cx/tickets?t=' + el.dataset.id); refreshOverlays(); render(); } });
ACT['tk.resolve'] = el => askText('Resolve ticket', 'What was done?', n => { const t = DB.get('tickets', el.dataset.id); DB.set('tickets', t.id, { status: 'Resolved', resolvedAt: Date.now(), notes: (t.notes || []).concat([{ by: SESS.uid, ts: Date.now(), text: 'Resolved: ' + n }]) }, { action: 'resolve' }); const cl = DB.get('clients', t.clientId); if (cl) sendExternal('sms', cl.phone, `Triconna: ticket ${t.no} is resolved. How did we do? Rate us 1-5 in Tri-Pay.`); toast('Resolved. A satisfaction survey has gone to the client.'); refreshOverlays(); render(); }, { submit: 'Resolve' });
ACT['tk.close'] = el => openForm({ title: 'Close ticket and record satisfaction', fields: [{ n: 'csat', l: 'Client rating (CSAT)', t: 'select', req: true, blank: 'Select…', o: [[5, '5 · Very satisfied'], [4, '4 · Satisfied'], [3, '3 · Neutral'], [2, '2 · Dissatisfied'], [1, '1 · Very dissatisfied']] }, { n: 'note', l: 'Client comment', t: 'textarea' }], onSubmit: v => { DB.set('tickets', el.dataset.id, { status: 'Closed', csat: +v.csat, csatNote: v.note }, { action: 'close' }); refreshOverlays(); render(); } });
function cxSla() {
  const all = DB.q('tickets'); const sla = DB.setting('slaHours'); const res = all.filter(t => t.resolvedAt); const met = res.filter(t => t.resolvedAt <= t.slaDue).length;

/* ================= Performance ================= */
const PRF_TABS = () => { const t = [{ k: 'scorecards', l: 'Scorecards' }]; if (can('perf.manage')) t.push({ k: 'kpis', l: 'KPI library' }); t.push({ k: 'appraisals', l: 'Appraisals' }); if (can('perf.manage') || can('approve.team')) t.push({ k: 'alerts', l: 'Alerts' }); return t; };
const kpisFor = u => DB.q('kpis').filter(k => k.role === 'All staff' || k.role === u.title);

function kpiEval(k, uid, m) { const a = kpiActual(k, uid, m); const t = kpiTarget(k, m); return { k, a, t, s: kpiStatus({ ...k, target: t }, a) }; }
const fmtKpi = (k, v) => v == null ? '—' : k.unit === '₦' ? moneyShort(v) : (Math.round(v * 10) / 10) + (k.unit === '%' ? '%' : k.unit === '/5' ? ' / 5' : '');
