<style>
/* Tri-OP Management System — brand: Triconna Brand Guidelines (TRC-OPS-SPEC-001 §9) */
:root{
  --ever:#001F10; --forest:#008C38; --deep:#003D20; --tea:#CBFFB5; --honey:#EDFFEA; --porcelain:#FCFFFC;
  --ink:#1A1E16; --harvest:#F27718; --lawn:#8FEB0F; --err:#C62828;
  --muted:#5B6B5F; --line:#D5E3D3; --card:#EDFFEA; --white:#fff; --frame:#DCE7DC;
  --r:12px; --r-card:22px; --r-pill:999px;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --rail-w:76px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-weight:400;color:var(--ink);background:var(--frame);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
b,strong,h1,h2,h3,h4,th{font-weight:500}
h1,h2,h3,h4,p{margin:0}
a{color:var(--forest);text-decoration:none}
a:hover{color:var(--deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.grow{flex:1;min-width:0}
.gap16{gap:16px}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:16px;height:16px}

/* shell */
.shell{display:flex;min-height:100vh;padding:16px;gap:16px}
.rail{position:sticky;top:16px;align-self:flex-start;height:calc(100vh - 32px);width:var(--rail-w);background:var(--ever);border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:14px 0;color:#fff;transition:width .2s;z-index:30;flex:none}
.rail .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;color:#fff;flex:none}
.rail .logo svg{width:34px;height:34px}
.rail nav{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;width:100%;padding:4px 14px;scrollbar-width:none}
.rail nav::-webkit-scrollbar{display:none}
.rail .nl{display:flex;align-items:center;gap:12px;height:44px;border-radius:14px;color:#A9C0B1;padding:0 12px;white-space:nowrap;position:relative}
.rail .nl span{display:none;font-size:13.5px}
.rail .nl:hover{color:#fff;background:#0b2f1c}
.rail .nl.on{background:#2B3A31;color:#fff}
.rail .nl .badge{position:absolute;top:6px;left:28px;min-width:16px;height:16px;border-radius:8px;background:var(--lawn);color:var(--ink);font-size:10px;display:grid;place-items:center;padding:0 4px}
.rail .rb{margin-top:8px;display:flex;flex-direction:column;gap:6px;width:100%;padding:0 14px;align-items:stretch}
.rail .av{margin:10px auto 0}
.rail.open{width:236px}
.rail.open .nl span{display:inline}
.rail.open .nl .badge{position:static;margin-left:auto}
.rail .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6E8A79;padding:10px 12px 2px;display:none}
.rail.open .grp{display:block}
.rail:not(.open) .grp{display:block;height:1px;background:#1b3a29;margin:6px 8px;padding:0;font-size:0}
.main{flex:1;min-width:0;background:var(--porcelain);border-radius:28px;padding:20px 28px 40px;min-height:calc(100vh - 32px)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-pill);padding:0 14px;height:40px;font-size:13px}
.chip select{border:0;background:transparent;outline:none;max-width:200px}
.chip input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.search{flex:1;max-width:460px;position:relative}
.search .chip{width:100%}
.sresults{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,31,16,.14);max-height:60vh;overflow:auto;z-index:50;padding:6px}
.sresults a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--ink)}
.sresults a:hover{background:var(--honey)}
.sresults .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px 2px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--honey)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--harvest);border:2px solid #fff}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.03em;font-weight:500;flex:1;min-width:260px}
.pagehead h1 .pi{display:inline-grid;place-items:center;vertical-align:middle;width:1.35em;height:.95em;background:var(--honey);border:1px solid var(--line);border-radius:999px;margin:0 .1em;position:relative;top:-.05em}
.pagehead h1 .pi.lime{background:var(--tea)}
.pagehead h1 .pi svg{width:.5em;height:.5em;stroke-width:1.8}
.pagehead .sub{color:var(--muted);font-size:14px;letter-spacing:0;margin-top:8px;font-weight:400}
.pagehead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs a{background:var(--white);border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 16px;color:var(--ink);font-size:13px;white-space:nowrap}
.tabs a:hover{background:var(--honey)}
.tabs a.on{background:var(--ever);color:#fff;border-color:var(--ever)}
.tabs a .n{background:var(--lawn);color:var(--ink);border-radius:9px;font-size:11px;padding:1px 6px;margin-left:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--white);color:var(--ink);font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--honey);color:var(--ink)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.primary:hover,.btn.primary:active{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.dark{background:var(--ever);border-color:var(--ever);color:#fff}
.btn.dark:hover{background:var(--deep);color:#fff}
.btn.danger{color:var(--err);border-color:#F0C9C9}
.btn.danger:hover{background:#FCEDED}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,.rail .nl:focus-visible,.tabs a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--forest);outline-offset:2px}

/* cards & tiles */
.card{background:var(--card);border-radius:var(--r-card);padding:20px;min-width:0}
.card.white{background:#fff;border:1px solid var(--line)}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card h3 .ci{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card .ch h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.gx3{grid-template-columns:1fr 1fr 1.15fr}
.gxm{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.tile{border-radius:var(--r-card);padding:18px 20px;background:var(--card);position:relative;overflow:hidden;min-height:150px}
.tile{color:var(--ink)}
a.tile{display:block}
a.tile:hover{color:var(--ink)}
.tile.dark,a.tile.dark:hover{color:#fff}
.tile.dark{background:var(--ever)}
.tile.tea{background:var(--tea)}
.tile.white{background:#fff;border:1px solid var(--line)}
.tile .th{display:flex;align-items:center;gap:10px;font-size:14px}
.tile .th .ci{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink)}
.tile.dark .th .ci{background:#17301f;color:#fff}
.tile .big{font-size:34px;letter-spacing:-.03em;line-height:1;margin:14px 0 12px;font-weight:400;white-space:nowrap}
.tile .big small{font-size:13px;color:var(--muted);letter-spacing:0;margin-left:6px;white-space:nowrap}
.tile.dark .big small,.tile.dark .muted,.tile.dark .small{color:#9fb7a8}
.tile .pc{margin-left:auto;background:#fff;color:var(--ink);border-radius:999px;padding:3px 9px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.caps{display:flex;gap:6px;height:38px}
.caps i{flex:1;border-radius:999px;background:var(--ever)}
.caps i.off{background:transparent;border:1.5px dashed #9cb59f}
.tile.dark .caps i{background:var(--lawn)}
.tile.dark .caps i.off{border-color:#46604f;background:transparent}
.tile a.full{position:absolute;inset:0}
.cta{background:var(--ever);color:#fff;border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;justify-content:flex-end;min-height:180px;position:relative;overflow:hidden}
.cta h3{font-size:24px;line-height:1.1;letter-spacing:-.02em;margin-bottom:16px;max-width:240px}
.cta h3 .lw{color:var(--lawn)}
.cta .leafbg{position:absolute;right:-30px;top:-30px;width:210px;opacity:.55}
.cta .btn{background:#fff;color:var(--ink);border:0}
.qlinks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ql{background:var(--card);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:10px;color:var(--ink);position:relative;min-height:84px}
.ql:hover{background:var(--tea);color:var(--ink)}
.ql .ci{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}
.ql .ar{position:absolute;right:14px;top:14px;color:var(--muted)}
.ql b{display:block;font-size:14px}
.ql span.d{font-size:12px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;background:#E7EEE5;color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.pill.ok{background:var(--tea);color:var(--deep)}
.pill.warn{background:#FDE7D3;color:#8A3F00}
.pill.bad{background:#FADADA;color:#8E1B1B}
.pill.info{background:#DDEBFF;color:#18407A}
.pill.mute{background:#EEF1EE;color:var(--muted)}
.pill.dark{background:var(--ever);color:#fff}
.pill.nodot::before{display:none}
.tag{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;flex:none;background:var(--forest);font-weight:500}
.av.sm{width:26px;height:26px;font-size:10px}
.av.lg{width:56px;height:56px;font-size:18px}
.av.on::after{content:"";position:relative;width:9px;height:9px;border-radius:50%;background:var(--lawn);border:2px solid #fff;left:11px;top:11px;box-sizing:content-box;margin:-5px}

/* tables */
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.ttools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ttools .chip{height:36px}
.ttools .chip select{max-width:150px}
.twrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#F7FCF6;white-space:nowrap;position:sticky;top:0}
.tbl th.num{text-align:right}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--ink)}
.tbl td{padding:12px 16px;border-bottom:1px solid #EAF2E8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.clk{cursor:pointer}
.tbl tbody tr:hover{background:#F7FCF6}
.tbl tbody tr.sel{background:var(--tea)}
.tbl td.chk,.tbl th.chk{width:36px;padding-right:0}
.tfoot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.bulkbar{display:flex;gap:8px;align-items:center;background:var(--ever);color:#fff;padding:8px 16px;font-size:13px}
.bulkbar .btn{height:30px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.6}
.cellmain b{display:block}
.cellmain span{font-size:12px;color:var(--muted)}

/* forms */
.f{display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.fld .req{color:var(--err)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #C6D8C4;background:#fff;border-radius:var(--r);padding:10px 12px;min-height:40px;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(0,140,56,.15)}
.fld input[readonly]{background:#F3F8F2}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}
.fld .err{color:var(--err);font-size:12px;margin-top:4px}
.fld .hint{color:var(--muted);font-size:12px;margin-top:4px}
.fld.chkr{display:flex;gap:10px;align-items:center}
.fld.chkr input{width:auto;min-height:0}
.fld.chkr label{margin:0;color:var(--ink);font-size:13.5px}
.msel{display:flex;flex-wrap:wrap;gap:6px}
.msel label{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:0;color:var(--ink);font-size:13px;cursor:pointer}
.msel input{width:auto;min-height:0;margin:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fsep{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.saved{color:var(--forest);font-size:12px}

/* overlay: modal / drawer / toast */
#overlay .scrim{position:fixed;inset:0;background:rgba(0,31,16,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#overlay .scrim.dr{justify-content:flex-end;padding:0;align-items:stretch}
.modal{background:var(--porcelain);border-radius:var(--r-card);width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,100%)}
.modal.xl{width:min(1080px,100%)}
.drawer{background:var(--porcelain);width:min(620px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-24px 0 64px rgba(0,0,0,.25);border-radius:28px 0 0 28px}
.drawer.wide{width:min(860px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{font-size:19px;letter-spacing:-.01em;flex:1}
.mb{padding:20px 22px;overflow:auto;flex:1}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ever);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s}
.toast.bad{background:var(--err)}
.toast.warn{background:var(--harvest);color:var(--ink)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.sec{margin-top:20px}
.sec>h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl .it{position:relative;font-size:13px}
.tl .it::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--forest);border:2px solid var(--porcelain)}
.alert{border-radius:14px;padding:12px 14px;background:#FDE7D3;color:#6a3000;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.ok{background:var(--tea);color:var(--deep)}
.alert.info{background:#E7F1FF;color:#18407A}
.alert.bad{background:#FADADA;color:#8E1B1B}
.prog{height:8px;border-radius:999px;background:#fff;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--forest);border-radius:999px}
.prog.warn i{background:var(--harvest)}

/* charts */
.pbars{display:flex;gap:10px;align-items:flex-end;height:240px;padding:6px 8px 0 36px;position:relative}
.pbars .yax{position:absolute;left:0;top:6px;bottom:28px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted)}
.pbars .gl{position:absolute;left:34px;right:0;top:6px;bottom:28px;pointer-events:none}
.pb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;position:relative;z-index:1;min-width:0}
.pb .col{flex:1;width:100%;max-width:44px;display:flex;align-items:flex-end;position:relative}
.pb .bar{width:100%;border-radius:999px;background:var(--ever);position:relative;transition:height .4s;min-height:30px}
.pb .bar .in{position:absolute;left:0;right:0;bottom:0;border-radius:999px;background:var(--lawn);min-height:30px}
.pb .bar .d1{position:absolute;top:8px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:#fff}
.pb .bar .d2{position:absolute;bottom:8px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:var(--ever)}
.pb .bar .lab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--ever);color:#fff;border-radius:999px;font-size:11px;padding:2px 8px;white-space:nowrap}
.pb.ghost .bar{background:transparent;border:1.5px dashed #9cb59f}
.pb.ghost .bar .d1{background:#9cb59f}
.pb.ghost .bar .in,.pb.ghost .bar .d2{display:none}
.pb .xl{font-size:11.5px;color:var(--muted);margin-top:8px;height:20px;white-space:nowrap}
.pb.cur .xl{color:var(--ink);font-weight:500}
.legend{display:flex;gap:16px;font-size:12.5px;align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.hb{display:flex;flex-direction:column;gap:10px}
.hb .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.ring{position:relative;display:inline-grid;place-items:center}
.ring span{position:absolute;font-size:11px}
.agebar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pbl{height:60px;position:relative}
svg.line{width:100%;height:150px}
.plotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.plot{border-radius:14px;padding:8px 6px;text-align:center;font-size:12px;border:1.5px solid transparent;cursor:pointer;background:#fff;line-height:1.2;position:relative}
.plot b{display:block;font-size:14px}
.plot small{color:var(--muted);font-size:10.5px}
.plot.available{background:var(--tea);border-color:var(--forest)}
.plot.reserved{background:#FDE7D3;border-color:var(--harvest)}
.plot.allocated{background:var(--ever);color:#fff}
.plot.allocated small{color:#9fb7a8}
.plot.paid{background:var(--forest);color:#fff}
.plot.paid small{color:#d3f3dc}
.plot.documented{background:var(--lawn);border-color:var(--lawn);color:var(--ink)}
.plot.withheld{background:#EEF1EE;border:1.5px dashed #9cb59f}
.plot.revoked{background:#fff;border:1.5px dashed var(--err);color:var(--err)}
.plot:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,31,16,.18)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--card);border-radius:var(--r-card);padding:12px;min-height:240px}
.col .chd{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-size:13.5px}
.col .chd .n{background:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px}
.col.over{outline:2px dashed var(--forest)}
.kc{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;border:1px solid var(--line);cursor:grab;font-size:13px}
.kc:hover{border-color:var(--forest)}
.kc b{display:block;margin-bottom:4px}
.kc .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}

/* gantt / calendar */
.gantt{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r-card)}
.gantt .gr{display:grid;border-bottom:1px solid #EAF2E8;align-items:center;min-height:38px}
.gantt .gl{padding:6px 14px;font-size:13px;border-right:1px solid var(--line);position:sticky;left:0;background:#fff;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .gb{position:relative;height:38px}
.gantt .gb i{position:absolute;top:9px;height:20px;border-radius:999px;background:var(--forest);font-style:normal;color:#fff;font-size:11px;padding:0 10px;overflow:hidden;white-space:nowrap;line-height:20px}
.gantt .gb i.done{background:var(--ever)}
.gantt .gb i.late{background:var(--harvest);color:var(--ink)}
.gantt .gh{background:#F7FCF6;font-size:11px;color:var(--muted)}
.gantt .gh .gb span{position:absolute;top:10px;font-size:11px}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--lawn);z-index:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cal .h{background:#F7FCF6;padding:8px;font-size:12px;color:var(--muted);text-align:center}
.cal .d{background:#fff;min-height:96px;padding:6px;font-size:12px;overflow:hidden}
.cal .d.o{background:#FAFCFA;color:#aab}
.cal .d.t{background:var(--honey)}
.cal .d .e{display:block;background:var(--tea);color:var(--deep);border-radius:6px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;cursor:pointer}
.cal .d .e.w{background:#FDE7D3;color:#8A3F00}
.cal .d .e.i{background:#DDEBFF;color:#18407A}
.org{display:block;overflow:auto;text-align:center;padding:10px}
.org ul{list-style:none;margin:0;padding:20px 0 0;display:inline-flex;justify-content:center;position:relative;text-align:left;vertical-align:top}
.org li{position:relative;padding:20px 8px 0;display:flex;flex-direction:column;align-items:center}
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:1.5px solid #A9C7A6}
.org li::after{right:auto;left:50%;border-left:1.5px solid #A9C7A6}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:first-child::before,.org li:last-child::after{border-top:0}
.org li:last-child::before{border-right:1.5px solid #A9C7A6;border-radius:0 8px 0 0}
.org li:first-child::after{border-radius:8px 0 0 0}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:1.5px solid #A9C7A6}
.org>ul{padding-top:0}
.org>ul>li{padding-top:0}
.org>ul>li::before,.org>ul>li::after{display:none}
.onode{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center;min-width:118px;max-width:150px;cursor:pointer}
.onode:hover{background:var(--tea)}
.onode b{display:block;font-size:13px}.onode span{font-size:11.5px;color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);height:calc(100vh - 230px);min-height:480px;overflow:hidden}
.chat.nothr{grid-template-columns:260px minmax(0,1fr)}
.chat .cl{background:var(--honey);overflow:auto;padding:12px;border-right:1px solid var(--line)}
.chat .cl h5{margin:12px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;display:flex;align-items:center}
.chat .ci2{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;color:var(--ink);font-size:13.5px;cursor:pointer}
.chat .ci2:hover{background:#fff}
.chat .ci2.on{background:var(--ever);color:#fff}
.chat .ci2 .u{margin-left:auto;background:var(--lawn);color:var(--ink);border-radius:9px;font-size:11px;padding:0 6px}
.chat .cm{display:flex;flex-direction:column;min-width:0}
.chat .cmh{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat .msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px}
.msg .bd{min-width:0}
.msg .nm{font-size:13px}
.msg .nm span{color:var(--muted);font-size:11.5px;margin-left:6px}
.msg .tx{white-space:pre-wrap;word-break:break-word}
.msg .tx .mn{background:var(--tea);border-radius:6px;padding:0 4px;color:var(--deep)}
.msg .ma{display:none;gap:4px;margin-left:8px}
.msg:hover .ma{display:inline-flex}
.msg .ma button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11.5px;padding:1px 6px}
.msg .rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.msg .rx button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.msg .rx button.me{background:var(--tea);border-color:var(--forest)}
.msg .attach{margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--honey);display:inline-flex;gap:8px;align-items:center;font-size:12.5px}
.msg img.pic{max-width:260px;border-radius:12px;display:block;margin-top:6px}
.msg .rec{margin-top:6px;border-left:3px solid var(--forest);background:var(--honey);border-radius:10px;padding:6px 10px;font-size:12.5px;display:block;color:var(--ink)}
.composer{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border:1px solid #C6D8C4;border-radius:16px;padding:10px 14px;resize:none;min-height:42px;max-height:120px;outline:none}
.thr{border-left:1px solid var(--line);display:flex;flex-direction:column;background:#FAFFF9;min-height:0}

/* misc layouts */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:var(--frame);padding:16px;gap:16px}
.login .l{background:var(--ever);color:#fff;border-radius:28px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:16px;height:calc(100vh - 32px);overflow:hidden}
.login .l h1{font-size:clamp(34px,4.4vw,58px);line-height:1.04;letter-spacing:-.03em;font-weight:500;max-width:520px}
.login .l h1 em{font-style:normal;color:var(--lawn)}
.login .l .leafbg{position:absolute;right:-60px;top:-30px;width:380px;opacity:.55}
.login .r{background:var(--porcelain);border-radius:28px;padding:36px;overflow:auto}
.ucard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.ucard:hover{background:var(--tea);border-color:var(--forest)}
.ucard b{display:block}
.ucard span:not(.av):not(.pill){font-size:12px;color:var(--muted)}
.publicpage{max-width:640px;margin:0 auto;padding:32px 16px}
.doc{background:#fff;color:#111;padding:44px 48px;font-size:13.5px;line-height:1.55;max-width:760px;margin:0 auto;border:1px solid var(--line)}
.doc .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--forest);padding-bottom:14px;margin-bottom:22px}
.doc .lh b{font-size:20px;color:var(--ever)}
.doc table{width:100%;border-collapse:collapse;margin:12px 0}
.doc td,.doc th{border:1px solid #cfe0cd;padding:6px 10px;text-align:left}
.doc .qr{float:right;width:96px;margin:0 0 8px 16px}
.doc .foot{border-top:1px solid #cfe0cd;margin-top:28px;padding-top:10px;font-size:11.5px;color:#556}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;letter-spacing:-.02em;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.tilebtn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.tilebtn:hover{background:var(--honey)}
.mnav{display:none}
.clock{display:flex;gap:10px;align-items:center}
.sig{display:inline-block;width:10px;height:10px;border-radius:50%}
.sig.g{background:var(--forest)}.sig.a{background:var(--harvest)}.sig.r{background:var(--err)}
.scroll-x{overflow-x:auto}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0b1f14;color:#bfe9c5;border-radius:14px;padding:12px;overflow:auto;max-height:260px;white-space:pre}

@media(max-width:1200px){.gxm{grid-template-columns:1fr}.gx3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}.chat{grid-template-columns:220px minmax(0,1fr)}.chat .thr{display:none}}
@media(max-width:860px){
  .shell{padding:0;display:block}
  .rail{display:none}
  .main{border-radius:0;padding:14px 14px 96px;min-height:100vh}
  .g2,.g3,.g4,.gx3,.gxm,.fgrid,.qlinks{grid-template-columns:1fr}
  .qlinks{grid-template-columns:1fr 1fr}
  .topbar .chip.co{display:none}
  .mnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:var(--ever);border-radius:26px;padding:6px;z-index:60;justify-content:space-around}
  .mnav a,.mnav button{display:grid;place-items:center;gap:2px;color:#A9C0B1;padding:8px 10px;border-radius:18px;font-size:10.5px;background:none;border:0;min-width:56px}
  .mnav a.on{background:#2B3A31;color:#fff}
  .login{grid-template-columns:1fr;padding:0}
  .login .l{border-radius:0;padding:28px;min-height:230px}
  .login .r{border-radius:0}
  .chat,.chat.nothr{grid-template-columns:1fr;height:auto}
  .chat .cl{max-height:200px}
  .kv{grid-template-columns:120px 1fr}
  .drawer{border-radius:0}
  .doc{padding:22px}
  .pagehead h1{min-width:0}
}
@media print{
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  .doc{border:0;max-width:none;padding:0}
  body{background:#fff}
}
#print-root{display:none}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

<script>
'use strict';
/* Tri-OP business engine: ledger, sales & payments, approvals, scheduled jobs, documents, KPIs */

/* ---------- org helpers ---------- */

const managerOf = uid => { const u = userById(uid); return u && u.manager ? u.manager : deptHead(u?.dept); };

/* ---------- ledger ---------- */
const ACCT_TYPES = { asset: 'Asset', liability: 'Liability', equity: 'Equity', income: 'Income', expense: 'Expense' };
const acctByCode = c => DB.q('accounts').find(a => a.code === c);

function postJournal(j) {
  const lines = j.lines.map(l => ({ acct: l.acct, dr: Math.round((+l.dr || 0) * 100) / 100, cr: Math.round((+l.cr || 0) * 100) / 100, dept: l.dept || '', memo: l.memo || '' })).filter(l => l.dr || l.cr);
  const dr = sum(lines, l => l.dr), cr = sum(lines, l => l.cr);

  for (const l of lines) if (!acctByCode(l.acct)) throw new Error('Account ' + l.acct + ' does not exist in the chart of accounts.');
  const status = j.status || 'posted';
  if (status === 'posted' && !j.force && periodClosed(j.date)) throw new Error(monthLabel(monthKey(j.date)) + ' is closed. Ask an executive to reopen the period, or post in an open period.');
  const no = j.no || ('JV-' + j.date.slice(0, 4) + '-' + String(DB.seq('journal')).padStart(4, '0'));
  return DB.add('journals', { no, date: j.date, memo: j.memo, lines, source: j.source || 'manual', ref: j.ref || '', status, by: j.by || SESS.uid, total: dr }, { quiet: j.quiet });

      DB.add('rules', { type: 'revocation', tiers: [{ max: null, steps: ['opsdir', 'exec'] }] });
      DB.add('rules', { type: 'reopen', tiers: [{ max: null, steps: ['exec'] }] });
      const tp = (type, name, body) => DB.add('templates', { type, name, body });
      tp('offer', 'Offer letter', '<p>{{date}}</p><p><b>{{client.name}}</b><br>{{client.address}}</p><p>Dear {{client.name}},</p><p>We are pleased to offer you plot(s) <b>{{plotsText}}</b> at <b>{{estate.name}}</b>, {{estate.location}}, under the <b>{{sale.planName}}</b> payment plan.</p><table><tr><th>Total price</th><td>{{sale.totalF}}</td></tr><tr><th>Initial deposit</th><td>{{sale.depositF}}</td></tr><tr><th>Sale reference</th><td>{{sale.no}}</td></tr></table><p>Your reservation is held until the deposit is confirmed. Please pay through Tri-Pay and keep your receipt.</p><p>Yours faithfully,<br>{{officer}}<br>{{company.name}}</p>');
      tp('allocation', 'Allocation letter', '<p>{{date}}</p><p><b>{{client.name}}</b></p><p>This letter confirms the allocation of plot(s) <b>{{plotsText}}</b> in <b>{{estate.name}}</b> ({{estate.location}}) to you, under sale reference <b>{{sale.no}}</b>.</p><p>Amount paid to date: {{sale.paidF}}. Balance: {{sale.balanceF}}.</p><p>This allocation is subject to the terms of your sales agreement and the payment plan.</p><p>{{company.name}}</p>');
      tp('receipt', 'Payment receipt', '<table><tr><th>Receipt no.</th><td>{{payment.receiptNo}}</td></tr><tr><th>Received from</th><td>{{client.name}}</td></tr><tr><th>Amount</th><td>{{payment.amountF}}</td></tr><tr><th>Payment date</th><td>{{payment.dateF}}</td></tr><tr><th>Method</th><td>{{payment.method}}</td></tr><tr><th>Sale</th><td>{{sale.no}} · {{plotsText}}</td></tr><tr><th>Balance after payment</th><td>{{sale.balanceF}}</td></tr></table><p>Thank you for your payment.</p>');
      tp('ack', 'Payment acknowledgement', '<p>{{date}}</p><p>Dear {{client.name}},</p><p>We acknowledge receipt of {{payment.amountF}} on {{payment.dateF}} towards sale {{sale.no}}. Your outstanding balance is {{sale.balanceF}}.</p><p>{{company.name}}</p>');
      tp('revocation', 'Revocation notice', '<p>{{date}}</p><p>Dear {{client.name}},</p><p>Following review, your allocation under sale {{sale.no}} has been revoked. A refund of {{refund}} has been approved.</p><p>{{company.name}}</p>');
    }

<script>
'use strict';
/* Tri-OP shell: router, navigation, login, search, notifications, profile */

const PAGES = {}; const AFTER = []; const UI = { open: false };
try { Object.assign(UI, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch (e) { }
let ROUTE = { parts: [], q: {} };

const NAV = [
  { k: 'dashboard', l: 'Dashboard', ic: 'home' }, { k: 'mywork', l: 'My work', ic: 'check' },
  { g: 'Sales' }, { k: 'inventory', l: 'Property inventory', ic: 'estate' }, { k: 'crm', l: 'Sales and CRM', ic: 'users' }, { k: 'realtors', l: 'Realtors (TARP)', ic: 'share' }, { k: 'cx', l: 'Customer experience', ic: 'headset' },
  { g: 'Money' }, { k: 'finance', l: 'Finance', ic: 'coins' }, { k: 'accounting', l: 'Accounting', ic: 'calc' },
  { g: 'People' }, { k: 'hr', l: 'HR and admin', ic: 'briefcase' }, { k: 'performance', l: 'Performance', ic: 'trophy' }, { k: 'learning', l: 'Learning', ic: 'cap' },
  { g: 'Work' }, { k: 'work', l: 'Tasks and projects', ic: 'clipboard' }, { k: 'reports', l: 'Department reports', ic: 'file' }, { k: 'chat', l: 'Team chat', ic: 'chat' },
  { g: 'System' }, { k: 'approvals', l: 'Approvals', ic: 'shield' }, { k: 'admin', l: 'Admin console', ic: 'settings' }
];
const OPEN_MODS = ['approvals', 'notifications', 'search', 'profile'];
const allowed = m => OPEN_MODS.includes(m) || !!modAccess(m);

function parseHash() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const q = {};
  (qs || '').split('&').filter(Boolean).forEach(p => { const [k, v] = p.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), q };
}
function go(path) { if (location.hash === '#/' + path) render(); else location.hash = '#/' + path; }
function openFromQuery(key, fn) { if (ROUTE.q[key]) { const id = ROUTE.q[key]; history.replaceState(null, '', location.pathname + location.search + '#/' + ROUTE.parts.join('/')); delete ROUTE.q[key]; setTimeout(() => fn(id), 20); } }

/* ---------- render ---------- */
let lastRoute = '';
function render() {
  ROUTE = parseHash(); const mod = ROUTE.parts[0] || '';
  const scrollY = window.scrollY, same = lastRoute === ROUTE.parts.join('/'); lastRoute = ROUTE.parts.join('/');
  AFTER.length = 0;
  const app = $('#app');
  if (mod === 'f' || mod === 'verify') { app.innerHTML = mod === 'f' ? (ROUTE.parts[1] === 'lead' ? publicLeadForm() : publicFormA()) : publicVerify(ROUTE.parts[1]); document.title = 'Triconna Real Estate'; return; }
  if (!SESS.uid || !me()) { app.innerHTML = loginPage(); document.title = 'Sign in · Tri-OP'; return; }
  if (!mod || mod === 'login') { location.hash = '#/dashboard'; return; }
  DB.sync();
  let html;
  if (!allowed(mod)) html = noAccess(mod);
  else if (!PAGES[mod]) html = card('Not found', '<p>This page does not exist.</p>');
  else { try { html = PAGES[mod](ROUTE.parts.slice(1), ROUTE.q); } catch (e) { console.error(e); html = card('Something went wrong', `<p>${esc(e.message)}</p><p class="muted small">Try again, or go back to the dashboard.</p>`); } }
  const keepSearch = $('#gsearch')?.value;
  app.innerHTML = shell(html, mod);
  if (keepSearch) $('#gsearch').value = keepSearch;
  document.title = (NAV.find(n => n.k === mod)?.l || 'Tri-OP') + ' · Tri-OP';
  AFTER.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  refreshOverlays(); if (same) window.scrollTo(0, scrollY); else window.scrollTo(0, 0);
}
function noAccess(mod) { return pageHead({ title: 'No access' }) + card('', `<p>Your role (${esc(ROLES[me().role].label)}) does not include this area. Access is scoped by role, department and record. Ask an administrator if you need it.</p><p style="margin-top:12px"><a class="btn" href="#/dashboard">Back to dashboard</a></p>`); }

function approvalCount() { return DB.q('approvals').filter(a => canDecide(a)).length; }
function chatUnread() { const u = me(); const rd = u.chatRead || {}; return DB.q('channels').filter(c => c.members.includes(u.id) && !(u.mute || []).includes(c.id)).reduce((n, c) => n + DB.q('messages').filter(m => m.ch === c.id && m.by !== u.id && m.ts > (rd[c.id] || 0)).length, 0); }
function shell(content, mod) {
  const u = me(); const badges = { approvals: approvalCount(), chat: chatUnread() };
  const rail = NAV.map(n => { if (n.g) return `<div class="grp">${n.g}</div>`; if (!allowed(n.k)) return ''; return `<a class="nl ${mod === n.k ? 'on' : ''}" href="#/${n.k}" title="${esc(n.l)}" aria-label="${esc(n.l)}">${icon(n.ic)}<span>${n.l}</span>${badges[n.k] ? `<em class="badge" style="font-style:normal">${badges[n.k]}</em>` : ''}</a>`; }).join('').replace(/<div class="grp">[^<]*<\/div>(?=<div class="grp">|$)/g, '');
  const mn = [['dashboard', 'home', 'Home'], ['mywork', 'check', 'My work'], ['chat', 'chat', 'Chat'], ['approvals', 'shield', 'Approvals']].filter(x => allowed(x[0])).map(([k, ic, l]) => `<a href="#/${k}" class="${mod === k ? 'on' : ''}">${icon(ic)}<span>${l}</span></a>`).join('') + `<button data-act="more" aria-label="More">${icon('menu')}<span>More</span></button>`;
  const cos = DB.d.companies.filter(c => u.co.includes(c.id));
  return `<div class="shell"><aside class="rail ${UI.open ? 'open' : ''}"><button class="logo" data-act="nav.toggle" aria-label="Expand or collapse menu" title="Expand or collapse menu" style="border:0;background:none;cursor:pointer">${logoSvg('#fff')}</button><nav aria-label="Main">${rail}</nav><div class="rb"><a class="nl" href="#/profile" title="Profile">${icon('user')}<span>${esc(u.name)}</span></a></div></aside>
  <main class="main" id="main"><div class="topbar">${cos.length > 1 ? `<label class="chip co">${icon('building', 'sm')}<select id="cosw" aria-label="Company">${opts(cos.map(c => [c.id, c.name]), CO)}</select></label>` : `<span class="chip co">${icon('building', 'sm')}${esc(company().name)}</span>`}
  <div class="search"><label class="chip">${icon('search', 'sm')}<input id="gsearch" type="search" placeholder="Search clients, plots, staff, invoices, tickets" autocomplete="off" aria-label="Global search"></label><div class="sresults hide" id="sres"></div></div><span class="sp"></span>
  ${readOnlyUser() ? '' : `<button class="btn primary" data-act="quick">${icon('plus', 'sm')} Quick create</button>`}
  <button class="iconbtn" data-act="bell" aria-label="Notifications">${icon('bell')}${unreadCount() ? '<span class="dot"></span>' : ''}</button>
  <button class="iconbtn" style="padding:0;border:0" data-act="profile" aria-label="Profile">${avatar(u.name)}</button></div>${content}</main></div><nav class="mnav" aria-label="Mobile">${mn}</nav>`;
}
function renderBadge() { if (SESS.uid && me()) render(); }

/* ---------- login ---------- */
function loginPage() {
  const groups = [['Executives', ['u_md', 'u_coo']], ['Heads of department', ['u_ops', 'u_sales', 'u_rd', 'u_cxh']], ['Finance and HR', ['u_fin1', 'u_fin2', 'u_hr']], ['Staff', ['u_s1', 'u_cx1', 'u_op1']], ['System and audit', ['u_admin', 'u_aud']]];
  return `<div class="login"><section class="l">${leafBg}<div class="row" style="gap:14px"><span style="width:46px;display:block">${logoSvg('#fff')}</span><div><div style="font-size:20px">Tri-OP</div><div style="color:#9fb7a8;font-size:13px">Triconna Real Estate</div></div></div><div><h1>One calm place to run <em>sales</em>, money and people.</h1><p style="color:#bcd3c4;margin-top:16px;max-width:460px">Inventory, CRM, finance and accounting, realtors, HR, tasks, chat and learning, each person seeing only what their role allows.</p></div><div class="small" style="color:#7f9b8a">TRC-OPS-SPEC-001 · Prototype with demo data stored in this browser</div></section>
  <section class="r"><div style="max-width:560px;margin:0 auto"><h2 style="font-size:28px;letter-spacing:-.02em;margin-bottom:6px">Sign in</h2><p class="muted" style="margin-bottom:20px">Pick a demo account to see the role-based view. Executive, Finance, HR and Admin roles ask for a two-factor code (demo code: <b>123456</b>).</p>
  ${groups.map(([g, ids]) => `<div class="small muted" style="margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em">${g}</div><div class="stack" style="gap:8px">${ids.map(id => { const u = userById(id); const r = ROLES[u.role]; return `<button class="ucard" data-act="login" data-u="${id}">${avatar(u.name)}<div class="grow"><b>${esc(u.name)}</b><span>${esc(u.title)} · ${esc(r.label)}</span></div>${r.tfa ? `<span class="pill nodot">${icon('lock', 'sm')} 2FA</span>` : ''}${icon('chevr', 'sm')}</button>`; }).join('')}</div>`).join('')}
  <div class="hr"></div><a class="btn" href="#/f/form-a">${icon('share', 'sm')} Realtor registration (Form A)</a> <button class="btn ghost" data-act="demo.reset">Reset demo data</button></div></section></div>`;
}
ACT['login'] = el => {
  const u = userById(el.dataset.u);
  const done = () => { SESS.uid = u.id; SESS.co = u.co.includes(CO) ? CO : u.co[0]; CO = SESS.co; saveSession(); audit('login', 'session', u.id, ROLES[u.role].label + (ROLES[u.role].tfa ? ' (2FA)' : '')); location.hash = '#/dashboard'; render(); };
  if (ROLES[u.role].tfa) openForm({ title: 'Two-factor sign-in', submit: 'Verify and sign in', fields: [{ n: 'code', l: 'Six-digit code from your authenticator app', req: true, ph: '123456', hint: 'Demo code: 123456', vf: v => v === '123456' ? '' : 'That code is not valid. Enter 123456 for the demo.' }], onSubmit: () => { done(); } });
  else done();
};
ACT['logout'] = () => { audit('logout', 'session', SESS.uid, ''); SESS.uid = null; saveSession(); closeAllOverlays(); location.hash = '#/login'; render(); };
ACT['demo.reset'] = () => confirmDlg('This replaces all data in this browser with the original demo data.', () => { DB.reset(); SESS.uid = null; saveSession(); location.hash = '#/login'; render(); toast('Demo data reset'); }, { danger: true, yes: 'Reset data' });
ACT['switch.user'] = el => { closeAllOverlays(); SESS.uid = null; saveSession(); location.hash = '#/login'; render(); };

/* ---------- public pages ---------- */
function publicShell(inner) { return `<div class="publicpage"><div class="row" style="gap:12px;margin-bottom:20px"><span style="width:44px;display:block">${logoSvg('#008C38').replace(/stroke="#001F10"/, 'stroke="#FCFFFC"')}</span><div><b style="font-size:18px">Triconna Real Estate</b><div class="muted small">TARP realtor network</div></div></div>${inner}</div>`; }
function publicFormA() {
  const q = ROUTE.q; const camp = DB.d.campaigns.find(c => c.code === q.camp); const refc = (q.ref || '').toUpperCase();
  const ups = DB.d.realtors.find(r => r.code && r.code === refc);
  const src = ups ? 'Referral' : camp ? (camp.kind === 'consultant' ? 'Ads: Consultant campaign' : 'Ads: Triconna brand') : 'Organic';
  const srcNote = ups ? 'Referred by ' + ups.name : camp ? 'Campaign: ' + camp.name : 'General registration link';
  const fields = [{ n: 'name', l: 'Full name', req: true }, { n: 'phone', l: 'Phone number', t: 'tel', req: true, hint: 'We use your phone number to avoid duplicate registrations.' }, { n: 'email', l: 'Email', t: 'email', req: true }, { n: 'address', l: 'Home address' }, { n: 'refcode', l: 'Referral code (if you have one)', v: refc }, { n: 'heard', l: 'How did you hear about us?', t: 'select', o: ['Instagram', 'Facebook', 'Radio', 'Billboard', 'Friend or colleague', 'Walk-in', 'Search or website', 'Other'], hint: 'For marketing reports only. It does not change your source.' }, { n: 'agree', l: 'I agree that Triconna may process my details under the Nigeria Data Protection Act 2023.', t: 'check', req: true }];
  return publicShell(`<div class="card white"><h2 style="font-size:24px;letter-spacing:-.02em;margin-bottom:6px">Join the TARP realtor network</h2><p class="muted" style="margin-bottom:16px">Form A: register your interest. Our Realtors Development team will guide you through onboarding.</p><div class="alert ok" style="margin-bottom:16px">${icon('check', 'sm')}<span>Source recorded from this link: <b>${esc(src)}</b>. ${esc(srcNote)}</span></div><form id="forma" novalidate>${formHtml(fields, { refcode: refc }, 'fa')}</form><p style="margin-top:16px"><button class="btn primary" data-act="forma.submit" data-src="${esc(src)}" data-camp="${esc(camp?.id || '')}">Register</button></p></div>`);
}
ACT['forma.submit'] = el => {
  const form = $('#forma'); const fields = [{ n: 'name', l: 'Full name', req: true }, { n: 'phone', l: 'Phone number', req: true }, { n: 'email', l: 'Email', req: true }, { n: 'address', l: 'Address' }, { n: 'refcode', l: 'Referral code' }, { n: 'heard', l: 'Heard' }, { n: 'agree', l: 'Consent', t: 'check', req: true }];
  const v = readForm(form, fields); if (!v) return; if (!v.agree) { toast('Please accept the data consent.', 'warn'); return; }
  const coId = DB.d.companies[0].id; const co0 = CO; CO = coId;
  const dup = DB.q('realtors').find(r => phoneNorm(r.phone) === phoneNorm(v.phone));
  if (dup) { CO = co0; $('#app').innerHTML = publicShell(card('Already registered', `<p>This phone number is already registered with the TARP network, so no new entry was created. Our team will contact you.</p>`)); return; }
  const refc = (v.refcode || '').trim().toUpperCase(); const up = refc && DB.q('realtors').find(r => r.code === refc);
  let source = el.dataset.src, ref = el.dataset.camp; if (up) { source = 'Referral'; ref = up.id; }
  const r = DB.add('realtors', { name: v.name, phone: v.phone, email: v.email, address: v.address, stage: 'Entry registered', source, sourceRef: ref, heard: v.heard, batch: '', created: Date.now(), lastActivity: Date.now(), checklist: Object.fromEntries(['formB', 'physical', 'cbt', 'tour', 'formC', 'docs'].map(k => [k, { done: false }])), level: '', code: '', upline: up ? up.id : '', formA: true, locked: true }, { quiet: true });
  audit('form-a', 'realtors', r.id, 'Online Form A · source ' + source);
  const head = deptHead('Realtors Development'); notify(head, 'New Form A sign-up: ' + v.name, 'Source: ' + source, '#/realtors/pipeline');
  CO = co0; $('#app').innerHTML = publicShell(card('Thank you', `<p style="font-size:16px;margin-bottom:8px">Your registration has been received, <b>${esc(v.name)}</b>.</p><p class="muted">We will contact you on ${esc(v.phone)} with your onboarding schedule.</p>`));
};
function publicVerify(code) {
  const d = DB.d.docsLog.find(x => x.code === code);
  return publicShell(d ? `<div class="card white"><div class="alert ok" style="margin-bottom:14px">${icon('check', 'sm')}<span><b>Valid document.</b> This was issued by Triconna Real Estate.</span></div>${kv([['Document', esc(d.title)], ['Reference', esc(d.code)], ['Issued', fmtDT(d.ts)], ['Client', esc(d.client || '—')], ['Sale', esc(d.saleNo || '—')]])}</div>` : `<div class="card white"><div class="alert bad">${icon('warn', 'sm')}<span><b>We could not verify this code.</b> Check the code on the document, or contact Triconna.</span></div></div>`);
}

/* ---------- global search ---------- */
function searchAll(q) {
  q = q.toLowerCase().trim(); if (q.length < 2) return []; const m = s => String(s || '').toLowerCase().includes(q); const out = [];
  const add = (g, t, s, l, ic) => out.push({ g, t, s, l, ic });
  if (modAccess('crm') || modAccess('crm:read')) { DB.q('clients').filter(c => m(c.name) || m(c.phone) || m(c.email)).slice(0, 5).forEach(c => add('Clients', c.name, c.phone, `crm/client/${c.id}`, 'user')); DB.q('leads').filter(c => m(c.name) || m(c.phone)).slice(0, 4).forEach(c => add('Leads', c.name, c.stage + ' · ' + c.phone, `crm/leads?l=${c.id}`, 'target')); DB.q('sales').filter(s => m(s.no)).slice(0, 3).forEach(s => add('Sales', s.no, DB.get('clients', s.clientId)?.name, `crm/sales?s=${s.id}`, 'receipt')); }
  if (modAccess('inventory') || modAccess('inventory:read')) DB.q('plots').filter(p => m(plotLabel(p)) || m(p.survey)).slice(0, 6).forEach(p => add('Plots', plotLabel(p), PLOT_LABEL[p.status] + ' · ' + money(p.price), `inventory/plots?p=${p.id}`, 'estate'));
  if (modAccess('hr') || can('read.all')) DB.q('employees').filter(e => m(e.name) || m(e.title)).slice(0, 5).forEach(e => add('Staff', e.name, e.title + ' · ' + e.dept, `hr/directory?e=${e.id}`, 'users')); else DB.q('employees').filter(e => m(e.name)).slice(0, 4).forEach(e => add('Staff', e.name, e.title, `hr/directory?e=${e.id}`, 'users'));
  if (modAccess('finance')) DB.q('invoices').filter(i => m(i.no) || m(i.customer)).slice(0, 4).forEach(i => add('Invoices', i.no, i.customer + ' · ' + money(i.total), `finance/invoices?i=${i.id}`, 'receipt'));
  if (modAccess('cx')) DB.q('tickets').filter(t => m(t.no) || m(t.subject)).slice(0, 4).forEach(t => add('Tickets', t.no + ' · ' + t.subject, t.status, `cx/tickets?t=${t.id}`, 'headset'));
  DB.q('tasks').filter(t => m(t.title) && (can('task.manage') || t.assignee === SESS.uid || (t.followers || []).includes(SESS.uid))).slice(0, 4).forEach(t => add('Tasks', t.title, userName(t.assignee) + ' · ' + t.status, `work/tasks?t=${t.id}`, 'clipboard'));
  if (modAccess('realtors') || modAccess('realtors:read')) DB.q('realtors').filter(r => m(r.name) || m(r.code)).slice(0, 4).forEach(r => add('Realtors', r.name, r.stage, `realtors/pipeline?r=${r.id}`, 'share'));
  return out;
}
function paintSearch(q) {
  const box = $('#sres'); if (!box) return; const res = searchAll(q); if (q.trim().length < 2) { box.classList.add('hide'); return; }
  let g = ''; box.innerHTML = res.length ? res.map(r => { const h = (r.g !== g ? `<div class="grp">${r.g}</div>` : ''); g = r.g; return `${h}<a href="#/${r.l}" data-act="sclose">${icon(r.ic, 'sm')}<span class="grow"><b style="font-weight:500">${esc(r.t)}</b><br><span class="small muted">${esc(r.s || '')}</span></span></a>`; }).join('') : '<div class="empty">No results. Try a name, phone number, plot or invoice number.</div>';
  box.classList.remove('hide');
}
ACT['sclose'] = () => { $('#sres')?.classList.add('hide'); const s = $('#gsearch'); if (s) s.value = ''; };

/* ---------- notifications, profile, quick create ---------- */
ACT['bell'] = () => openDrawer(() => { const list = DB.q('notifications').filter(n => n.user === SESS.uid).sort(by(n => n.ts, -1)).slice(0, 40); return { title: 'Notifications', body: list.length ? `<div class="stack" style="gap:8px">${list.map(n => `<a class="tilebtn" href="${n.link || '#/notifications'}" data-act="nread" data-id="${n.id}" style="${n.read ? '' : 'background:var(--honey);border-color:var(--forest)'}">${icon(n.critical ? 'warn' : 'bell')}<span class="grow"><b style="font-weight:500">${esc(n.title)}</b><br><span class="small muted">${esc(n.body)} · ${ago(n.ts)}</span></span></a>`).join('')}</div>` : emptyState('You are all caught up.', 'bell'), foot: `<button class="btn" data-act="nreadall">Mark all as read</button>` }; });
ACT['nread'] = el => { DB.set('notifications', el.dataset.id, { read: true }, { quiet: true }); closeAllOverlays(); };
ACT['nreadall'] = () => { DB.q('notifications').filter(n => n.user === SESS.uid).forEach(n => DB.set('notifications', n.id, { read: true }, { quiet: true })); render(); };
PAGES.notifications = () => { setTimeout(() => ACT.bell(), 10); return pageHead({ title: 'Notifications' }) + card('', '<p class="muted">Opening your notifications…</p>'); };
ACT['more'] = () => openModal({ title: 'Menu', body: `<div class="stack" style="gap:8px">${NAV.filter(n => n.k && allowed(n.k)).map(n => `<a class="tilebtn" href="#/${n.k}" data-act="ov.close">${icon(n.ic)}<span>${n.l}</span></a>`).join('')}<a class="tilebtn" href="#/profile" data-act="ov.close">${icon('user')}<span>Profile</span></a></div>`, live: false });
