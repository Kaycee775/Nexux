function dashMe() {
  const u = me(); const t = today(); const mine = DB.q('tasks').filter(x => x.assignee === u.id && x.status !== 'done'); const over = mine.filter(x => x.due && x.due < t), todayT = mine.filter(x => x.due === t);
  const e = empOf(u.id); const m = monthKey(t); const ks = kpisFor(u); const nextSess = DB.q('sessions').filter(s => s.date >= t && (s.invitees || []).includes(u.id)).sort(by(s => s.date))[0];
  const appr = DB.q('approvals').filter(canDecide); const myTg = DB.q('targets').find(x => x.userId === u.id && x.month === m); const mySales = Stat.sales(m).filter(s => s.officer === u.id);
  return `<div class="grid gx3">${clockCard()}${tile({ cls: 'tea', ic: 'clipboard', title: 'My tasks', value: mine.length, unit: 'open', caps: { v: DB.q('tasks').filter(x => x.assignee === u.id && x.status === 'done').length, max: DB.q('tasks').filter(x => x.assignee === u.id).length || 1 }, sub: over.length + ' overdue · ' + todayT.length + ' due today', href: '#/mywork' })}<div class="cta">${leafBg}<h3>${appr.length ? 'You have <span class="lw">' + appr.length + ' approvals</span> waiting' : 'Nothing is <span class="lw">waiting on you</span>'}</h3><a class="btn" href="#/approvals">Open approvals ${icon('chevr', 'sm')}</a></div></div>
  <div class="grid g2" style="margin-top:16px">${card('My targets this month', myTg ? `<div class="stack" style="gap:12px"><div><div class="row small"><span>Sales closed</span><span class="sp"></span><b>${mySales.length} / ${myTg.count}</b></div>${progress(mySales.length, myTg.count)}</div><div><div class="row small"><span>Sales value</span><span class="sp"></span><b>${moneyShort(sum(mySales, s => s.total))} / ${moneyShort(myTg.value)}</b></div>${progress(sum(mySales, s => s.total), myTg.value)}</div></div>` : (ks.length ? `<div class="stack" style="gap:12px">${ks.slice(0, 4).map(k => { const a = kpiActual(k, u.id, m); const s = kpiStatus(k, a); return `<div><div class="row small"><span>${esc(k.name)}</span><span class="sp"></span><span class="sig ${s.s === 'mute' ? '' : s.s}"></span><b>${a == null ? '—' : (k.unit === '₦' ? moneyShort(a) : Math.round(a * 10) / 10 + (k.unit === '%' ? '%' : ''))} / ${k.unit === '₦' ? moneyShort(k.target) : k.target}</b></div>${progress(a || 0, k.target, s.s === 'a')}</div>`; }).join('')}</div>` : emptyState('No targets are set for your role yet.', 'target')), { ic: 'target', acts: '<a class="btn sm" href="#/performance">Scorecard</a>' })}
  ${card('Due soon', mine.length ? `<div class="stack" style="gap:8px">${mine.sort(by(x => x.due || '9')).slice(0, 5).map(x => `<a class="tilebtn" href="#/work/tasks?t=${x.id}">${icon(x.due && x.due < t ? 'warn' : 'clipboard')}<span class="grow">${esc(x.title)}<br><span class="small muted">${x.due ? (x.due < t ? 'Overdue · ' : '') + fmtDate(x.due) : 'No date'}</span></span>${spill(x.priority)}</a>`).join('')}</div>` : emptyState('You are clear. Nice.', 'check'), { ic: 'clipboard', acts: '<a class="btn sm" href="#/mywork">My work</a>' })}
  ${card('Leave balance', e ? `<div class="stat"><b>${e.leaveAllow - (e.leaveTaken || 0)} days</b><span>of ${e.leaveAllow} annual days remaining</span></div><div style="margin-top:12px"><button class="btn sm" data-act="leave.new">${icon('calendar', 'sm')} Request leave</button></div>` : '<p class="muted">No employee record.</p>', { ic: 'calendar' })}
  ${card('Learning', nextSess ? `<div class="stat"><b>${esc(nextSess.title)}</b><span>${fmtDate(nextSess.date)} · ${esc(nextSess.time || '')} · ${esc(nextSess.venue || '')}</span></div><div style="margin-top:12px"><a class="btn sm" href="#/learning">My learning</a></div>` : '<p class="muted">No upcoming sessions.</p>', { ic: 'cap' })}</div>`;
}

/* ---------- My work ---------- */
PAGES.mywork = (parts) => {
  const u = me(); const t = today(); const mine = DB.q('tasks').filter(x => x.assignee === u.id && x.status !== 'done');
  const over = mine.filter(x => x.due && x.due < t), todayT = mine.filter(x => x.due === t), later = mine.filter(x => !x.due || x.due > t);
  const follow = DB.q('tasks').filter(x => (x.followers || []).includes(u.id) && x.assignee !== u.id && x.status !== 'done');
  const appr = DB.q('approvals').filter(canDecide); const pend = can('fin.confirm') || can('fin.confirm2') ? Stat.pendingPay().filter(p => p.recordedBy !== u.id && !(p.confirmations || []).some(c => c.by === u.id)) : [];
  const todos = u.todos || [];
  const trow = x => `<a class="tilebtn" href="#/work/tasks?t=${x.id}" style="margin-bottom:8px">${icon(x.due && x.due < t ? 'warn' : 'clipboard')}<span class="grow">${esc(x.title)}<br><span class="small muted">${esc(DB.get('projects', x.project)?.name || 'No project')} · ${x.due ? fmtDate(x.due) : 'No date'}</span></span>${spill(x.priority)}</a>`;
  return pageHead({ title: `My work${pi('check', true)}today`, sub: `${over.length} overdue · ${todayT.length} due today · ${appr.length + pend.length} approvals`, acts: `<button class="btn primary" data-act="task.new">${icon('plus', 'sm')} New task</button>` }) +
    `<div class="grid g2" style="align-items:start"><div class="stack">${card('Overdue', over.length ? over.map(trow).join('') : '<p class="muted">Nothing overdue.</p>', { ic: 'warn' })}${card('Due today', todayT.length ? todayT.map(trow).join('') : '<p class="muted">Nothing due today.</p>', { ic: 'calendar' })}${card('Later', later.length ? later.slice(0, 8).map(trow).join('') : '<p class="muted">No other open tasks.</p>', { ic: 'clipboard' })}</div>
    <div class="stack">${card('Approvals waiting for me', appr.length || pend.length ? `<div class="stack" style="gap:8px">${appr.map(a => `<a class="tilebtn" href="#/approvals">${icon('shield')}<span class="grow">${esc(a.title)}<br><span class="small muted">${esc(APPROVAL_LABEL[a.type] || a.type)} · from ${esc(userName(a.requester))}</span></span>${a.amount ? `<b>${moneyShort(a.amount)}</b>` : ''}</a>`).join('')}${pend.length ? `<a class="tilebtn" href="#/finance/confirm">${icon('coins')}<span class="grow">${pend.length} payment${pend.length > 1 ? 's' : ''} to confirm<br><span class="small muted">${moneyShort(sum(pend, p => p.amount))}</span></span></a>` : ''}</div>` : '<p class="muted">No approvals waiting.</p>', { ic: 'shield' })}
    ${card('Tasks I follow', follow.length ? follow.map(trow).join('') : '<p class="muted">You are not following any open tasks.</p>', { ic: 'eye' })}
    ${card('Personal to-dos', `<div class="stack" style="gap:6px">${todos.map((x, i) => `<label class="row" style="gap:10px;cursor:pointer"><input type="checkbox" data-act="todo.toggle" data-i="${i}" ${x.done ? 'checked' : ''}><span class="grow" style="${x.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(x.t)}</span><button class="btn sm ghost" data-act="todo.del" data-i="${i}" aria-label="Delete">${icon('x', 'sm')}</button></label>`).join('') || '<p class="muted">Private to you. Add a reminder.</p>'}</div><form class="row" style="margin-top:10px" data-submit="todo.add"><label class="chip grow"><input name="t" placeholder="Add a to-do and press Enter" aria-label="New to-do"></label></form>`, { ic: 'list' })}</div></div>`;
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (f) { e.preventDefault(); const a = ACT[f.dataset.submit]; if (a) a(f, e); } });
ACT['todo.add'] = f => { const t = f.t.value.trim(); if (!t) return; const u = me(); DB.set('users', u.id, { todos: (u.todos || []).concat([{ t, done: false }]) }, { quiet: true }); render(); };
ACT['todo.toggle'] = el => { const u = me(); const l = (u.todos || []).slice(); l[+el.dataset.i].done = el.checked; DB.set('users', u.id, { todos: l }, { quiet: true }); render(); };
ACT['todo.del'] = el => { const u = me(); const l = (u.todos || []).slice(); l.splice(+el.dataset.i, 1); DB.set('users', u.id, { todos: l }, { quiet: true }); render(); };

/* ---------- approvals inbox ---------- */
function chainView(a) { return `<div class="row wrap" style="gap:6px">${a.steps.map((s, i) => `<span class="pill ${s.status === 'approved' ? 'ok' : s.status === 'rejected' ? 'bad' : i === a.cur && a.status === 'pending' ? 'warn' : 'mute'}" title="${s.by ? esc(userName(s.by)) : ''}">${esc(STEP_LABEL[s.key] || s.key)}</span>`).join('<span class="muted">›</span>')}</div>`; }
PAGES.approvals = (parts) => {
  const cur = parts[0] || 'waiting'; const all = DB.q('approvals').sort(by(a => a.ts, -1));
  const list = cur === 'waiting' ? all.filter(canDecide) : cur === 'mine' ? all.filter(a => a.requester === SESS.uid) : all;
  const tb = [{ k: 'waiting', l: 'Waiting for me', n: all.filter(canDecide).length || '' }, { k: 'mine', l: 'My requests' }].concat(can('read.all') || can('audit.view') ? [{ k: 'all', l: 'All approvals' }] : []);
  return pageHead({ title: `Approvals${pi('shield', true)}inbox`, sub: 'Multi-step chains by document type and amount. Whoever raises a request can never approve it.' }) + tabs('approvals', tb, cur) +
    table({ id: 'appr-' + cur, title: 'Approvals', empty: cur === 'waiting' ? 'Nothing is waiting on you.' : 'No approvals.', rows: () => list, sort: { k: 'ts', dir: -1 }, onRow: a => openApproval(a.id), filters: [{ k: 'type', l: 'Type', o: Object.entries(APPROVAL_LABEL), get: a => a.type }, { k: 'status', l: 'Status', o: ['pending', 'approved', 'rejected'], get: a => a.status }], cols: [{ k: 'title', l: 'Request', r: a => `<div class="cellmain"><b>${esc(a.title)}</b><span>${esc(APPROVAL_LABEL[a.type] || a.type)} · ${esc(userName(a.requester))}</span></div>` }, { k: 'amount', l: 'Amount', num: true, r: a => a.amount ? money(a.amount) : '—' }, { k: 'chain', l: 'Chain', r: chainView, x: a => a.steps.map(s => s.key + ':' + s.status).join(' › ') }, { k: 'status', l: 'Status', r: a => spill(a.status) }, { k: 'ts', l: 'Raised', sv: a => a.ts, r: a => ago(a.ts) }] });
};
function openApproval(id) {
  openDrawer(() => { const a = DB.get('approvals', id); if (!a) return null; const can1 = canDecide(a);
    const s = a.steps[a.cur];
    return { title: esc(a.title), body: `<div class="row" style="margin-bottom:12px">${spill(a.status)} <span class="tag">${esc(APPROVAL_LABEL[a.type] || a.type)}</span></div>${kv([['Requested by', esc(userName(a.requester))], ['Amount', a.amount ? money(a.amount) : '—'], ['Raised', fmtDT(a.ts)], ['Chain', chainView(a)], ['Waiting on', a.status === 'pending' ? esc(stepActors(a).map(userName).join(', ') || 'No eligible approver. Ask an administrator.') : '—']])}${approvalDetail(a)}<div class="sec"><h4>Decisions</h4><div class="tl">${a.steps.filter(x => x.status !== 'pending').map(x => `<div class="it"><b style="font-weight:500">${esc(STEP_LABEL[x.key] || x.key)}</b> ${x.status} by ${esc(userName(x.by))}<br><span class="small muted">${fmtDT(x.at)}${x.note ? ' · ' + esc(x.note) : ''}</span></div>`).join('') || '<span class="muted">No decisions yet.</span>'}</div></div>${a.requester === SESS.uid && a.status === 'pending' ? '<div class="alert info" style="margin-top:16px">You raised this request, so someone else must approve it.</div>' : ''}`, foot: can1 ? `<button class="btn danger" data-act="appr.reject" data-id="${id}">Reject</button><button class="btn primary" data-act="appr.approve" data-id="${id}">Approve</button>` : `<button class="btn" data-act="ov.close">Close</button>` };
  }, { wide: false });
}
function approvalDetail(a) {
  let rows = [];
  if (a.type === 'expense') { const e = DB.get('expenses', a.ref); if (e) rows = [['Expense', esc(e.no + ' · ' + e.desc)], ['Category', esc(e.category)], ['Department', esc(e.dept)]]; }
  if (a.type === 'journal') { const j = DB.get('journals', a.ref); if (j) return `<div class="sec"><h4>Journal ${esc(j.no)}</h4>${journalTable(j)}</div>`; }
  if (a.type === 'commission') { const c = DB.get('commissions', a.ref); if (c) rows = [['Payee', esc(commissionPayee(c))], ['Sale', esc(DB.get('sales', c.saleId)?.no || '')], ['Basis', money(c.base) + ' at ' + c.rate + '%']]; }
  if (a.type === 'leave') { const l = DB.get('leaves', a.ref); if (l) rows = [['Type', esc(l.type)], ['Dates', fmtDate(l.from) + ' – ' + fmtDate(l.to) + ' (' + l.days + ' days)'], ['Reason', esc(l.reason || '—')]]; }
  if (['transfer', 'restructure', 'revocation'].includes(a.type)) { const s = DB.get('sales', a.ref); if (s) rows = [['Sale', esc(s.no)], ['Client', esc(DB.get('clients', s.clientId)?.name)], ['Plots', esc(s.plotIds.map(i => plotLabel(DB.get('plots', i))).join('; '))], ['Paid / total', money(s.paid) + ' / ' + money(s.total)], ['Reason', esc(a.meta.reason || '—')], a.meta.refund ? ['Refund', money(a.meta.refund)] : null, a.meta.toClient ? ['Transfer to', esc(DB.get('clients', a.meta.toClient)?.name)] : null]; }
  if (a.type === 'reopen') rows = [['Period', monthLabel(a.ref)], ['Reason', esc(a.meta.reason || '')]];
  return rows.length ? `<div class="sec"><h4>Details</h4>${kv(rows)}</div>` : '';
}
ACT['appr.approve'] = el => askText('Approve', 'Note (optional)', n => { try { decide(el.dataset.id, 'approved', n); toast('Approved'); render(); } catch (e) { toast(e.message, 'bad'); } }, { req: false, submit: 'Approve' });
ACT['appr.reject'] = el => askText('Reject request', 'Reason (the requester will see this)', n => { try { decide(el.dataset.id, 'rejected', n); toast('Rejected'); render(); } catch (e) { toast(e.message, 'bad'); } }, { submit: 'Reject' });

</script>
<script>
'use strict';
/* Property inventory and allocation (M-INV) */

const INV_TABS = [{ k: 'estates', l: 'Estates' }, { k: 'plots', l: 'All plots' }, { k: 'titles', l: 'Title documents' }, { k: 'inspections', l: 'Site inspections' }];
const docLabel = (e, k) => k === 'survey' ? 'Survey plan' : k === 'deed' ? 'Deed of assignment' : (e && e.titleType === "Governor's Consent" ? "Governor's Consent" : 'C of O');
const soldStatuses = ['allocated', 'paid', 'documented'];

PAGES.inventory = (parts, q) => {
  const tab = parts[0] || 'estates'; const w = modAccess('inventory') === 'write' && can('inv.write');
  if (tab === 'estate') return invEstate(parts[1]);
  const pc = Stat.plots(); const total = DB.q('plots').length;
  const acts = w ? `<button class="btn primary" data-act="est.new">${icon('plus', 'sm')} Add estate</button>` : '';
  let body = '';
  if (tab === 'estates') body = invEstates(); else if (tab === 'plots') body = invPlots(); else if (tab === 'titles') body = invTitles(); else if (tab === 'inspections') body = invInspections();
  openFromQuery('p', id => openPlot(id));
  return pageHead({ title: `Property${pi('estate', true)}inventory`, sub: `${total} plots across ${DB.q('estates').length} estates · ${pc.available} available · ${pc.reserved} reserved`, acts }) + tabs('inventory', INV_TABS, tab) + body;
};

function estateStats(e) {
  const ps = DB.q('plots').filter(p => p.estate === e.id); const c = {}; PLOT_STATUSES.forEach(s => c[s] = ps.filter(p => p.status === s).length);
  return { ps, c, total: ps.length, sold: c.allocated + c.paid + c.documented, avail: c.available, value: sum(ps.filter(p => p.status === 'available'), p => p.price) };
}
function invEstates() {
  return `<div class="grid g3">${DB.q('estates').map((e, i) => { const s = estateStats(e); return `<a class="tile ${i % 4 === 1 ? 'tea' : i % 4 === 3 ? 'dark' : ''}" href="#/inventory/estate/${e.id}" ><div class="th"><span class="ci">${icon('estate')}</span><span>${esc(e.name)}</span><span class="pc">${pct(s.sold, s.total)}% sold</span></div><div class="big">${s.avail}<small>of ${s.total} plots available</small></div><div class="caps">${Array.from({ length: 8 }, (_, k) => `<i class="${k < Math.round(s.sold / (s.total || 1) * 8) ? '' : 'off'}"></i>`).join('')}</div><div class="small muted" style="margin-top:10px">${esc(e.location)} · ${esc(e.titleType)} · ${moneyShort(s.value)} unsold</div></a>`; }).join('')}</div>`;
}
function invEstate(id) {
  const e = DB.get('estates', id); if (!e) return card('Estate not found', '<a class="btn" href="#/inventory/estates">Back</a>');
  const s = estateStats(e); const fs = UI.plotFilter || ''; const fb = UI.blockFilter || '';
  const ps = s.ps.filter(p => (!fs || p.status === fs) && (!fb || p.block === fb)).sort(by(p => +p.no));
  const w = can('inv.write');
  return pageHead({ title: `${esc(e.name)}`, sub: `${esc(e.location)} · ${esc(e.titleType)}`, acts: `<a class="btn" href="#/inventory/estates">${icon('chevl', 'sm')} All estates</a>${w ? `<button class="btn" data-act="est.edit" data-id="${e.id}">${icon('edit', 'sm')} Edit</button>` : ''}` }) +
    `<div class="grid g4" style="margin-bottom:16px">${tile({ ic: 'estate', title: 'Plots', value: s.total, caps: { v: s.sold, max: s.total || 1 }, sub: s.sold + ' sold' })}${tile({ cls: 'tea', ic: 'check', title: 'Available', value: s.avail, sub: moneyShort(s.value) + ' unsold value' })}${tile({ ic: 'clock', title: 'Reserved', value: s.c.reserved, sub: 'Auto-release in ' + DB.setting('reservationDays') + ' days without deposit' })}${tile({ cls: 'dark', ic: 'shield', title: 'Fully paid or documented', value: s.c.paid + s.c.documented, sub: s.c.documented + ' documented' })}</div>
    <div class="grid g21" style="align-items:start">${card('Plot map', `<div class="row wrap" style="margin-bottom:12px"><div class="leg">${PLOT_STATUSES.map(st => `<a href="#" data-act="plot.filter" data-s="${fs === st ? '' : st}" style="color:var(--ink);${fs === st ? 'font-weight:500;text-decoration:underline' : ''}"><i class="plot ${st}" style="padding:0"></i>${PLOT_LABEL[st]} (${s.c[st]})</a>`).join('')}</div><span class="sp"></span>${e.blocks.length > 1 ? `<label class="chip"><select data-on="plot.block" aria-label="Block">${opts(e.blocks, fb, 'All blocks')}</select></label>` : ''}</div><div class="plotgrid">${ps.map(p => `<button class="plot ${p.status}" data-act="plot.open" data-id="${p.id}" title="${esc(plotLabel(p))} · ${PLOT_LABEL[p.status]} · ${money(p.price)}"><b>${p.block}${p.no}</b><small>${p.sqm} sqm</small></button>`).join('') || emptyState('No plots match.')}</div>`, { ic: 'grid' })}
    <div class="stack">${card('Prices', `<table class="tbl"><thead><tr><th>Size</th><th class="num">Price</th></tr></thead><tbody>${e.sizes.map(z => `<tr><td>${z.sqm} sqm</td><td class="num">${money(z.price)}</td></tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:8px">Old sales keep the price they were sold at.</p>`, { ic: 'tag', acts: w ? `<button class="btn sm" data-act="est.prices" data-id="${e.id}">Sync from Tri-Pay</button>` : '' })}
    ${card('Payment plans', `<div class="stack" style="gap:8px">${e.plans.map(p => `<div class="row"><b style="font-weight:500">${esc(p.name)}</b><span class="sp"></span><span class="small muted">${p.months ? p.depositPct + '% deposit · +' + p.uplift + '%' : 'Pay in full'}</span></div>`).join('')}</div><p class="small muted" style="margin-top:8px">Set up in Tri-Pay and synced to Tri-OP. Each estate has its own plans.</p>`, { ic: 'receipt' })}
    ${card('Survey plan and layout', e.layout ? `<img src="${e.layout}" alt="Survey plan" style="width:100%;border-radius:14px;border:1px solid var(--line)"><p class="small muted" style="margin-top:8px">Interactive layout mapping arrives in Phase 3. The colour grid shows live status today.</p>` : '<p class="muted">No survey plan uploaded.</p>', { ic: 'image', acts: w ? `<button class="btn sm" data-act="est.layout" data-id="${e.id}">Upload</button>` : '' })}</div></div>`;
}
ACT['plot.filter'] = el => { UI.plotFilter = el.dataset.s; render(); };
ACT['plot.block'] = el => { UI.blockFilter = el.value; render(); };
ACT['est.new'] = () => openForm({ title: 'Add estate', draft: 'est-new', fields: [{ n: 'name', l: 'Estate name', req: true }, { n: 'location', l: 'Location', req: true }, { n: 'titleType', l: 'Title type', t: 'select', req: true, o: ['C of O', "Governor's Consent", 'Deed of Assignment'] }, { n: 'n', l: 'Number of plots', t: 'number', req: true, min: 1, max: 200, v: 20 }, { n: 's1', l: 'Plot size 1 (sqm)', t: 'number', half: true, req: true, v: 450 }, { n: 'p1', l: 'Price 1 (₦)', t: 'money', half: true, req: true }, { n: 's2', l: 'Plot size 2 (sqm)', t: 'number', half: true, v: 600 }, { n: 'p2', l: 'Price 2 (₦)', t: 'money', half: true }], onSubmit: v => {
  const sizes = [{ sqm: v.s1, price: v.p1 }].concat(v.s2 && v.p2 ? [{ sqm: v.s2, price: v.p2 }] : []);
  const e = DB.add('estates', { name: v.name, location: v.location, titleType: v.titleType, sizes, plans: [{ id: 'pl_out', name: 'Outright', months: 0, depositPct: 100, uplift: 0 }, { id: 'pl_3', name: '3 months', months: 3, depositPct: 50, uplift: 3 }, { id: 'pl_6', name: '6 months', months: 6, depositPct: 40, uplift: 6 }, { id: 'pl_12', name: '12 months', months: 12, depositPct: 30, uplift: 10 }], blocks: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'].slice(0, Math.ceil(v.n / 8)), status: 'Selling' });
  for (let i = 1; i <= v.n; i++) { const z = sizes[(i - 1) % sizes.length]; DB.add('plots', { estate: e.id, block: e.blocks[Math.floor((i - 1) / 8)], no: String(i), sqm: z.sqm, price: z.price, status: 'available', survey: '', log: [], docs: null }, { quiet: true }); }
  tripaySend('estate.created', { estate: e.name, plots: v.n }); toast('Estate created with ' + v.n + ' plots'); go('inventory/estate/' + e.id);
} });
ACT['est.edit'] = el => { const e = DB.get('estates', el.dataset.id); openForm({ title: 'Edit estate', vals: e, fields: [{ n: 'name', l: 'Estate name', req: true }, { n: 'location', l: 'Location', req: true }, { n: 'titleType', l: 'Title type', t: 'select', o: ['C of O', "Governor's Consent", 'Deed of Assignment'] }, { n: 'status', l: 'Status', t: 'select', o: ['Selling', 'Sold out', 'Coming soon', 'Closed'] }], onSubmit: v => { DB.set('estates', e.id, v); render(); } }); };

ACT['insp.new'] = () => openForm({ title: 'Book site inspection', fields: [{ n: 'who', l: 'Lead or client', t: 'select', req: true, o: DB.q('leads').filter(l => !['Won', 'Lost'].includes(l.stage)).map(l => ['l:' + l.id, 'Lead · ' + l.name]).concat(DB.q('clients').map(c => ['c:' + c.id, 'Client · ' + c.name])) }, { n: 'estateId', l: 'Estate', t: 'select', req: true, o: DB.q('estates').map(e => [e.id, e.name]) }, { n: 'date', l: 'Date', t: 'date', req: true, half: true, min: today() }, { n: 'time', l: 'Time', t: 'time', req: true, half: true, v: '10:00' }, { n: 'officer', l: 'Assigned officer', t: 'select', req: true, o: coUsers().filter(u => ['Sales', 'Operations'].includes(u.dept)).map(u => [u.id, u.name]), v: SESS.uid }], onSubmit: v => { const [k, id] = v.who.split(':'); const rec = DB.get(k === 'l' ? 'leads' : 'clients', id); const i = DB.add('inspections', { leadId: k === 'l' ? id : '', clientId: k === 'c' ? id : '', clientName: rec.name, estateId: v.estateId, date: v.date, time: v.time, officer: v.officer, outcome: '', status: 'Scheduled' }); if (k === 'l' && ['New', 'Contacted'].includes(rec.stage)) DB.set('leads', id, { stage: 'Inspection', lastTouch: Date.now() }); notify(v.officer, 'Site inspection booked: ' + rec.name, fmtDate(v.date) + ' ' + v.time, '#/inventory/inspections'); toast('Inspection booked'); render(); } });

<script>
'use strict';
/* Sales and CRM (M-CRM) */

const lk = (k, d) => { const l = DB.q('lookups').find(x => x.key === k); return l ? l.values : d; };
const LEAD_STAGES = () => lk('leadStages', ['New', 'Contacted', 'Inspection', 'Negotiation', 'Reserved', 'Won', 'Lost']);
const LEAD_SOURCES = () => lk('leadSources', ['Website form', 'Instagram', 'Facebook', 'Walk-in', 'Referral', 'Radio', 'Realtor (Tri-Pay)', 'CSV import', 'Other']);
const CRM_TABS = [{ k: 'pipeline', l: 'Pipeline' }, { k: 'leads', l: 'Leads' }, { k: 'clients', l: 'Clients' }, { k: 'sales', l: 'Sales' }, { k: 'calls', l: 'Call list' }, { k: 'targets', l: 'Targets' }];
const crmW = () => can('crm.write') && modAccess('crm') === 'write';

PAGES.crm = (parts, q) => {
  const tab = parts[0] || 'pipeline'; if (tab === 'client') return clientPage(parts[1]);
  const acts = crmW() ? `<button class="btn" data-act="lead.import">${icon('upload', 'sm')} Import CSV</button><button class="btn primary" data-act="lead.new">${icon('plus', 'sm')} New lead</button>` : '';
  const stages = LEAD_STAGES(); const open = DB.q('leads').filter(l => !['Won', 'Lost'].includes(l.stage));
  let body = ''; if (tab === 'pipeline') body = crmBoard(); else if (tab === 'leads') body = crmLeads(); else if (tab === 'clients') body = crmClients(); else if (tab === 'sales') body = crmSales(); else if (tab === 'calls') body = crmCalls(); else if (tab === 'targets') body = crmTargets();
  openFromQuery('l', id => openLead(id)); openFromQuery('s', id => openSale(id));
  return pageHead({ title: `Sales${pi('users', true)}and CRM`, sub: `${open.length} open leads · ${DB.q('clients').length} clients · ${DB.q('sales').filter(s => ['active', 'pending'].includes(s.status)).length} active sales`, acts }) + tabs('crm', CRM_TABS, tab) + body;
};

/* ----- leads ----- */
const leadRow = l => ({ ...l, estName: estateOf(l.estateId)?.name || '', officerName: userName(l.officer) });
function crmBoard() {
  const stages = LEAD_STAGES(); const ls = DB.q('leads');
  return `<div class="row" style="margin-bottom:12px"><label class="chip">${icon('user', 'sm')}<select data-on="crm.officer" aria-label="Officer">${opts(salesOfficers().map(u => [u.id, u.name]), UI.crmOfficer || '', 'All officers')}</select></label><span class="sp"></span><span class="small muted">Drag cards between stages. Losing a lead needs a reason.</span></div><div class="board">${stages.map(st => { const items = ls.filter(l => l.stage === st && (!UI.crmOfficer || l.officer === UI.crmOfficer)).sort(by(l => l.lastTouch || 0, -1)); return `<div class="col" data-stage="${esc(st)}"><div class="chd"><b style="font-weight:500">${esc(st)}</b><span class="n">${items.length}</span></div>${items.map(l => `<div class="kc" draggable="${crmW()}" data-lead="${l.id}" data-act="lead.open" data-id="${l.id}"><b>${esc(l.name)}</b><span class="small muted">${esc(estateOf(l.estateId)?.name || 'No estate yet')} · ${l.budget ? moneyShort(l.budget) : '—'}</span><div class="meta">${avatar(userName(l.officer), 'sm')}<span>${esc(l.source)}</span>${l.nextFollow && l.nextFollow <= today() && !['Won', 'Lost'].includes(st) ? '<span class="pill warn nodot">Follow up</span>' : ''}</div></div>`).join('') || '<div class="small muted" style="padding:8px">No leads</div>'}</div>`; }).join('')}</div>`;
}
ACT['crm.officer'] = el => { UI.crmOfficer = el.value; render(); };
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.kc[data-lead]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.lead); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const c = e.target.closest?.('.col[data-stage]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('.col[data-stage]')?.classList.remove('over'); });
document.addEventListener('drop', e => { const c = e.target.closest?.('.col[data-stage]'); if (!c) return; e.preventDefault(); c.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) moveLead(id, c.dataset.stage); });
function moveLead(id, stage) {
  const l = DB.get('leads', id); if (!l || l.stage === stage) return; if (!crmW()) return toast('You can view the pipeline but not change it.', 'warn');
  if (stage === 'Lost') return askText('Why was this lead lost?', 'Reason', n => { DB.set('leads', id, { stage, lostReason: n, lastTouch: Date.now() }, { action: 'stage' }); render(); }, { submit: 'Mark lost' });
  if (['Reserved', 'Won'].includes(stage)) { const s = DB.q('sales').find(x => x.leadId === id && !['revoked', 'expired'].includes(x.status)); if (!s) return saleForm({ leadId: id, stage }); }
  DB.set('leads', id, { stage, lastTouch: Date.now() }, { action: 'stage' }); render();
}
function crmLeads() {
  const rows = () => DB.q('leads').map(leadRow);
  return `<div class="row wrap" style="margin-bottom:12px"><div class="alert info grow">${icon('link', 'sm')}<span>Website lead form: <a href="#/f/lead?src=Website" target="_blank" rel="noopener">${esc(location.href.split('#')[0])}#/f/lead?src=Website</a> · Duplicates are matched by phone and email.</span></div>${crmW() ? `<button class="btn" data-act="lead.tripay">Simulate realtor submission (Tri-Pay)</button>` : ''}</div>` + table({ id: 'leads', title: 'Leads', rows, ph: 'Search leads', sort: { k: 'created', dir: -1 }, onRow: l => openLead(l.id), filters: [{ k: 'stage', l: 'Stage', o: LEAD_STAGES(), get: l => l.stage }, { k: 'source', l: 'Source', o: LEAD_SOURCES(), get: l => l.source }, { k: 'officer', l: 'Officer', o: salesOfficers().map(u => [u.id, u.name]), get: l => l.officer }], bulk: crmW() ? [{ l: 'Assign to…', f: ids => askOfficer(ids) }, { l: 'Delete', f: ids => confirmDlg('Move ' + ids.length + ' leads to the recycle bin?', () => { ids.forEach(i => DB.del('leads', i)); TBL.leads.sel.clear(); render(); }, { danger: true }) }] : null, cols: [{ k: 'name', l: 'Lead', r: l => `<div class="cellmain"><b>${esc(l.name)}</b><span>${esc(l.phone)}</span></div>` }, { k: 'stage', l: 'Stage', r: l => spill(l.stage, l.stage === 'Won' ? 'ok' : l.stage === 'Lost' ? 'bad' : '') }, { k: 'source', l: 'Source', r: l => esc(l.source) + (l.campaign ? `<div class="small muted">${esc(l.campaign)}</div>` : ''), x: l => l.source }, { k: 'estName', l: 'Interest' }, { k: 'budget', l: 'Budget', num: true, r: l => l.budget ? money(l.budget) : '—' }, { k: 'officerName', l: 'Officer' }, { k: 'created', l: 'Added', sv: l => l.created, r: l => ago(l.created), x: l => fmtDate(isoDate(l.created)) }] });
}
function askOfficer(ids) { openForm({ title: 'Assign ' + ids.length + ' leads', fields: [{ n: 'o', l: 'Officer', t: 'select', req: true, o: salesOfficers().map(u => [u.id, u.name]) }], submit: 'Assign', onSubmit: v => { ids.forEach(i => DB.set('leads', i, { officer: v.o }, { action: 'assign' })); notify(v.o, ids.length + ' leads assigned to you', '', '#/crm/leads'); TBL.leads.sel.clear(); render(); } }); }
function assignOfficer(l) {
  const rule = DB.setting('assignRule') || 'round-robin'; const off = salesOfficers(); if (!off.length) return SESS.uid;
  if (rule === 'realtor' && l.realtorId) { const s = DB.q('sales').filter(x => x.realtorId === l.realtorId).sort(by(x => x.created, -1))[0]; if (s && off.find(o => o.id === s.officer)) return s.officer; }
  if (rule === 'estate' && l.estateId) { const m = DB.q('leads').filter(x => x.estateId === l.estateId).map(x => x.officer); const c = off.map(o => [o.id, m.filter(x => x === o.id).length]).sort(by(x => x[1], -1))[0]; if (c && c[1]) return c[0]; }
  const n = DB.seq('rr'); return off[(n - 1) % off.length].id;

    { n: 'sum', t: 'html', html: v => { const e = DB.get('estates', v.estateId); const plan = e?.plans.find(p => p.id === v.planId); const ps = (v.plotIds || []).map(i => DB.get('plots', i)).filter(Boolean); if (!plan || !ps.length) return '<div class="alert info">Choose plots and a plan to preview the schedule.</div>'; const total = Math.round(sum(ps, p => p.price) * (1 + plan.uplift / 100)); const sch = buildSchedule(total, plan, today()); return `<div class="alert ok"><span><b>${money(total)}</b> total · deposit <b>${money(sch[0].amount)}</b> · ${plan.months ? plan.months + ' instalments of about ' + money(sch[1].amount) : 'paid in full'}. The reservation holds for ${DB.setting('reservationDays')} days until the deposit is confirmed.</span></div>`; } },
    { n: 'realtorId', l: 'Realtor (if any)', t: 'select', o: inducted.map(r => [r.id, r.name + ' · ' + r.level]), blank: 'No realtor' },
    { n: 'officer', l: 'Sales officer', t: 'select', o: salesOfficers().map(u => [u.id, u.name]), blank: false }
  ];
  const vals = { cname: lead?.name || '', clientId: clientId || '', estateId: plot0?.estate || lead?.estateId || '', plotIds: plotId ? [plotId] : [], realtorId: lead?.realtorId || '', officer: lead?.officer || (salesOfficers().find(u => u.id === SESS.uid) ? SESS.uid : salesOfficers()[0]?.id) };
  openForm({ title: 'Create sale', wide: true, fields, vals, submit: 'Create sale and reserve', onSubmit: v => {
    try {
      let cid = v.clientId; if (lead) { const ex = DB.q('clients').find(c => phoneNorm(c.phone) === phoneNorm(lead.phone)); cid = ex ? ex.id : DB.add('clients', { name: lead.name, phone: lead.phone, email: lead.email || '', address: '', kyc: [{ name: 'ID card', ok: false }, { name: 'Proof of address', ok: false }, { name: 'Passport photo', ok: false }], officer: lead.officer, source: lead.source, created: Date.now(), leadId: lead.id }).id; }
      const sale = createSale({ clientId: cid, plotIds: v.plotIds, planId: v.planId, officer: v.officer, realtorId: v.realtorId, leadId: leadId || '', estateId: v.estateId });
      if (lead) DB.set('leads', lead.id, { stage: 'Reserved', lastTouch: Date.now() }, { action: 'convert' });
      issueDoc('offer', { sale: DB.get('sales', sale.id) }); toast('Sale ' + sale.no + ' created. Plan published to Tri-Pay.'); setTimeout(() => openSale(sale.id), 50); render();
    } catch (e) { toast(e.message, 'bad'); return false; }
  } });
}
ACT['sale.new'] = el => saleForm({ clientId: el?.dataset?.client, plotId: el?.dataset?.plot });
ACT['sale.open'] = el => openSale(el.dataset.id);
function openSale(id) {
  openDrawer(() => {
    const s = DB.get('sales', id); if (!s) return null; const cl = DB.get('clients', s.clientId); const pays = DB.q('payments').filter(p => p.saleId === id).sort(by(p => p.ts, -1)); const docs = DB.q('docsLog').filter(d => d.ref === id || pays.some(p => p.id === d.ref));
    const live = ['pending', 'active', 'completed'].includes(s.status); const w = crmW() || can('inv.write'); const comm = DB.q('commissions').filter(c => c.saleId === id);
    return { title: esc(s.no) + ' · ' + esc(cl?.name || ''), body: `<div class="row wrap" style="margin-bottom:14px">${spill(s.status)}<span class="tag">${esc(s.planName)}</span></div>${kv([['Client', cl ? `<a href="#/crm/client/${cl.id}" data-act="ov.close">${esc(cl.name)}</a>` : '—'], ['Plots', esc(s.plotIds.map(i => plotLabel(DB.get('plots', i))).join('; '))], ['Total', money(s.total)], ['Paid', money(s.paid) + ' · ' + pct(s.paid, s.total) + '%'], ['Balance', money(saleBalance(s))], ['Officer', esc(userName(s.officer))], ['Realtor', esc(DB.get('realtors', s.realtorId)?.name || '—')], ['Sold on', fmtDate(s.date)]])}
    <div class="sec"><h4>Payment schedule</h4><table class="tbl"><thead><tr><th>Item</th><th>Due</th><th class="num">Amount</th><th class="num">Paid</th><th></th></tr></thead><tbody>${s.schedule.map(r => { const od = r.due < today() && r.paid < r.amount - .5 && !['revoked', 'expired'].includes(s.status); return `<tr><td>${esc(r.label)}</td><td>${fmtDate(r.due)}</td><td class="num">${money(r.amount)}</td><td class="num">${money(r.paid)}</td><td>${r.paid >= r.amount - .5 ? spill('Paid', 'ok') : od ? spill('Overdue', 'warn') : spill('Due', 'mute')}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="sec"><h4>Payments</h4>${pays.length ? pays.map(p => `<div class="row" style="padding:5px 0"><span class="grow">${fmtDate(p.date)} · ${esc(p.method)}${p.receiptNo ? ' · ' + esc(p.receiptNo) : ''}</span><b style="font-weight:500">${money(p.amount)}</b>${spill(p.status)}</div>`).join('') : '<span class="muted">No payments yet.</span>'}</div>
    ${comm.length ? `<div class="sec"><h4>Commissions</h4>${comm.map(c => `<div class="row" style="padding:4px 0"><span class="grow">${esc(commissionPayee(c))} · ${esc(c.type)}</span><b style="font-weight:500">${money(c.amount)}</b>${spill(c.status)}</div>`).join('')}</div>` : ''}
    <div class="sec"><h4>Documents</h4><div class="row wrap">${docs.map(d => `<button class="btn sm" data-act="doc.open" data-code="${d.code}">${icon('file', 'sm')} ${esc(d.title)}</button>`).join('') || '<span class="muted">None issued.</span>'}</div></div>
    ${(s.history || []).length ? `<div class="sec"><h4>History</h4><div class="tl">${s.history.map(h => `<div class="it">${esc(h.what)}<br><span class="small muted">${fmtDT(h.ts)}</span></div>`).join('')}</div></div>` : ''}`, foot: live && w ? `<button class="btn" data-act="sale.transfer" data-id="${id}">Transfer</button><button class="btn" data-act="sale.restructure" data-id="${id}">Restructure</button><button class="btn danger" data-act="sale.revoke" data-id="${id}">Revoke</button><button class="btn" data-act="doc.sale" data-id="${id}" data-type="allocation">Allocation letter</button>` + (can('fin.confirm') ? `<button class="btn primary" data-act="pay.new" data-sale="${id}">Record payment</button>` : '') : '<button class="btn" data-act="ov.close">Close</button>' };
  }, { wide: true });
}
const reqOpen = (id, type) => DB.q('approvals').some(a => a.ref === id && a.type === type && a.status === 'pending');
ACT['sale.transfer'] = el => { const s = DB.get('sales', el.dataset.id); if (reqOpen(s.id, 'transfer')) return toast('A transfer request is already waiting for approval.', 'warn'); openForm({ title: 'Request plot transfer', fields: [{ n: 'to', l: 'Transfer to client', t: 'select', req: true, o: DB.q('clients').filter(c => c.id !== s.clientId).map(c => [c.id, c.name + ' · ' + c.phone]) }, { n: 'reason', l: 'Reason', t: 'textarea', req: true }], submit: 'Submit for approval', onSubmit: v => { startApproval({ type: 'transfer', ref: s.id, title: 'Transfer ' + s.no + ' to ' + DB.get('clients', v.to).name, meta: { toClient: v.to, reason: v.reason, link: '#/approvals' } }); toast('Transfer request sent to the Operations Director'); render(); } }); };
ACT['sale.restructure'] = el => { const s = DB.get('sales', el.dataset.id); if (reqOpen(s.id, 'restructure')) return toast('A restructure request is already waiting for approval.', 'warn'); openForm({ title: 'Request plan restructure', fields: [{ n: 'planId', l: 'New plan for the remaining balance', t: 'select', req: true, o: estateOf(s.estateId).plans.filter(p => p.months).map(p => [p.id, p.name]) }, { n: 'reason', l: 'Reason', t: 'textarea', req: true }], submit: 'Submit for approval', onSubmit: v => { startApproval({ type: 'restructure', ref: s.id, title: 'Restructure ' + s.no, meta: { planId: v.planId, reason: v.reason, link: '#/approvals' } }); toast('Restructure request submitted'); render(); } }); };
ACT['sale.revoke'] = el => { const s = DB.get('sales', el.dataset.id); if (reqOpen(s.id, 'revocation')) return toast('A revocation request is already waiting for approval.', 'warn'); openForm({ title: 'Request revocation', fields: [{ n: 'refund', l: 'Refund to client (₦)', t: 'money', min: 0, max: s.paid, v: 0, hint: 'Paid so far: ' + money(s.paid) }, { n: 'reason', l: 'Reason', t: 'textarea', req: true }], submit: 'Submit for approval', onSubmit: v => { startApproval({ type: 'revocation', ref: s.id, title: 'Revoke ' + s.no, amount: v.refund || 0, meta: { refund: v.refund || 0, reason: v.reason, link: '#/approvals' } }); toast('Revocation request submitted. The plot stays as is until approved.'); render(); } }); };

/* ----- call list (CRM-09) & targets (CRM-08) ----- */
function crmCalls() {
  const who = UI.callOfficer || (salesOfficers().find(u => u.id === SESS.uid) ? SESS.uid : salesOfficers()[0]?.id); const t = today();
  const leads = DB.q('leads').filter(l => l.officer === who && !['Won', 'Lost'].includes(l.stage) && (!l.nextFollow || l.nextFollow <= t)).map(l => ({ id: 'l:' + l.id, kind: 'Lead', name: l.name, phone: l.phone, why: 'Follow-up due ' + (l.nextFollow ? fmtDate(l.nextFollow) : 'now') + ' · ' + l.stage, due: l.nextFollow || t }));
  const coll = overdueItems().filter(o => o.sale.officer === who).map(o => ({ id: 's:' + o.id, kind: 'Collection', name: DB.get('clients', o.sale.clientId)?.name, phone: DB.get('clients', o.sale.clientId)?.phone, why: money(o.out) + ' overdue ' + o.days + ' days · ' + o.sale.no, due: o.row.due }));
  const rows = leads.concat(coll).sort(by(r => r.due));
  return `<div class="row" style="margin-bottom:12px"><label class="chip">${icon('user', 'sm')}<select data-on="crm.callwho" aria-label="Officer">${opts(salesOfficers().map(u => [u.id, u.name]), who)}</select></label><span class="sp"></span><span class="small muted">${rows.length} calls to make today</span></div>` + table({ id: 'calls', title: 'Call list', rows: () => rows, export: true, empty: 'No calls due. Nice work.', cols: [{ k: 'name', l: 'Who', r: r => `<div class="cellmain"><b>${esc(r.name)}</b><span>${esc(r.phone)}</span></div>` }, { k: 'kind', l: 'Type', r: r => spill(r.kind, r.kind === 'Collection' ? 'warn' : 'info') }, { k: 'why', l: 'Why' }, { k: 'act', l: '', r: r => `<a class="btn sm" href="tel:${esc(r.phone)}">${icon('phone', 'sm')} Call</a> ${crmW() ? `<button class="btn sm primary" data-act="call.log" data-id="${esc(r.id)}">Log result</button>` : ''}`, x: () => '' }] });
}
ACT['crm.callwho'] = el => { UI.callOfficer = el.value; render(); };
ACT['call.log'] = el => { const [k, ...rest] = el.dataset.id.split(':'); const ref = rest.join(':'); openForm({ title: 'Log call result', fields: [{ n: 'outcome', l: 'Outcome', t: 'select', req: true, o: k === 'l' ? ['Spoke to client', 'No answer', 'Booked inspection', 'Not interested', 'Call back later'] : ['Promise to pay', 'No answer', 'Paid', 'Dispute', 'Requested restructure'], blank: false }, { n: 'note', l: 'Notes', t: 'textarea' }, { n: 'next', l: 'Next follow-up', t: 'date', min: today(), v: addDays(today(), 2) }], onSubmit: v => { if (k === 'l') { DB.add('interactions', { leadId: ref, type: 'Call', note: v.outcome + (v.note ? ' · ' + v.note : ''), ts: Date.now(), by: SESS.uid }, { quiet: true }); DB.set('leads', ref, { lastTouch: Date.now(), nextFollow: v.next, stage: DB.get('leads', ref).stage === 'New' ? 'Contacted' : DB.get('leads', ref).stage }, { quiet: true }); if (v.outcome === 'Not interested') moveLead(ref, 'Lost'); } else { const [sid, rn] = ref.split(':'); DB.add('collections', { key: ref, saleId: sid, ts: Date.now(), by: SESS.uid, note: v.note, outcome: v.outcome }); } toast('Logged'); render(); } }); };
function crmTargets() {
  const m = UI.tgtMonth || monthKey(today()); const offs = salesOfficers(); const mk = Stat.months(6);
  const rows = offs.map(u => { const t = DB.q('targets').find(x => x.userId === u.id && x.month === m); const s = Stat.sales(m).filter(x => x.officer === u.id); return { id: u.id, name: u.name, tc: t?.count || 0, tv: t?.value || 0, ac: s.length, av: sum(s, x => x.total) }; });
  const team = { tc: sum(rows, r => r.tc), tv: sum(rows, r => r.tv), ac: sum(rows, r => r.ac), av: sum(rows, r => r.av) };
  return `<div class="row" style="margin-bottom:12px"><label class="chip"><select data-on="crm.month" aria-label="Month">${opts(mk.map(k => [k, monthLabel(k)]), m)}</select></label><span class="sp"></span>${can('perf.manage') || can('approve.team') ? `<button class="btn" data-act="tgt.set">Set targets</button>` : ''}</div><div class="grid g3" style="margin-bottom:16px">${tile({ ic: 'target', title: 'Team sales value', value: moneyShort(team.av), unit: '/ ' + moneyShort(team.tv), pc: pct(team.av, team.tv), caps: { v: team.av, max: team.tv || 1 } })}${tile({ cls: 'tea', ic: 'receipt', title: 'Team sales count', value: team.ac, unit: '/ ' + team.tc, pc: pct(team.ac, team.tc), caps: { v: team.ac, max: team.tc || 1 } })}${tile({ cls: 'dark', ic: 'trophy', title: 'Top officer', value: esc((rows.slice().sort(by(r => r.av, -1))[0] || {}).name || '—').split(' ')[0], sub: moneyShort((rows.slice().sort(by(r => r.av, -1))[0] || {}).av || 0) })}</div>` + table({ id: 'targets', title: 'Sales targets ' + m, rows: () => rows, export: true, cols: [{ k: 'name', l: 'Officer', r: r => userChip(r.id), x: r => r.name }, { k: 'ac', l: 'Sales (actual / target)', num: true, r: r => `${r.ac} / ${r.tc}<div style="width:110px;margin-left:auto">${progress(r.ac, r.tc)}</div>`, x: r => r.ac + '/' + r.tc }, { k: 'av', l: 'Value (actual / target)', num: true, r: r => `${moneyShort(r.av)} / ${moneyShort(r.tv)}<div style="width:110px;margin-left:auto">${progress(r.av, r.tv, pct(r.av, r.tv) < 60)}</div>`, x: r => r.av + '/' + r.tv }, { k: 'p', l: 'Achieved', num: true, sv: r => pct(r.av, r.tv), r: r => pct(r.av, r.tv) + '%' }] });
}
ACT['crm.month'] = el => { UI.tgtMonth = el.value; render(); };
ACT['tgt.set'] = () => { const m = UI.tgtMonth || monthKey(today()); const offs = salesOfficers(); openForm({ title: 'Sales targets · ' + monthLabel(m), fields: offs.flatMap(u => [{ n: 'c_' + u.id, l: u.name + ' · sales', t: 'number', half: true, min: 0 }, { n: 'v_' + u.id, l: 'Value (₦)', t: 'money', half: true, min: 0 }]), vals: Object.fromEntries(offs.flatMap(u => { const t = DB.q('targets').find(x => x.userId === u.id && x.month === m); return [['c_' + u.id, t?.count || 4], ['v_' + u.id, t?.value || 25000000]]; })), onSubmit: v => { offs.forEach(u => { const t = DB.q('targets').find(x => x.userId === u.id && x.month === m); const p = { count: v['c_' + u.id] || 0, value: v['v_' + u.id] || 0 }; if (t) DB.set('targets', t.id, p); else DB.add('targets', { userId: u.id, month: m, ...p }); }); const tt = DB.q('targets').find(x => x.userId === 'team' && x.month === m); const p = { count: sum(offs, u => v['c_' + u.id]), value: sum(offs, u => v['v_' + u.id]) }; if (tt) DB.set('targets', tt.id, p, { quiet: true }); else DB.add('targets', { userId: 'team', month: m, ...p }, { quiet: true }); toast('Targets saved'); render(); } }); };

<script>
'use strict';
/* Finance (M-FIN) including the embedded Tri-Pay screens */

const FIN_TABS = () => [{ k: 'confirm', l: 'Confirm payments', n: Stat.pendingPay().length || '' }, { k: 'payments', l: 'Payments' }, { k: 'collections', l: 'Collections' }, { k: 'commissions', l: 'Commissions' }, { k: 'invoices', l: 'Invoices' }, { k: 'expenses', l: 'Expenses' }, { k: 'budgets', l: 'Budgets' }, { k: 'reports', l: 'Reports' }, { k: 'tripay', l: 'Tri-Pay' }];
const finW = () => modAccess('finance') === 'write';

PAGES.finance = (parts, q) => {
  const tab = parts[0] || 'confirm'; const tl = FIN_TABS(); const pend = Stat.pendingPay();
  let body = ''; if (tab === 'confirm') body = finConfirm(); else if (tab === 'payments') body = finPayments(); else if (tab === 'collections') body = finCollections(); else if (tab === 'commissions') body = finCommissions(); else if (tab === 'invoices') body = finInvoices(); else if (tab === 'expenses') body = finExpenses(); else if (tab === 'budgets') body = finBudgets(); else if (tab === 'reports') body = finReports(); else if (tab === 'tripay') body = finTripay();
  openFromQuery('i', id => openInvoice(id)); openFromQuery('x', id => openExpense(id));
  return pageHead({ title: `Finance${pi('coins', true)}and collections`, sub: `${pend.length} payments to confirm · ${moneyShort(Stat.receivables())} receivable · ${moneyShort(sum(Stat.aging()))} overdue`, acts: finW() && can('fin.confirm') ? `<button class="btn primary" data-act="pay.new">${icon('plus', 'sm')} Record payment</button>` : '' }) + tabs('finance', tl, tab) + body;
};

/* ----- FIN-02 confirmation workspace ----- */
function payCard(p) {
  const s = DB.get('sales', p.saleId); const cl = DB.get('clients', p.clientId); const need = needConfirms(p); const next = s?.schedule.find(r => r.paid < r.amount - .5);
  const mine = (p.confirmations || []).some(c => c.by === SESS.uid); const own = p.recordedBy === SESS.uid; const can1 = can('fin.confirm') || can('fin.confirm2');
  const proof = p.proof ? (p.proof.startsWith('data:image') ? `<img src="${p.proof}" alt="Payment proof" style="width:100%;max-height:150px;object-fit:cover;border-radius:12px">` : `<div class="tag">${icon('file', 'sm')} ${esc(p.proofName)}</div>`) : `<div class="row" style="background:#fff;border-radius:12px;padding:12px;border:1px dashed #9cb59f">${icon('image')}<span class="small">${esc(p.proofName || 'No proof attached')}</span></div>`;
  return `<div class="card"><div class="row" style="margin-bottom:10px"><div class="stat"><b style="font-size:26px">${money(p.amount)}</b><span>${esc(p.method)} · ${fmtDate(p.date)} · ${esc(p.ref || 'no reference')}</span></div><span class="sp"></span><div style="text-align:right">${spill(p.status)}<div class="small muted" style="margin-top:6px">${p.channel === 'tripay' ? 'via Tri-Pay · ' : 'recorded by ' + esc(userName(p.recordedBy)) + ' · '}${ago(p.ts)}</div></div></div>${kv([['Client', cl ? `<a href="#/crm/client/${cl.id}">${esc(cl.name)}</a>` : '—'], ['Sale', esc(s?.no) + ' · ' + esc(s ? s.plotIds.map(i => plotLabel(DB.get('plots', i))).join('; ') : '')], ['Paying', next ? esc(next.label) + ' (due ' + fmtDate(next.due) + ')' : '—'], ['Balance', s ? money(saleBalance(s)) : '—'], ['Checks', need > 1 ? `Needs <b>${need}</b> officers (amount over ${money(DB.setting('secondApprovalAmount'))})` : p.channel === 'offline' ? 'Recorded outside Tri-Pay. A different officer must approve.' : 'One officer']])}<div style="margin:12px 0">${proof}</div>${(p.confirmations || []).length ? `<div class="alert ok" style="margin-bottom:12px">${icon('check', 'sm')}<span>Confirmed by ${esc(p.confirmations.map(c => userName(c.by)).join(', '))}. ${need - p.confirmations.length > 0 ? 'Waiting for a second officer.' : ''}</span></div>` : ''}${finW() && can1 ? `<div class="row"><button class="btn danger" data-act="pay.reject" data-id="${p.id}">Reject</button><span class="sp"></span>${own ? '<span class="small muted">You recorded this, so someone else must confirm.</span>' : mine ? '<span class="small muted">You already confirmed this.</span>' : `<button class="btn primary" data-act="pay.confirm" data-id="${p.id}">${icon('check', 'sm')} Confirm payment</button>`}</div>` : ''}</div>`;
}
function finConfirm() {
  const pend = Stat.pendingPay().sort(by(p => p.ts)); const recent = DB.q('payments').filter(p => ['confirmed', 'rejected'].includes(p.status)).sort(by(p => p.confirmedAt || p.rejectedAt || p.ts, -1));
  return `<div class="alert info" style="margin-bottom:14px">${icon('link', 'sm')}<span><b>Tri-Pay (embedded).</b> Clients pay in Tri-Pay. Nothing counts as paid until Finance confirms it here. Confirmation releases the receipt and posts to the ledger. Median time to receipt: <b>${Stat.medianReceiptMin()} min</b> (target under 5).</span></div>${pend.length ? `<div class="grid g2" style="margin-bottom:20px">${pend.map(payCard).join('')}</div>` : card('', emptyState('No payments are waiting for confirmation.', 'check'), { cls: 'white' })}<h3 style="margin:8px 0 12px;font-size:18px;font-weight:500">Recently decided</h3>` + table({ id: 'recentpay', title: 'Recent payment decisions', ps: 8, rows: () => recent.map(payRow), cols: payCols() });
}
const payRow = p => ({ ...p, clientName: DB.get('clients', p.clientId)?.name || '', saleNo: DB.get('sales', p.saleId)?.no || '' });
const payCols = () => [{ k: 'date', l: 'Date', r: p => fmtDate(p.date), sv: p => p.date }, { k: 'receiptNo', l: 'Receipt', r: p => p.docCode ? `<a href="#" data-act="doc.open" data-code="${p.docCode}">${esc(p.receiptNo)}</a>` : '—', x: p => p.receiptNo || '' }, { k: 'clientName', l: 'Client' }, { k: 'saleNo', l: 'Sale' }, { k: 'method', l: 'Method' }, { k: 'amount', l: 'Amount', num: true, r: p => money(p.amount) }, { k: 'status', l: 'Status', r: p => spill(p.status) + (p.rejectReason ? `<div class="small muted">${esc(p.rejectReason)}</div>` : ''), x: p => p.status }];
ACT['pay.confirm'] = el => { try { const r = confirmPayment(el.dataset.id); toast(r === 'first' ? 'First confirmation recorded. A second officer must confirm.' : 'Confirmed. Receipt released and posted to the ledger.'); render(); } catch (e) { toast(e.message, 'bad'); } };
ACT['pay.reject'] = el => askText('Reject payment', 'Reason (the client will see this in Tri-Pay)', n => { rejectPayment(el.dataset.id, n); toast('Payment rejected'); render(); }, { submit: 'Reject payment' });
function finPayments() {
  const rows = () => DB.q('payments').map(payRow);

  return table({ id: 'budgets', title: 'Budgets ' + fy.label, rows, ph: 'Search department or category', filters: [{ k: 'dept', l: 'Department', o: DB.q('depts').map(d => d.name), get: b => b.dept }], tools: finW() || isExec() ? `<button class="btn sm primary" data-act="bud.new">${icon('plus', 'sm')} Set budget</button>` : '', cols: [{ k: 'dept', l: 'Department' }, { k: 'cat', l: 'Category' }, { k: 'amount', l: 'Budget', num: true, r: b => money(b.amount) }, { k: 'act', l: 'Actual', num: true, r: b => money(b.act) }, { k: 'left', l: 'Remaining', num: true, r: b => `<span style="color:${b.left < 0 ? 'var(--err)' : 'inherit'}">${money(b.left)}</span>` }, { k: 'p', l: 'Used', r: b => `<div style="width:120px">${progress(b.act, b.amount, b.p > 85)}<div class="small muted">${b.p}%</div></div>`, sv: b => b.p, x: b => b.p + '%' }] });
}
ACT['bud.new'] = () => openForm({ title: 'Set departmental budget', fields: [{ n: 'dept', l: 'Department', t: 'select', req: true, o: DB.q('depts').map(d => d.name) }, { n: 'cat', l: 'Category', t: 'select', req: true, o: EXP_CATS }, { n: 'amount', l: 'Budget for ' + fiscalYear().label + ' (₦)', t: 'money', req: true, min: 1 }], onSubmit: v => { const ex = DB.q('budgets').find(b => b.dept === v.dept && b.cat === v.cat && b.fy === fiscalYear().label); if (ex) DB.set('budgets', ex.id, { amount: v.amount }); else DB.add('budgets', { ...v, fy: fiscalYear().label }); render(); } });

/* ----- FIN-10 reports ----- */
function finReports() {
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(today(), -i)); const dc = days.map(d => sum(DB.q('payments').filter(p => p.status === 'confirmed' && p.date === d), p => p.amount));
  const months = Stat.months(8); const inc = months.map(m => pnl(m + '-01', m + '-31').income);
  const age = Stat.aging(); const cp = DB.q('commissions').filter(c => ['approved'].includes(c.status));
  return `<div class="row wrap" style="margin-bottom:14px"><span class="sp"></span>${exportBtn('Daily collections', [{ l: 'Date', x: r => r.d }, { l: 'Collected', x: r => r.v }], () => days.map((d, i) => ({ d, v: dc[i] })))}${exportBtn('Monthly income', [{ l: 'Month', x: r => r.m }, { l: 'Income', x: r => r.v }], () => months.map((m, i) => ({ m, v: inc[i] })))}</div><div class="grid g2">${card('Daily collections (last 14 days)', pillBars({ labels: days.map(d => d.slice(8)), a: dc, fmt: moneyShort, cur: 13 }), { ic: 'coins' })}${card('Monthly income (ledger)', pillBars({ labels: months.map(m => monthLabel(m).split(' ')[0]), a: inc, fmt: moneyShort, cur: months.length - 1 }), { ic: 'trend' })}${card('Receivables', `<div class="stat" style="margin-bottom:12px"><b>${money(Stat.receivables())}</b><span>Total outstanding on active sales</span></div>${hbars(['0–30', '31–60', '61–90', '90+'].map((l, i) => ({ l: l + ' days overdue', v: age[i], warn: i > 1 })), moneyShort)}`, { ic: 'scale' })}${card('Commissions payable', `<div class="stat" style="margin-bottom:12px"><b>${money(sum(cp, c => c.amount))}</b><span>${cp.length} approved commissions awaiting payout</span></div>${hbars(Object.entries(cp.reduce((m, c) => { const k = commissionPayee(c); m[k] = (m[k] || 0) + c.amount; return m; }, {})).sort(by(x => x[1], -1)).slice(0, 6).map(([l, v]) => ({ l, v })), moneyShort) || ''}`, { ic: 'wallet' })}</div>`;
}

/* ----- Tri-Pay integration screen ----- */
function finTripay() {
  const wh = DB.q('webhooks').sort(by(w => w.ts, -1)); const confirmed = DB.q('payments').filter(p => p.status === 'confirmed'); const posted = DB.q('journals').filter(j => j.source === 'payment' && j.status === 'posted');
  const tp = sum(confirmed, p => p.amount), lg = sum(posted, j => j.total);
  return `<div class="grid g4" style="margin-bottom:16px">${tile({ ic: 'link', title: 'Webhooks (all time)', value: wh.length, sub: 'Signed, idempotent, retried on failure' })}${tile({ cls: 'tea', ic: 'check', title: 'Confirmed in Tri-Pay', value: moneyShort(tp), sub: confirmed.length + ' payments' })}${tile({ ic: 'calc', title: 'Posted to Tri-OP ledger', value: moneyShort(lg), sub: posted.length + ' journals' })}${tile({ cls: Math.abs(tp - lg) < 1 ? 'dark' : '', ic: 'scale', title: 'Daily reconciliation', value: Math.abs(tp - lg) < 1 ? 'Matched' : moneyShort(tp - lg), sub: 'Variance between Tri-Pay and ledger' })}</div>
  <div class="grid g2" style="align-items:start">${card('Client payment simulator (sandbox)', `<p class="muted" style="margin-bottom:12px">Stands in for the Tri-Pay client app: a client pays, uploads proof, and the payment shows as <b>Pending</b> in Confirm payments.</p><button class="btn primary" data-act="tp.sim">${icon('upload', 'sm')} Simulate client payment</button>`, { ic: 'wallet' })}${card('Integration contract', `<div class="stack" style="gap:8px"><div class="row">${icon('check', 'sm')}<span>Single sign-on: staff reach Tri-Pay screens with their Tri-OP login</span></div><div class="row">${icon('check', 'sm')}<span>Embedded screens: confirmation, commissions and the realtor network open inside Tri-OP</span></div><div class="row">${icon('check', 'sm')}<span>Webhooks: signed, idempotency key, retries with backoff, daily reconciliation report</span></div><div class="row">${icon('check', 'sm')}<span>Sandbox environment available from day 30</span></div></div>`, { ic: 'link' })}</div>
  <div style="margin-top:16px">${table({ id: 'webhooks', title: 'Tri-Pay webhook log', rows: () => wh, ps: 10, sort: { k: 'ts', dir: -1 }, filters: [{ k: 'dir', l: 'Direction', o: [['out', 'Tri-OP → Tri-Pay'], ['in', 'Tri-Pay → Tri-OP']], get: w => w.dir }, { k: 'status', l: 'Status', o: ['delivered', 'retrying', 'failed'], get: w => w.status }], onRow: w => openModal({ title: esc(w.event), body: `${kv([['Direction', w.dir === 'out' ? 'Tri-OP → Tri-Pay' : 'Tri-Pay → Tri-OP'], ['Idempotency key', esc(w.key)], ['Signature (HMAC-SHA256)', '<code>' + esc(w.sig) + '</code>'], ['Attempts', w.attempts], ['Status', spill(w.status)], ['Time', fmtDT(w.ts)]])}<div class="codebox" style="margin-top:12px">${esc(JSON.stringify(w.payload, null, 2))}</div>`, live: false }), cols: [{ k: 'ts', l: 'When', sv: w => w.ts, r: w => fmtDT(w.ts) }, { k: 'event', l: 'Event', r: w => `<code>${esc(w.event)}</code>`, x: w => w.event }, { k: 'dir', l: 'Direction', r: w => w.dir === 'out' ? 'Tri-OP → Tri-Pay' : 'Tri-Pay → Tri-OP', x: w => w.dir }, { k: 'key', l: 'Idempotency key', r: w => `<span class="small muted">${esc(w.key)}</span>`, x: w => w.key }, { k: 'status', l: 'Status', r: w => spill(w.status) }] })}</div>`;
}
ACT['tp.sim'] = () => { const sales = DB.q('sales').filter(s => ['active', 'pending'].includes(s.status) && saleBalance(s) > 0); openForm({ title: 'Simulate client payment', fields: [{ n: 'saleId', l: 'Client and sale', t: 'select', req: true, reform: true, o: sales.map(s => [s.id, (DB.get('clients', s.clientId)?.name || '') + ' · ' + s.no + ' · balance ' + moneyShort(saleBalance(s))]) }, { n: 'amount', l: 'Amount (₦)', t: 'money', req: true, min: 1, ph: 'Next instalment' }, { n: 'proof', l: 'Proof of transfer (image)', t: 'file', accept: 'image/*' }], onSubmit: v => { try { const s = DB.get('sales', v.saleId); const p = recordPayment({ saleId: v.saleId, amount: v.amount, method: 'Bank transfer', channel: 'tripay', date: today(), ref: 'TRF' + Math.floor(Math.random() * 1e8), proof: v.proof, proofName: v.proof_name || 'transfer-proof.jpg' }); usersWithRole('finance').forEach(u => notify(u.id, 'New payment awaiting confirmation', money(v.amount) + ' · ' + s.no, '#/finance/confirm')); toast('Payment submitted in Tri-Pay. It now shows as Pending.'); render(); } catch (e) { toast(e.message, 'bad'); return false; } } }); };

</script>
<script>
'use strict';
/* Accounting (M-ACC): chart of accounts, journals, payables, bank, statements, period close, tax, fixed assets, payroll */

const ACC_TABS = [{ k: 'accounts', l: 'Chart of accounts' }, { k: 'journals', l: 'Journals' }, { k: 'payables', l: 'Payables' }, { k: 'bank', l: 'Bank' }, { k: 'statements', l: 'Statements' }, { k: 'periods', l: 'Period close' }, { k: 'tax', l: 'Tax' }, { k: 'assets', l: 'Fixed assets' }, { k: 'payroll', l: 'Payroll journal' }];
const accW = () => modAccess('accounting') === 'write' && can('acc.journal');

PAGES.accounting = (parts, q) => {
  const tab = parts[0] || 'accounts'; const fy = fiscalYear();
  const pend = DB.q('journals').filter(j => j.status === 'pending').length;
  let body = ''; if (tab === 'accounts') body = accAccounts(); else if (tab === 'journals') body = accJournals(); else if (tab === 'payables') body = accPayables(); else if (tab === 'bank') body = accBank(); else if (tab === 'statements') body = accStatements(parts[1] || 'pnl'); else if (tab === 'periods') body = accPeriods(); else if (tab === 'tax') body = accTax(); else if (tab === 'assets') body = accAssets(); else if (tab === 'payroll') body = accPayroll();
  openFromQuery('j', id => openJournal(id));
  return pageHead({ title: `Accounting${pi('calc', true)}built in`, sub: `${esc(company().name)} · ${fy.label} (1 July – 30 June) · double-entry ledger · ${pend} journals awaiting approval`, acts: accW() ? `<button class="btn primary" data-act="jv.new">${icon('plus', 'sm')} Manual journal</button>` : '' }) + tabs('accounting', ACC_TABS, tab) + body;
};

/* ---------- chart of accounts ---------- */
function accAccounts() {
  const fy = fiscalYear(); const tb = trialBalance(null, today()); const rows = () => trialBalance(null, today()).map(a => ({ id: a.code, ...a }));
  return table({ id: 'coa', title: 'Chart of accounts', rows, ph: 'Search accounts', sort: { k: 'code', dir: 1 }, ps: 30, onRow: a => openLedger(a.code), filters: [{ k: 'type', l: 'Type', o: Object.entries(ACCT_TYPES), get: a => a.type }], tools: accW() ? `<button class="btn sm primary" data-act="acct.new">${icon('plus', 'sm')} Add account</button>` : '', cols: [{ k: 'code', l: 'Code' }, { k: 'name', l: 'Account' }, { k: 'type', l: 'Type', r: a => ACCT_TYPES[a.type], x: a => ACCT_TYPES[a.type] }, { k: 'dr', l: 'Debits', num: true, r: a => money(a.dr) }, { k: 'cr', l: 'Credits', num: true, r: a => money(a.cr) }, { k: 'bal', l: 'Balance', num: true, r: a => money(a.bal) }] });
}
ACT['acct.new'] = () => openForm({ title: 'Add account', fields: [{ n: 'code', l: 'Code', req: true, half: true, vf: v => acctByCode(v) ? 'This code already exists.' : '' }, { n: 'type', l: 'Type', t: 'select', req: true, half: true, o: Object.entries(ACCT_TYPES) }, { n: 'name', l: 'Account name', req: true }], onSubmit: v => { DB.add('accounts', v); render(); } });
function openLedger(code) {
  openDrawer(() => { const a = acctByCode(code); if (!a) return null; const debitNormal = ['asset', 'expense'].includes(a.type); let run = 0; const lines = []; DB.q('journals').filter(j => j.status === 'posted').sort(by(j => j.date + j.no)).forEach(j => j.lines.filter(l => l.acct === code).forEach(l => { run += debitNormal ? l.dr - l.cr : l.cr - l.dr; lines.push({ j, l, run }); }));
    return { title: esc(code + ' · ' + a.name), body: `<div class="stat" style="margin-bottom:14px"><b>${money(run)}</b><span>${ACCT_TYPES[a.type]} · ${lines.length} postings</span></div><table class="tbl"><thead><tr><th>Date</th><th>Journal</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>${lines.slice(-60).reverse().map(x => `<tr class="clk" data-act="jv.open" data-id="${x.j.id}"><td>${fmtDate(x.j.date)}</td><td>${esc(x.j.no)}<div class="small muted">${esc(x.j.memo)}</div></td><td class="num">${x.l.dr ? money(x.l.dr) : ''}</td><td class="num">${x.l.cr ? money(x.l.cr) : ''}</td><td class="num">${money(x.run)}</td></tr>`).join('')}</tbody></table>${lines.length > 60 ? '<p class="small muted">Showing the latest 60 postings.</p>' : ''}`, foot: '<button class="btn" data-act="ov.close">Close</button>' };
  }, { wide: true });
}

/* ---------- journals ---------- */
function journalTable(j) { return `<table class="tbl"><thead><tr><th>Account</th><th>Dept</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>${j.lines.map(l => `<tr><td>${esc(acctLabel(l.acct))}</td><td>${esc(l.dept || '')}</td><td class="num">${l.dr ? money(l.dr) : ''}</td><td class="num">${l.cr ? money(l.cr) : ''}</td></tr>`).join('')}<tr><th colspan="2">Total</th><th class="num">${money(sum(j.lines, l => l.dr))}</th><th class="num">${money(sum(j.lines, l => l.cr))}</th></tr></tbody></table>`; }
function accJournals() {
  const rows = () => DB.q('journals').map(j => ({ ...j, byName: userName(j.by) }));
  return table({ id: 'journals', title: 'Journals', rows, ph: 'Search journals, memos or sources', sort: { k: 'date', dir: -1 }, onRow: j => openJournal(j.id), filters: [{ k: 'status', l: 'Status', o: ['posted', 'pending', 'rejected', 'reversed'], get: j => j.status }, { k: 'source', l: 'Source', o: ['manual', 'payment', 'sale', 'commission', 'expense', 'bill', 'invoice', 'payroll', 'depr', 'asset', 'tax'], get: j => j.source }], cols: [{ k: 'no', l: 'Journal' }, { k: 'date', l: 'Date', r: j => fmtDate(j.date), sv: j => j.date }, { k: 'memo', l: 'Memo' }, { k: 'source', l: 'Source', r: j => `<span class="tag">${esc(j.source)}</span>`, x: j => j.source }, { k: 'total', l: 'Amount', num: true, r: j => money(j.total) }, { k: 'status', l: 'Status', r: j => spill(j.status) }] });
}
ACT['jv.open'] = el => openJournal(el.dataset.id);
function openJournal(id) {
  openDrawer(() => { const j = DB.get('journals', id); if (!j) return null; const a = DB.q('approvals').find(x => x.type === 'journal' && x.ref === id);
    return { title: esc(j.no) + ' · ' + esc(j.memo), body: `<div class="row" style="margin-bottom:12px">${spill(j.status)}<span class="tag">${esc(j.source)}</span></div>${kv([['Date', fmtDate(j.date)], ['Raised by', esc(userName(j.by))], ['Reference', esc(j.ref || '—')], j.note ? ['Note', esc(j.note)] : null])}<div class="sec"><h4>Lines</h4>${journalTable(j)}</div>${a ? `<div class="sec"><h4>Approval</h4>${chainView(a)}</div>` : ''}`, foot: (a && canDecide(a) ? `<button class="btn danger" data-act="appr.reject" data-id="${a.id}">Reject</button><button class="btn primary" data-act="appr.approve" data-id="${a.id}">Approve</button>` : '') + (j.status === 'posted' && accW() && j.source === 'manual' ? `<button class="btn" data-act="jv.reverse" data-id="${id}">Reverse</button>` : '') || '<button class="btn" data-act="ov.close">Close</button>' };
  }, { wide: true });
}
ACT['jv.reverse'] = el => { const j = DB.get('journals', el.dataset.id); askText('Reverse journal', 'Reason', n => { try { const r = postJournal({ date: today(), memo: 'Reversal of ' + j.no + ': ' + n, lines: j.lines.map(l => ({ acct: l.acct, dr: l.cr, cr: l.dr, dept: l.dept })), source: 'manual', ref: j.id }); DB.set('journals', j.id, { status: 'reversed' }); toast('Reversed as ' + r.no); render(); } catch (e) { toast(e.message, 'bad'); } }); };
let JF = null;
ACT['jv.new'] = () => { JF = { date: today(), memo: '', lines: [{ acct: '', dr: '', cr: '', dept: '' }, { acct: '', dr: '', cr: '', dept: '' }] }; const id = openModal({ title: 'Manual journal', xl: true, live: false, body: jfBody(), foot: '<button class="btn" data-act="ov.close">Cancel</button><button class="btn primary" data-act="jv.submit">Submit for approval</button>' }); OV.stack.find(e => e.id === id).root.addEventListener('input', jfInput); };
function jfBody() {
  const accts = DB.q('accounts').sort(by(a => a.code));
  return `<div class="fgrid"><div class="fld"><label>Journal date</label><input type="date" id="jf-date" value="${JF.date}"></div><div class="fld"><label>Memo</label><input id="jf-memo" value="${esc(JF.memo)}" placeholder="What is this for?"></div></div><table class="tbl" style="margin-top:12px"><thead><tr><th>Account</th><th>Department</th><th class="num">Debit</th><th class="num">Credit</th><th></th></tr></thead><tbody>${JF.lines.map((l, i) => `<tr><td><select data-jf="acct" data-i="${i}" style="width:100%;border:1px solid #C6D8C4;border-radius:10px;padding:8px">${opts(accts.map(a => [a.code, a.code + ' · ' + a.name]), l.acct, 'Select account')}</select></td><td><select data-jf="dept" data-i="${i}" style="border:1px solid #C6D8C4;border-radius:10px;padding:8px">${opts(DB.q('depts').map(d => d.name), l.dept, '—')}</select></td><td><input type="number" data-jf="dr" data-i="${i}" value="${l.dr}" min="0" style="width:130px;text-align:right;border:1px solid #C6D8C4;border-radius:10px;padding:8px"></td><td><input type="number" data-jf="cr" data-i="${i}" value="${l.cr}" min="0" style="width:130px;text-align:right;border:1px solid #C6D8C4;border-radius:10px;padding:8px"></td><td><button class="btn sm ghost" data-act="jv.del" data-i="${i}" aria-label="Remove line">${icon('x', 'sm')}</button></td></tr>`).join('')}</tbody></table><div class="row" style="margin-top:10px"><button class="btn sm" data-act="jv.add">${icon('plus', 'sm')} Add line</button><span class="sp"></span><span id="jf-bal"></span></div><p class="small muted" style="margin-top:8px">Manual journals need approval from a different officer before they post${'' }.</p>`;
}
function jfTotals() { const dr = sum(JF.lines, l => l.dr), cr = sum(JF.lines, l => l.cr); const el = $('#jf-bal'); if (el) el.innerHTML = Math.abs(dr - cr) < .01 && dr > 0 ? `<span class="pill ok">Balanced · ${money(dr)}</span>` : `<span class="pill warn">Out of balance by ${money(Math.abs(dr - cr))} (Dr ${money(dr)} · Cr ${money(cr)})</span>`; }
function jfInput(e) { const t = e.target; if (t.id === 'jf-date') JF.date = t.value; else if (t.id === 'jf-memo') JF.memo = t.value; else if (t.dataset.jf) { JF.lines[+t.dataset.i][t.dataset.jf] = t.dataset.jf === 'dr' || t.dataset.jf === 'cr' ? t.value : t.value; } jfTotals(); }
const jfRepaint = () => { const e = OV.stack[OV.stack.length - 1]; paintOverlay(e, { title: 'Manual journal', body: jfBody(), foot: '<button class="btn" data-act="ov.close">Cancel</button><button class="btn primary" data-act="jv.submit">Submit for approval</button>' }); jfTotals(); };
ACT['jv.add'] = () => { JF.lines.push({ acct: '', dr: '', cr: '', dept: '' }); jfRepaint(); };
ACT['jv.del'] = el => { if (JF.lines.length > 2) JF.lines.splice(+el.dataset.i, 1); jfRepaint(); };
setTimeout(() => document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.jf && JF) jfInput(e); }), 0);
ACT['jv.submit'] = () => {
  const lines = JF.lines.filter(l => l.acct && (+l.dr || +l.cr)).map(l => ({ acct: l.acct, dr: +l.dr || 0, cr: +l.cr || 0, dept: l.dept }));
  if (!JF.memo.trim()) return toast('Add a memo so approvers know what this is for.', 'warn'); if (lines.length < 2) return toast('A journal needs at least two lines.', 'warn');
  const dr = sum(lines, l => l.dr), cr = sum(lines, l => l.cr); if (Math.abs(dr - cr) > .01) return toast('Debits and credits must be equal before you submit.', 'bad'); if (periodClosed(JF.date)) return toast(monthLabel(monthKey(JF.date)) + ' is closed. Use a date in an open period.', 'bad');
  try { const j = postJournal({ date: JF.date, memo: JF.memo, lines, source: 'manual', status: 'pending' }); startApproval({ type: 'journal', ref: j.id, title: j.no + ' · ' + JF.memo, amount: dr, meta: { link: '#/accounting/journals?j=' + j.id } }); closeOverlay(); toast('Submitted for approval'); render(); } catch (e) { toast(e.message, 'bad'); }
};

/* ---------- payables & receivables ---------- */
function accPayables() {
  const bills = () => DB.q('bills').map(b => ({ ...b, vendor: DB.get('vendors', b.vendorId)?.name || '', net: b.amount + b.vat - (b.whtAmt || 0) }));
  const unpaidInv = DB.q('invoices').filter(i => i.status === 'sent'); const t = today();
  const bk = [0, 0, 0, 0]; unpaidInv.forEach(i => { const d = Math.max(0, daysBetween(i.due, t)); bk[d <= 30 ? 0 : d <= 60 ? 1 : d <= 90 ? 2 : 3] += i.total; });
  return `<div class="grid g3" style="margin-bottom:16px">${tile({ ic: 'wallet', title: 'Payable to vendors', value: moneyShort(sum(DB.q('bills').filter(b => b.status !== 'paid'), b => b.amount + b.vat - (b.whtAmt || 0))), sub: DB.q('bills').filter(b => b.status !== 'paid').length + ' open bills' })}${tile({ cls: 'tea', ic: 'receipt', title: 'Receivable (other income)', value: moneyShort(sum(unpaidInv, i => i.total)), sub: unpaidInv.length + ' invoices · ' + moneyShort(bk[1] + bk[2] + bk[3]) + ' overdue' })}${tile({ cls: 'dark', ic: 'users', title: 'Vendors', value: DB.q('vendors').length })}</div>` +
